<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 336" width="560" height="336" role="img" aria-labelledby="title description">
  <title id="title">Lens incremental checking design</title>
  <desc id="description">A body edit invalidates its check. If the public signature is stable, downstream queries can reuse prior results.</desc>
  <style>
    :root { --canvas: #111a25; --panel: #1b2735; --arrow: #788b9e; --shared: #83dacc; --muted: #bac7d6; --text: #e8edf5; --error: #ff9fae; --exclusive: #ffbf7f; }
    @media (prefers-color-scheme: light) { :root { --canvas: #f7f5f0; --panel: #eeede7; --arrow: #535852; --shared: #006b80; --muted: #535852; --text: #1b2030; --error: #9e2438; --exclusive: #a24800; } }
  </style>
  <defs><marker id="teal" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--shared)"/></marker><marker id="gold" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--exclusive)"/></marker><marker id="red" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--error)"/></marker></defs>
  <rect width="560" height="336" fill="var(--canvas)" rx="10"/>
  <g font-family="Inter, Arial, sans-serif">
  <rect x="20" y="106" width="138" height="118" rx="8" fill="var(--panel)" stroke="var(--exclusive)" stroke-width="1.6"/>
  <text x="89" y="134" text-anchor="middle" font-size="15" font-weight="500" fill="var(--exclusive)">Keystroke edit</text>
  <text x="89" y="157" text-anchor="middle" font-size="15" font-weight="500" fill="var(--text)" font-family="JetBrains Mono, ui-monospace, monospace">fn f body</text>
  <text x="89" y="180" text-anchor="middle" font-size="13" font-weight="500" fill="var(--muted)" font-family="JetBrains Mono, ui-monospace, monospace">tx. (partial)</text>
  <text x="89" y="203" text-anchor="middle" font-size="11" font-weight="500" fill="var(--arrow)" font-family="JetBrains Mono, ui-monospace, monospace">rowan ErrorNode</text>
  <path d="M158 140 H180 V72 H196" fill="none" stroke="var(--exclusive)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#gold)"/>
  <path d="M158 190 H180 V232 H196" fill="none" stroke="var(--shared)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/>
  <rect x="200" y="28" width="162" height="88" rx="8" fill="var(--panel)" stroke="var(--exclusive)" stroke-width="1.6"/>
  <text x="281" y="54" text-anchor="middle" font-size="15" font-weight="500" fill="var(--exclusive)">Local body PCG</text>
  <text x="281" y="76" text-anchor="middle" font-size="13" font-weight="500" fill="var(--text)">Recomputed live</text>
  <text x="281" y="97" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)" font-family="JetBrains Mono, ui-monospace, monospace">PoisonedRecovery</text>
  <path d="M362 72 H388" fill="none" stroke="var(--exclusive)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#gold)"/>
  <rect x="392" y="28" width="148" height="88" rx="8" fill="var(--panel)" stroke="var(--exclusive)" stroke-width="1.6"/>
  <text x="466" y="54" text-anchor="middle" font-size="14" font-weight="500" fill="var(--exclusive)">IDE dot-complete</text>
  <text x="466" y="76" text-anchor="middle" font-size="12" font-weight="500" fill="var(--text)" font-family="JetBrains Mono, ui-monospace, monospace">tx.commit / abort</text>
  <text x="466" y="97" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">0 leak cascade</text>
  <rect x="200" y="178" width="162" height="112" rx="8" fill="var(--panel)" stroke="var(--shared)" stroke-width="1.6"/>
  <text x="281" y="205" text-anchor="middle" font-size="15" font-weight="500" fill="var(--shared)">Signature query</text>
  <text x="281" y="228" text-anchor="middle" font-size="13" font-weight="500" fill="var(--text)">Hash unchanged</text>
  <text x="281" y="250" text-anchor="middle" font-size="14" font-weight="500" fill="var(--shared)">Early cutoff!</text>
  <text x="281" y="272" text-anchor="middle" font-size="12" font-weight="500" fill="var(--arrow)" font-family="JetBrains Mono, ui-monospace, monospace">(modes, eff, sig)</text>
  <path d="M362 208 H388" fill="none" stroke="var(--shared)" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#teal)"/>
  <path d="M362 268 H388" fill="none" stroke="var(--shared)" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#teal)"/>
  <rect x="392" y="164" width="148" height="68" rx="8" fill="var(--panel)" stroke="var(--shared)" stroke-width="1.6"/>
  <text x="466" y="192" text-anchor="middle" font-size="14" font-weight="500" fill="var(--shared)">Caller modules</text>
  <text x="466" y="214" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">Cached · 0 recheck</text>
  <rect x="392" y="244" width="148" height="68" rx="8" fill="var(--panel)" stroke="var(--shared)" stroke-width="1.6"/>
  <text x="466" y="272" text-anchor="middle" font-size="14" font-weight="500" fill="var(--shared)" font-family="JetBrains Mono, ui-monospace, monospace">Lean .olean</text>
  <text x="466" y="294" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">Proofs preserved</text>
  </g>
</svg>
