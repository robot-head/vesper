<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 336" width="560" height="336" role="img" aria-labelledby="title description">
  <title id="title">Flux incremental join and frontier</title>
  <desc id="description">Input changes join with retained state. The circuit consolidates weights and emits output deltas under a frontier ticket.</desc>
  <style>
    :root { --canvas: #111a25; --panel: #1b2735; --border: #536479; --shared: #83dacc; --muted: #bac7d6; --text: #e8edf5; --error: #ff9fae; --exclusive: #ffbf7f; }
    @media (prefers-color-scheme: light) { :root { --canvas: #f7f5f0; --panel: #eeede7; --border: #747874; --shared: #006b80; --muted: #535852; --text: #1b2030; --error: #9e2438; --exclusive: #a24800; } }
  </style>
  <defs><marker id="teal" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--shared)"/></marker><marker id="gold" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--exclusive)"/></marker><marker id="red" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--error)"/></marker></defs>
  <rect width="560" height="336" fill="var(--canvas)" rx="10"/>
  <g font-family="Inter, Arial, sans-serif">
  <rect x="22" y="66" width="118" height="82" rx="8" fill="var(--panel)" stroke="var(--exclusive)" stroke-width="1.6"/>
  <text x="81" y="94" text-anchor="middle" font-size="17" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">Delta S</text>
  <text x="81" y="116" text-anchor="middle" font-size="12" font-weight="500" fill="var(--text)">CDC Z-set tile</text>
  <text x="81" y="136" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">+1 / -1 weight</text>
  <path d="M140 107 H178" fill="none" stroke="var(--exclusive)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#gold)"/>
  <path d="M156 107 V248 H178" fill="none" stroke="var(--shared)" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#teal)"/>
  <rect x="182" y="66" width="144" height="82" rx="8" fill="var(--panel)" stroke="var(--shared)" stroke-width="1.6"/>
  <text x="254" y="94" text-anchor="middle" font-size="16" font-weight="500" fill="var(--shared)">Bilinear Join</text>
  <text x="254" y="116" text-anchor="middle" font-size="13" font-weight="500" fill="var(--text)" font-family="JetBrains Mono, ui-monospace, monospace">dS &gt;&lt; z^-1(I)</text>
  <text x="254" y="136" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">tiled(16) SIMD</text>
  <rect x="182" y="206" width="144" height="86" rx="8" fill="var(--panel)" stroke="var(--border)" stroke-width="1.6"/>
  <text x="254" y="234" text-anchor="middle" font-size="16" font-weight="500" fill="var(--text)" font-family="JetBrains Mono, ui-monospace, monospace">z^-1 Delay</text>
  <text x="254" y="256" text-anchor="middle" font-size="13" font-weight="500" fill="var(--shared)" font-family="JetBrains Mono, ui-monospace, monospace">ZSetLsmSpine</text>
  <text x="254" y="276" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">Indexed history</text>
  <path d="M254 206 V152" fill="none" stroke="var(--shared)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/>
  <path d="M326 107 H362" fill="none" stroke="var(--shared)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/>
  <rect x="366" y="66" width="172" height="82" rx="8" fill="var(--panel)" stroke="var(--shared)" stroke-width="1.6"/>
  <text x="452" y="94" text-anchor="middle" font-size="17" font-weight="500" fill="var(--shared)" font-family="JetBrains Mono, ui-monospace, monospace">Delta Out</text>
  <text x="452" y="116" text-anchor="middle" font-size="13" font-weight="500" fill="var(--text)">Consolidated Z-set</text>
  <text x="452" y="136" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)" font-family="JetBrains Mono, ui-monospace, monospace">+1 - 1 == 0 elided</text>
  <rect x="366" y="206" width="172" height="86" rx="8" fill="var(--panel)" stroke="var(--exclusive)" stroke-width="1.6"/>
  <text x="452" y="234" text-anchor="middle" font-size="15" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">FrontierTicket</text>
  <text x="452" y="256" text-anchor="middle" font-size="13" font-weight="500" fill="var(--text)">linear watermark</text>
  <text x="452" y="276" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)" font-family="JetBrains Mono, ui-monospace, monospace">advance / retire</text>
  <path d="M452 206 V152" fill="none" stroke="var(--exclusive)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#gold)"/>
  <text x="462" y="184" text-anchor="start" font-size="12" font-weight="500" fill="var(--exclusive)">gates</text>
  </g>
</svg>
