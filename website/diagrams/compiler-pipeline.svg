<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" width="560" height="372" role="img" aria-labelledby="title description">
  <title id="title">Five stages in the compiler design</title>
  <desc id="description">Source passes through syntax analysis, resolution, place checking, and optimization before native emission or Lean extraction.</desc>
  <style>
    :root { --canvas: #111a25; --panel: #1b2735; --border: #536479; --arrow: #788b9e; --shared: #83dacc; --muted: #bac7d6; --text: #e8edf5; --error: #ff9fae; --exclusive: #ffbf7f; }
    @media (prefers-color-scheme: light) { :root { --canvas: #f7f5f0; --panel: #eeede7; --border: #747874; --arrow: #535852; --shared: #006b80; --muted: #535852; --text: #1b2030; --error: #9e2438; --exclusive: #a24800; } }
  </style>
  <defs><marker id="teal" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--shared)"/></marker><marker id="gold" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--exclusive)"/></marker><marker id="red" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--error)"/></marker></defs>
  <rect width="560" height="372" fill="var(--canvas)" rx="10"/>
  <g font-family="Inter, Arial, sans-serif">
  <rect x="22" y="22" width="82" height="328" rx="8" fill="var(--panel)" stroke="var(--shared)" stroke-width="1.6"/>
  <text x="63" y="56" text-anchor="middle" font-size="17" font-weight="500" fill="var(--shared)" font-family="JetBrains Mono, ui-monospace, monospace">salsa</text>
  <text x="63" y="78" text-anchor="middle" font-size="13" font-weight="500" fill="var(--text)">query DB</text>
  <text x="63" y="128" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">demand</text>
  <text x="63" y="146" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">driven</text>
  <text x="63" y="198" text-anchor="middle" font-size="12" font-weight="500" fill="var(--shared)">early</text>
  <text x="63" y="216" text-anchor="middle" font-size="12" font-weight="500" fill="var(--shared)">cutoff</text>
  <text x="63" y="272" text-anchor="middle" font-size="13" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">query</text>
  <text x="63" y="290" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">cache</text>
  <path d="M104 45 H124" fill="none" stroke="var(--shared)" stroke-width="2.0" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#teal)"/>
  <path d="M104 109 H124" fill="none" stroke="var(--shared)" stroke-width="2.0" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#teal)"/>
  <path d="M104 173 H124" fill="none" stroke="var(--shared)" stroke-width="2.0" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#teal)"/>
  <path d="M104 237 H124" fill="none" stroke="var(--shared)" stroke-width="2.0" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#teal)"/>
  <rect x="128" y="22" width="410" height="46" rx="8" fill="var(--panel)" stroke="var(--border)" stroke-width="1.6"/>
  <text x="144" y="49" text-anchor="start" font-size="14" font-weight="500" fill="var(--text)" font-family="JetBrains Mono, ui-monospace, monospace">1 · vesper-syntax</text>
  <text x="524" y="49" text-anchor="end" font-size="13" font-weight="500" fill="var(--muted)">SIMD lex + rowan CST</text>
  <path d="M333 68 V84" fill="none" stroke="var(--shared)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/>
  <rect x="128" y="86" width="410" height="46" rx="8" fill="var(--panel)" stroke="var(--border)" stroke-width="1.6"/>
  <text x="144" y="113" text-anchor="start" font-size="14" font-weight="500" fill="var(--text)" font-family="JetBrains Mono, ui-monospace, monospace">2 · Resolve names</text>
  <text x="524" y="113" text-anchor="end" font-size="13" font-weight="500" fill="var(--muted)">Sugar, WASI macros, modal HIR</text>
  <path d="M333 132 V148" fill="none" stroke="var(--exclusive)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#gold)"/>
  <rect x="128" y="150" width="410" height="46" rx="8" fill="var(--panel)" stroke="var(--exclusive)" stroke-width="1.6"/>
  <text x="144" y="177" text-anchor="start" font-size="14" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">3 · Check places</text>
  <text x="524" y="177" text-anchor="end" font-size="13" font-weight="500" fill="var(--muted)">PCG loans + Bitwuzla</text>
  <path d="M333 196 V212" fill="none" stroke="var(--exclusive)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#gold)"/>
  <rect x="128" y="214" width="410" height="46" rx="8" fill="var(--panel)" stroke="var(--border)" stroke-width="1.6"/>
  <text x="144" y="241" text-anchor="start" font-size="14" font-weight="500" fill="var(--text)" font-family="JetBrains Mono, ui-monospace, monospace">4 · Optimize</text>
  <text x="524" y="241" text-anchor="end" font-size="13" font-weight="500" fill="var(--muted)">Effectful e-graph saturation</text>
  <path d="M228 260 V282" fill="none" stroke="var(--exclusive)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#gold)"/>
  <path d="M438 260 V282" fill="none" stroke="var(--shared)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/>
  <rect x="128" y="284" width="200" height="66" rx="8" fill="var(--panel)" stroke="var(--exclusive)" stroke-width="1.6"/>
  <text x="228" y="309" text-anchor="middle" font-size="13" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">5A · Native emission</text>
  <text x="228" y="329" text-anchor="middle" font-size="12" font-weight="500" fill="var(--text)">Cranelift machine code</text>
  <text x="228" y="344" text-anchor="middle" font-size="11" font-weight="500" fill="var(--arrow)">x86_64 · Arm64</text>
  <rect x="338" y="284" width="200" height="66" rx="8" fill="var(--panel)" stroke="var(--shared)" stroke-width="1.6"/>
  <text x="438" y="309" text-anchor="middle" font-size="13" font-weight="500" fill="var(--shared)" font-family="JetBrains Mono, ui-monospace, monospace">5B · Lean extraction</text>
  <text x="438" y="329" text-anchor="middle" font-size="12" font-weight="500" fill="var(--text)">Pure Lean 4 extraction</text>
  <text x="438" y="344" text-anchor="middle" font-size="11" font-weight="500" fill="var(--arrow)">Audit theorem assumptions</text>
  </g>
</svg>
