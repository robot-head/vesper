<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 324" width="560" height="324" role="img" aria-labelledby="title description">
  <title id="title">Proposed continuation fission</title>
  <desc id="description">The normal continuation keeps the ownership obligation. The proposed failure continuation runs cleanup or transfers custody to a quarantine cell.</desc>
  <style>
    :root { --canvas: #111a25; --panel: #1b2735; --border: #536479; --arrow: #788b9e; --shared: #83dacc; --muted: #bac7d6; --text: #e8edf5; --error: #ff9fae; --exclusive: #ffbf7f; }
    @media (prefers-color-scheme: light) { :root { --canvas: #f7f5f0; --panel: #eeede7; --border: #747874; --arrow: #535852; --shared: #006b80; --muted: #535852; --text: #1b2030; --error: #9e2438; --exclusive: #a24800; } }
  </style>
  <defs><marker id="teal" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--shared)"/></marker><marker id="gold" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--exclusive)"/></marker><marker id="red" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--error)"/></marker></defs>
  <rect width="560" height="324" fill="var(--canvas)" rx="10"/>
  <g font-family="Inter, Arial, sans-serif">
  <rect x="20" y="108" width="124" height="108" rx="8" fill="var(--panel)" stroke="var(--exclusive)" stroke-width="1.6"/>
  <text x="82" y="136" text-anchor="middle" font-size="14" font-weight="500" fill="var(--muted)">Live frame</text>
  <text x="82" y="162" text-anchor="middle" font-size="15" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">linear tx</text>
  <text x="82" y="184" text-anchor="middle" font-size="13" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">escrow buf</text>
  <text x="82" y="204" text-anchor="middle" font-size="12" font-weight="500" fill="var(--arrow)">Stack-local design</text>
  <path d="M144 162 H166" fill="none" stroke="var(--exclusive)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#gold)"/>
  <rect x="170" y="120" width="124" height="84" rx="8" fill="var(--panel)" stroke="var(--border)" stroke-width="1.6"/>
  <text x="232" y="147" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)" font-family="JetBrains Mono, ui-monospace, monospace">[T-Let-Fission]</text>
  <text x="232" y="170" text-anchor="middle" font-size="14" font-weight="500" fill="var(--text)" font-family="JetBrains Mono, ui-monospace, monospace">k_ok &amp; k_err</text>
  <text x="232" y="191" text-anchor="middle" font-size="12" font-weight="500" fill="var(--arrow)">additive pair</text>
  <path d="M294 140 H314 V62 H340" fill="none" stroke="var(--shared)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/>
  <text x="334" y="48" text-anchor="end" font-size="12" font-weight="500" fill="var(--shared)" font-family="JetBrains Mono, ui-monospace, monospace">k_ok</text>
  <path d="M294 162 H340" fill="none" stroke="var(--exclusive)" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#gold)"/>
  <text x="320" y="151" text-anchor="middle" font-size="11" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">k_err</text>
  <path d="M294 184 H314 V262 H340" fill="none" stroke="var(--error)" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#red)"/>
  <text x="334" y="282" text-anchor="end" font-size="12" font-weight="500" fill="var(--error)">? / Cancel</text>
  <rect x="344" y="24" width="196" height="76" rx="8" fill="var(--panel)" stroke="var(--shared)" stroke-width="1.6"/>
  <text x="442" y="48" text-anchor="middle" font-size="15" font-weight="500" fill="var(--shared)">Normal · k.resume()</text>
  <text x="442" y="69" text-anchor="middle" font-size="13" font-weight="500" fill="var(--text)" font-family="JetBrains Mono, ui-monospace, monospace">tx.commit() / await</text>
  <text x="442" y="88" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">Exact-once linear consume</text>
  <rect x="344" y="124" width="196" height="76" rx="8" fill="var(--panel)" stroke="var(--exclusive)" stroke-width="1.6"/>
  <text x="442" y="148" text-anchor="middle" font-size="15" font-weight="500" fill="var(--exclusive)">Abort · inline k.reap()</text>
  <text x="442" y="169" text-anchor="middle" font-size="13" font-weight="500" fill="var(--text)" font-family="JetBrains Mono, ui-monospace, monospace">reap(sink self)</text>
  <text x="442" y="188" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">Proposed stack cleanup</text>
  <rect x="344" y="224" width="196" height="76" rx="8" fill="var(--panel)" stroke="var(--error)" stroke-width="1.6"/>
  <text x="442" y="248" text-anchor="middle" font-size="15" font-weight="500" fill="var(--error)">EscrowCell quarantine</text>
  <text x="442" y="269" text-anchor="middle" font-size="13" font-weight="500" fill="var(--text)">Detached until CQE</text>
  <text x="442" y="288" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)" font-family="JetBrains Mono, ui-monospace, monospace">EscrowMem &lt;= B budget</text>
  </g>
</svg>
