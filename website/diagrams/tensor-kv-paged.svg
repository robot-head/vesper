  <text x="95" y="216" text-anchor="middle" font-size="11.5" font-weight="500" fill="var(--muted)" font-family="JetBrains Mono, ui-monospace, monospace">Blk 1 · tok 16..31</text>
  <text x="95" y="242" text-anchor="middle" font-size="11.5" font-weight="500" fill="var(--muted)" font-family="JetBrains Mono, ui-monospace, monospace">Blk 2 · tok 32..41</text>
