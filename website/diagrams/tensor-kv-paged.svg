  <text x="95" y="71" text-anchor="middle" font-size="13" font-weight="500" fill="var(--text)" font-family="JetBrains Mono, ui-monospace, monospace">Q0..Q3 -&gt; KV0</text>
  <text x="95" y="91" text-anchor="middle" font-size="11" font-weight="500" fill="var(--muted)" font-family="JetBrains Mono, ui-monospace, monospace">qh / grp &lt; KvHeads</text>
  <text x="95" y="110" text-anchor="middle" font-size="11" font-weight="500" fill="var(--shared)">Proved via omega</text>
