<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 352" width="560" height="352" role="img" aria-labelledby="title description">
  <title id="title">Tensor grouped-query attention and page ownership</title>
  <desc id="description">Query heads map to key and value head groups. The illustrated page table maps logical blocks to physical pages held by linear leases.</desc>
  <style>
    :root { --canvas: #111a25; --inset: #15202d; --panel: #1b2735; --border: #536479; --shared: #83dacc; --muted: #bac7d6; --text: #e8edf5; --error: #ff9fae; --exclusive: #ffbf7f; }
    @media (prefers-color-scheme: light) { :root { --canvas: #f7f5f0; --inset: #f0efe9; --panel: #eeede7; --border: #747874; --shared: #006b80; --muted: #535852; --text: #1b2030; --error: #9e2438; --exclusive: #a24800; } }
  </style>
  <defs><marker id="teal" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--shared)"/></marker><marker id="gold" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--exclusive)"/></marker><marker id="red" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--error)"/></marker></defs>
  <rect width="560" height="352" fill="var(--canvas)" rx="10"/>
  <g font-family="Inter, Arial, sans-serif">
