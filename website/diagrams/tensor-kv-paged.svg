  <rect x="385" y="160" width="144" height="36" rx="6" fill="var(--inset)" stroke="var(--exclusive)" stroke-width="1.6"/>
  <text x="457" y="183" text-anchor="middle" font-size="12" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">Page P7 · leased</text>
  <rect x="385" y="208" width="144" height="38" rx="6" fill="var(--inset)" stroke="var(--exclusive)" stroke-width="1.6"/>
  <text x="457" y="232" text-anchor="middle" font-size="12" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">Page P11 · leased</text>
  <rect x="20" y="282" width="520" height="50" rx="8" fill="var(--panel)" stroke="var(--shared)" stroke-width="1.6"/>
  <text x="280" y="304" text-anchor="middle" font-size="13" font-weight="500" fill="var(--shared)">release_sequence(sink seq) reclaims 100% of pages on EOS, Cancel, or OOM</text>
  <text x="280" y="322" text-anchor="middle" font-size="11" font-weight="500" fill="var(--muted)" font-family="JetBrains Mono, ui-monospace, monospace">Lean 4: stream_completion_conserves_kv_pages · 0 leaked VRAM blocks</text>
