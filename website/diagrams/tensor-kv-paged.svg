  <text x="272" y="50" text-anchor="middle" font-size="15" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">ActiveKvSeq</text>
  <text x="272" y="70" text-anchor="middle" font-size="11.5" font-weight="500" fill="var(--muted)" font-family="JetBrains Mono, ui-monospace, monospace">linear KvPageLease</text>
