<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 356" width="560" height="356" role="img" aria-labelledby="title description">
  <title id="title">Geometry of the Vesper prism</title>
  <desc id="description">Construction grid showing the outer rays, the three blades, and the channels that separate them.</desc>
  <style>
    :root { --canvas: #111a25; --inset: #15202d; --panel: #1b2735; --border: #536479; --arrow: #788b9e; --shared: #83dacc; --muted: #bac7d6; --text: #e8edf5; --error: #ff9fae; --exclusive: #ffbf7f; }
    @media (prefers-color-scheme: light) { :root { --canvas: #f7f5f0; --inset: #f0efe9; --panel: #eeede7; --border: #747874; --arrow: #535852; --shared: #006b80; --muted: #535852; --text: #1b2030; --error: #9e2438; --exclusive: #a24800; } }
  </style>
  <defs><marker id="teal" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--shared)"/></marker><marker id="gold" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--exclusive)"/></marker><marker id="red" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--error)"/></marker></defs>
  <rect width="560" height="356" fill="var(--canvas)" rx="10"/>
  <g font-family="Inter, Arial, sans-serif">
  <rect x="24" y="38" width="256" height="256" rx="8" fill="var(--panel)" stroke="var(--border)" stroke-width="1.6"/>
  <line x1="152" y1="50" x2="152" y2="272" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="40" y1="72" x2="264" y2="72" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="54" y1="72" x2="152" y2="268" stroke="var(--arrow)" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="250" y1="72" x2="152" y2="268" stroke="var(--arrow)" stroke-width="1.4" stroke-dasharray="4 4"/>
  <polygon points="54,72 111,72 152,113 193,72 250,72 230,112 152,151 74,112" fill="var(--inset)" stroke="var(--text)" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="83.33,130.67 125,151.5 125,214" fill="var(--inset)" stroke="var(--exclusive)" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="152,165 167,157.5 167,238 152,268 137,238 137,157.5" fill="var(--inset)" stroke="var(--shared)" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="220.67,130.67 179,151.5 179,214" fill="var(--inset)" stroke="var(--error)" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="54" cy="72" r="3.2" fill="var(--exclusive)"/>
  <circle cx="250" cy="72" r="3.2" fill="var(--exclusive)"/>
  <circle cx="152" cy="268" r="3.2" fill="var(--shared)"/>
  <text x="82" y="62" text-anchor="middle" font-size="11" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">(30, 34)</text>
  <text x="220" y="62" text-anchor="middle" font-size="11" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">(226, 34)</text>
  <text x="152" y="286" text-anchor="middle" font-size="11" font-weight="500" fill="var(--shared)" font-family="JetBrains Mono, ui-monospace, monospace">(128, 230)</text>
  <rect x="298" y="38" width="240" height="84" rx="8" fill="var(--panel)" stroke="var(--shared)" stroke-width="1.6"/>
  <text x="418" y="62" text-anchor="middle" font-size="15" font-weight="500" fill="var(--shared)">256 x 256 · 2:1 V-cone</text>
  <text x="418" y="84" text-anchor="middle" font-size="12" font-weight="500" fill="var(--text)" font-family="JetBrains Mono, ui-monospace, monospace">Top: (30, 34) &amp; (226, 34)</text>
  <text x="418" y="105" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)" font-family="JetBrains Mono, ui-monospace, monospace">Apex: (128, 230) · dy/dx = 2</text>
  <rect x="298" y="136" width="240" height="158" rx="8" fill="var(--panel)" stroke="var(--exclusive)" stroke-width="1.6"/>
  <text x="418" y="162" text-anchor="middle" font-size="15" font-weight="500" fill="var(--exclusive)">Canonical master Theta</text>
  <text x="314" y="188" text-anchor="start" font-size="13" font-weight="500" fill="var(--text)" font-family="JetBrains Mono, ui-monospace, monospace">w_root   = 38</text>
  <text x="524" y="188" text-anchor="end" font-size="12" font-weight="500" fill="var(--arrow)" font-family="JetBrains Mono, ui-monospace, monospace">y 75..113</text>
  <text x="314" y="214" text-anchor="start" font-size="13" font-weight="500" fill="var(--muted)" font-family="JetBrains Mono, ui-monospace, monospace">g_split  = 14</text>
  <text x="524" y="214" text-anchor="end" font-size="12" font-weight="500" fill="var(--arrow)" font-family="JetBrains Mono, ui-monospace, monospace">y 113..127</text>
  <text x="314" y="240" text-anchor="start" font-size="13" font-weight="500" fill="var(--shared)" font-family="JetBrains Mono, ui-monospace, monospace">w_center = 30</text>
  <text x="524" y="240" text-anchor="end" font-size="12" font-weight="500" fill="var(--arrow)" font-family="JetBrains Mono, ui-monospace, monospace">x 113..143</text>
  <text x="314" y="266" text-anchor="start" font-size="13" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">g_chan   = 12</text>
  <text x="524" y="266" text-anchor="end" font-size="12" font-weight="500" fill="var(--arrow)" font-family="JetBrains Mono, ui-monospace, monospace">2 channels</text>
  <text x="280" y="324" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">Colinear 2:1 outer rays preserve negative-space channels across cuts</text>
  </g>
</svg>
