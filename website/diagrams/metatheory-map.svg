<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 368" width="560" height="368" role="img" aria-labelledby="title description">
  <title id="title">Lean models and their boundaries</title>
  <desc id="description">Separate models cover closures, polymorphism, places, and finite executable correspondence. Their results apply to the fragments and assumptions stated in each model.</desc>
  <style>
    :root { --canvas: #111a25; --panel: #1b2735; --border: #536479; --arrow: #788b9e; --shared: #83dacc; --muted: #bac7d6; --text: #e8edf5; --error: #ff9fae; --exclusive: #ffbf7f; }
    @media (prefers-color-scheme: light) { :root { --canvas: #f7f5f0; --panel: #eeede7; --border: #747874; --arrow: #535852; --shared: #006b80; --muted: #535852; --text: #1b2030; --error: #9e2438; --exclusive: #a24800; } }
  </style>
  <defs><marker id="teal" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--shared)"/></marker><marker id="gold" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--exclusive)"/></marker><marker id="red" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--error)"/></marker></defs>
  <rect width="560" height="368" fill="var(--canvas)" rx="10"/>
  <g font-family="Inter, Arial, sans-serif">
  <rect x="124" y="22" width="312" height="66" rx="8" fill="var(--panel)" stroke="var(--shared)" stroke-width="1.6"/>
  <text x="280" y="48" text-anchor="middle" font-size="16" font-weight="500" fill="var(--shared)" font-family="JetBrains Mono, ui-monospace, monospace">MetatheoryFull.lean</text>
  <text x="280" y="70" text-anchor="middle" font-size="12" font-weight="500" fill="var(--text)" font-family="JetBrains Mono, ui-monospace, monospace">type_safety · total_linear_exhaustion</text>
  <path d="M200 88 V104 H102 V120" fill="none" stroke="var(--shared)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/>
  <path d="M280 88 V120" fill="none" stroke="var(--exclusive)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#gold)"/>
  <path d="M360 88 V104 H458 V120" fill="none" stroke="var(--shared)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/>
  <rect x="20" y="124" width="164" height="92" rx="8" fill="var(--panel)" stroke="var(--border)" stroke-width="1.6"/>
  <text x="102" y="148" text-anchor="middle" font-size="14" font-weight="500" fill="var(--text)" font-family="JetBrains Mono, ui-monospace, monospace">Closures &amp;</text>
  <text x="102" y="167" text-anchor="middle" font-size="14" font-weight="500" fill="var(--text)" font-family="JetBrains Mono, ui-monospace, monospace">Polymorphism</text>
  <text x="102" y="188" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">Deep handlers · rows</text>
  <text x="102" y="205" text-anchor="middle" font-size="11" font-weight="500" fill="var(--arrow)">No handler escape</text>
  <rect x="198" y="124" width="164" height="92" rx="8" fill="var(--panel)" stroke="var(--exclusive)" stroke-width="1.6"/>
  <text x="280" y="149" text-anchor="middle" font-size="14" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">MetatheoryPlaces</text>
  <text x="280" y="171" text-anchor="middle" font-size="12" font-weight="500" fill="var(--text)">Mutable field trees</text>
  <text x="280" y="190" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">Second-class borrows</text>
  <text x="280" y="207" text-anchor="middle" font-size="11" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">zero_pin_relocation</text>
  <rect x="376" y="124" width="164" height="92" rx="8" fill="var(--panel)" stroke="var(--shared)" stroke-width="1.6"/>
  <text x="458" y="149" text-anchor="middle" font-size="14" font-weight="500" fill="var(--shared)" font-family="JetBrains Mono, ui-monospace, monospace">ResourceModel42</text>
  <text x="458" y="171" text-anchor="middle" font-size="12" font-weight="500" fill="var(--text)">Executable checker</text>
  <text x="458" y="190" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">correspondence</text>
  <text x="458" y="207" text-anchor="middle" font-size="11" font-weight="500" fill="var(--shared)" font-family="JetBrains Mono, ui-monospace, monospace">evalSteps_preservation</text>
  <path d="M145 216 V246" fill="none" stroke="var(--shared)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/>
  <path d="M415 216 V246" fill="none" stroke="var(--exclusive)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#gold)"/>
  <rect x="20" y="250" width="248" height="94" rx="8" fill="var(--panel)" stroke="var(--shared)" stroke-width="1.6"/>
  <text x="144" y="276" text-anchor="middle" font-size="14" font-weight="500" fill="var(--shared)" font-family="JetBrains Mono, ui-monospace, monospace">MetatheoryAppendix.lean</text>
  <text x="144" y="298" text-anchor="middle" font-size="13" font-weight="500" fill="var(--text)">Section A.1 theorem matrix</text>
  <text x="144" y="318" text-anchor="middle" font-size="11.5" font-weight="500" fill="var(--muted)">LIFO · out slices · sugar · quotients</text>
  <text x="144" y="335" text-anchor="middle" font-size="11" font-weight="500" fill="var(--arrow)">Lean 4 kernel checks</text>
  <rect x="292" y="250" width="248" height="94" rx="8" fill="var(--panel)" stroke="var(--exclusive)" stroke-width="1.6"/>
  <text x="416" y="276" text-anchor="middle" font-size="14" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">VesperUnifiedTypeTheory</text>
  <text x="416" y="298" text-anchor="middle" font-size="13" font-weight="500" fill="var(--text)">Four-axis modal lattice</text>
  <text x="416" y="318" text-anchor="middle" font-size="11.5" font-weight="500" fill="var(--muted)">ModeVec · Capsule · SemVer variance</text>
  <text x="416" y="335" text-anchor="middle" font-size="11" font-weight="500" fill="var(--arrow)">Lean 4 kernel checks</text>
  </g>
