<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 356" width="560" height="356" role="img" aria-labelledby="title description">
  <title id="title">Compare array and tile layouts</title>
  <desc id="description">Three layouts show interleaved records, separate field arrays, and contiguous field lanes inside an AoSoA tile.</desc>
  <style>
    :root { --canvas: #111a25; --inset: #15202d; --panel: #1b2735; --border: #536479; --arrow: #788b9e; --shared: #83dacc; --muted: #bac7d6; --text: #e8edf5; --error: #ff9fae; --exclusive: #ffbf7f; }
    @media (prefers-color-scheme: light) { :root { --canvas: #f7f5f0; --inset: #f0efe9; --panel: #eeede7; --border: #747874; --arrow: #535852; --shared: #006b80; --muted: #535852; --text: #1b2030; --error: #9e2438; --exclusive: #a24800; } }
  </style>
  <defs><marker id="teal" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--shared)"/></marker><marker id="gold" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--exclusive)"/></marker><marker id="red" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--error)"/></marker></defs>
  <rect width="560" height="356" fill="var(--canvas)" rx="10"/>
  <g font-family="Inter, Arial, sans-serif">
  <rect x="22" y="20" width="516" height="88" rx="8" fill="var(--panel)" stroke="var(--error)" stroke-width="1.6"/>
  <text x="36" y="42" text-anchor="start" font-size="14" font-weight="500" fill="var(--error)">AoS · Interleaved structs + alignment padding</text>
  <text x="524" y="42" text-anchor="end" font-size="13" font-weight="500" fill="var(--error)">SIMD gather</text>
  <rect x="36" y="52" width="148" height="42" rx="6" fill="var(--inset)" stroke="var(--border)" stroke-width="1.6"/>
  <text x="110" y="78" text-anchor="middle" font-size="13" font-weight="500" fill="var(--text)" font-family="JetBrains Mono, ui-monospace, monospace">x0 | y0 | vx0</text>
  <rect x="190" y="52" width="62" height="42" rx="6" fill="var(--inset)" stroke="var(--error)" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="221" y="78" text-anchor="middle" font-size="13" font-weight="500" fill="var(--error)" font-family="JetBrains Mono, ui-monospace, monospace">pad</text>
  <rect x="264" y="52" width="148" height="42" rx="6" fill="var(--inset)" stroke="var(--border)" stroke-width="1.6"/>
  <text x="338" y="78" text-anchor="middle" font-size="13" font-weight="500" fill="var(--text)" font-family="JetBrains Mono, ui-monospace, monospace">x1 | y1 | vx1</text>
  <rect x="418" y="52" width="62" height="42" rx="6" fill="var(--inset)" stroke="var(--error)" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="449" y="78" text-anchor="middle" font-size="13" font-weight="500" fill="var(--error)" font-family="JetBrains Mono, ui-monospace, monospace">pad</text>
  <rect x="22" y="122" width="516" height="88" rx="8" fill="var(--panel)" stroke="var(--border)" stroke-width="1.6"/>
  <text x="36" y="144" text-anchor="start" font-size="14" font-weight="500" fill="var(--muted)">SoA · Separate heap arrays across pages</text>
  <text x="524" y="144" text-anchor="end" font-size="13" font-weight="500" fill="var(--exclusive)">Multi-TLB split</text>
  <rect x="36" y="154" width="146" height="42" rx="6" fill="var(--inset)" stroke="var(--border)" stroke-width="1.6"/>
  <text x="109" y="180" text-anchor="middle" font-size="12" font-weight="500" fill="var(--text)" font-family="JetBrains Mono, ui-monospace, monospace">x[0..N] page A</text>
  <rect x="207" y="154" width="146" height="42" rx="6" fill="var(--inset)" stroke="var(--border)" stroke-width="1.6"/>
  <text x="280" y="180" text-anchor="middle" font-size="12" font-weight="500" fill="var(--text)" font-family="JetBrains Mono, ui-monospace, monospace">y[0..N] page B</text>
  <rect x="378" y="154" width="146" height="42" rx="6" fill="var(--inset)" stroke="var(--border)" stroke-width="1.6"/>
  <text x="451" y="180" text-anchor="middle" font-size="12" font-weight="500" fill="var(--text)" font-family="JetBrains Mono, ui-monospace, monospace">vx[0..N] page C</text>
  <rect x="22" y="224" width="516" height="110" rx="8" fill="var(--panel)" stroke="var(--shared)" stroke-width="1.6"/>
  <text x="36" y="247" text-anchor="start" font-size="14" font-weight="500" fill="var(--shared)">tiled(8) struct · Contiguous 64B cache-line SIMD tiles</text>
  <rect x="36" y="258" width="112" height="48" rx="6" fill="var(--inset)" stroke="var(--shared)" stroke-width="1.6"/>
  <text x="92" y="279" text-anchor="middle" font-size="13" font-weight="500" fill="var(--shared)" font-family="JetBrains Mono, ui-monospace, monospace">hot x[8]</text>
  <text x="92" y="297" text-anchor="middle" font-size="11" font-weight="500" fill="var(--muted)">64B lanes</text>
  <rect x="156" y="258" width="112" height="48" rx="6" fill="var(--inset)" stroke="var(--shared)" stroke-width="1.6"/>
  <text x="212" y="279" text-anchor="middle" font-size="13" font-weight="500" fill="var(--shared)" font-family="JetBrains Mono, ui-monospace, monospace">hot y[8]</text>
  <text x="212" y="297" text-anchor="middle" font-size="11" font-weight="500" fill="var(--muted)">64B lanes</text>
  <rect x="276" y="258" width="112" height="48" rx="6" fill="var(--inset)" stroke="var(--shared)" stroke-width="1.6"/>
  <text x="332" y="279" text-anchor="middle" font-size="13" font-weight="500" fill="var(--shared)" font-family="JetBrains Mono, ui-monospace, monospace">hot vx[8]</text>
  <text x="332" y="297" text-anchor="middle" font-size="11" font-weight="500" fill="var(--muted)">64B lanes</text>
  <rect x="404" y="258" width="120" height="48" rx="6" fill="var(--inset)" stroke="var(--border)" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="464" y="279" text-anchor="middle" font-size="13" font-weight="500" fill="var(--muted)" font-family="JetBrains Mono, ui-monospace, monospace">cold slab</text>
  <text x="464" y="297" text-anchor="middle" font-size="11" font-weight="500" fill="var(--arrow)">side page</text>
  <text x="280" y="324" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">Unit-stride VVec loads · 0 padding · 1 hot TLB stream</text>
  </g>
</svg>
