<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 312" width="560" height="312" role="img" aria-labelledby="title description">
  <title id="title">How a macro fills an expression slot</title>
  <desc id="description">Forge binds the argument 41 to the expression slot. The template supplies wrapping_add and the literal 1. The expanded call adds 41 and 1 to get 42.</desc>
  <style>
    :root { --canvas: #111a25; --panel: #1b2735; --border: #536479; --shared: #83dacc; --muted: #bac7d6; --text: #e8edf5; --error: #ff9fae; --exclusive: #ffbf7f; }
    @media (prefers-color-scheme: light) { :root { --canvas: #f7f5f0; --panel: #eeede7; --border: #747874; --shared: #006b80; --muted: #535852; --text: #1b2030; --error: #9e2438; --exclusive: #a24800; } }
  </style>
  <defs><marker id="teal" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--shared)"/></marker><marker id="gold" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--exclusive)"/></marker><marker id="red" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--error)"/></marker></defs>
  <rect width="560" height="312" fill="var(--canvas)" rx="10"/>
  <g font-family="Inter, Arial, sans-serif">
  <rect x="22" y="24" width="232" height="63" rx="8" fill="var(--panel)" stroke="var(--shared)" stroke-width="1.6"/>
  <text x="138" y="51" text-anchor="middle" font-size="17" font-weight="500" fill="var(--muted)">Call argument</text>
  <text x="138" y="76" text-anchor="middle" font-size="22" font-weight="500" fill="var(--shared)">41</text>
  <rect x="306" y="24" width="232" height="63" rx="8" fill="var(--panel)" stroke="var(--exclusive)" stroke-width="1.6"/>
  <text x="422" y="51" text-anchor="middle" font-size="17" font-weight="500" fill="var(--muted)">Template literal</text>
  <text x="422" y="76" text-anchor="middle" font-size="22" font-weight="500" fill="var(--exclusive)">1</text>
  <path d="M138 88 V154 H195" fill="none" stroke="var(--shared)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/>
  <path d="M422 88 V154 H365" fill="none" stroke="var(--exclusive)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#gold)"/>
  <text x="90" y="123" text-anchor="middle" font-size="15" font-weight="500" fill="var(--shared)">bind slot</text>
  <text x="477" y="123" text-anchor="middle" font-size="15" font-weight="500" fill="var(--exclusive)">keep literal</text>
  <rect x="204" y="124" width="152" height="64" rx="8" fill="var(--panel)" stroke="var(--border)" stroke-width="1.6"/>
  <text x="280" y="151" text-anchor="middle" font-size="16" font-weight="500" fill="var(--muted)">Operation</text>
  <text x="280" y="176" text-anchor="middle" font-size="19" font-weight="500" fill="var(--text)">wrapping_add</text>
  <path d="M280 188 V245" fill="none" stroke="var(--shared)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/>
  <text x="300" y="224" text-anchor="start" font-size="16" font-weight="500" fill="var(--shared)">evaluate</text>
  <rect x="217" y="251" width="126" height="42" rx="8" fill="var(--panel)" stroke="var(--shared)" stroke-width="1.6"/>
  <text x="280" y="279" text-anchor="middle" font-size="22" font-weight="500" fill="var(--shared)">42</text>
  </g>
</svg>
