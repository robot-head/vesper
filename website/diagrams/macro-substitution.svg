<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 312" width="560" height="312" role="img" aria-labelledby="title description">
  <title id="title">How a macro fills an expression slot</title>
  <desc id="description">Forge binds the argument 41 to the expression slot. The template supplies wrapping_add and the literal 1. The expanded call adds 41 and 1 to get 42.</desc>
  <defs><marker id="teal" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#83dacc"/></marker><marker id="gold" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#ffbf7f"/></marker><marker id="red" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#ff9fae"/></marker></defs>
  <rect width="560" height="312" fill="#111a25" rx="10"/>
  <g font-family="system-ui, sans-serif">
  <rect x="22" y="24" width="232" height="63" rx="8" fill="#1b2735" stroke="#83dacc" stroke-width="1.6"/>
  <text x="138" y="51" text-anchor="middle" font-size="17" font-weight="500" fill="#bac7d6">Call argument</text>
  <text x="138" y="76" text-anchor="middle" font-size="22" font-weight="500" fill="#83dacc">41</text>
  <rect x="306" y="24" width="232" height="63" rx="8" fill="#1b2735" stroke="#ffbf7f" stroke-width="1.6"/>
  <text x="422" y="51" text-anchor="middle" font-size="17" font-weight="500" fill="#bac7d6">Template literal</text>
  <text x="422" y="76" text-anchor="middle" font-size="22" font-weight="500" fill="#ffbf7f">1</text>
  <path d="M138 88 V154 H195" fill="none" stroke="#83dacc" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/>
  <path d="M422 88 V154 H365" fill="none" stroke="#ffbf7f" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#gold)"/>
  <text x="90" y="123" text-anchor="middle" font-size="15" font-weight="500" fill="#83dacc">bind slot</text>
  <text x="477" y="123" text-anchor="middle" font-size="15" font-weight="500" fill="#ffbf7f">keep literal</text>
  <rect x="204" y="124" width="152" height="64" rx="8" fill="#1b2735" stroke="#536479" stroke-width="1.6"/>
  <text x="280" y="151" text-anchor="middle" font-size="16" font-weight="500" fill="#bac7d6">Operation</text>
  <text x="280" y="176" text-anchor="middle" font-size="19" font-weight="500" fill="#e8edf5">wrapping_add</text>
  <path d="M280 188 V245" fill="none" stroke="#83dacc" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/>
  <text x="300" y="224" text-anchor="start" font-size="16" font-weight="500" fill="#83dacc">evaluate</text>
  <rect x="217" y="251" width="126" height="42" rx="8" fill="#1b2735" stroke="#83dacc" stroke-width="1.6"/>
  <text x="280" y="279" text-anchor="middle" font-size="22" font-weight="500" fill="#83dacc">42</text>
  </g>
</svg>
