<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 336" width="560" height="336" role="img" aria-labelledby="title description">
  <title id="title">Translate supported source to Lean</title>
  <desc id="description">An inout projection becomes a returned state update. The model represents selected effects explicitly. The proof audit checks the resulting artifact under its declared axiom policy.</desc>
  <style>
    :root { --canvas: #111a25; --panel: #1b2735; --border: #536479; --arrow: #788b9e; --shared: #83dacc; --muted: #bac7d6; --text: #e8edf5; --error: #ff9fae; --exclusive: #ffbf7f; }
    @media (prefers-color-scheme: light) { :root { --canvas: #f7f5f0; --panel: #eeede7; --border: #747874; --arrow: #535852; --shared: #006b80; --muted: #535852; --text: #1b2030; --error: #9e2438; --exclusive: #a24800; } }
  </style>
  <defs><marker id="teal" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--shared)"/></marker><marker id="gold" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--exclusive)"/></marker><marker id="red" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--error)"/></marker></defs>
  <rect width="560" height="336" fill="var(--canvas)" rx="10"/>
  <g font-family="Inter, Arial, sans-serif">
  <text x="116" y="36" text-anchor="middle" font-size="15" font-weight="500" fill="var(--muted)">Validated PlaceIr</text>
  <text x="408" y="36" text-anchor="middle" font-size="15" font-weight="500" fill="var(--muted)">Pure Lean 4 translation</text>
  <rect x="22" y="50" width="188" height="80" rx="8" fill="var(--panel)" stroke="var(--exclusive)" stroke-width="1.6"/>
  <text x="116" y="78" text-anchor="middle" font-size="16" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">inout x.pi</text>
  <text x="116" y="100" text-anchor="middle" font-size="13" font-weight="500" fill="var(--text)">Disjoint field loan</text>
  <text x="116" y="118" text-anchor="middle" font-size="12" font-weight="500" fill="var(--arrow)">[T-CallProj] verified</text>
  <path d="M210 90 H272" fill="none" stroke="var(--exclusive)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#gold)"/>
  <text x="241" y="80" text-anchor="middle" font-size="12" font-weight="500" fill="var(--exclusive)">lenses</text>
  <rect x="276" y="50" width="262" height="80" rx="8" fill="var(--panel)" stroke="var(--shared)" stroke-width="1.6"/>
  <text x="407" y="77" text-anchor="middle" font-size="15" font-weight="500" fill="var(--shared)" font-family="JetBrains Mono, ui-monospace, monospace">RetTuple + get_pi / set_pi</text>
  <text x="407" y="99" text-anchor="middle" font-size="13" font-weight="500" fill="var(--text)">Pure state return tuple</text>
  <text x="407" y="118" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">Sibling frame preserved by rfl</text>
  <rect x="22" y="148" width="188" height="80" rx="8" fill="var(--panel)" stroke="var(--border)" stroke-width="1.6"/>
  <text x="116" y="176" text-anchor="middle" font-size="16" font-weight="500" fill="var(--text)" font-family="JetBrains Mono, ui-monospace, monospace">eff [Fail, Op]</text>
  <text x="116" y="198" text-anchor="middle" font-size="13" font-weight="500" fill="var(--muted)">Lexical effect row</text>
  <text x="116" y="216" text-anchor="middle" font-size="12" font-weight="500" fill="var(--arrow)">@0 ghost args kept</text>
  <path d="M210 188 H272" fill="none" stroke="var(--shared)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/>
  <text x="241" y="178" text-anchor="middle" font-size="12" font-weight="500" fill="var(--shared)">tier 0..2</text>
  <rect x="276" y="148" width="262" height="80" rx="8" fill="var(--panel)" stroke="var(--shared)" stroke-width="1.6"/>
  <text x="407" y="175" text-anchor="middle" font-size="15" font-weight="500" fill="var(--shared)" font-family="JetBrains Mono, ui-monospace, monospace">EffM sig RetTuple</text>
  <text x="407" y="197" text-anchor="middle" font-size="13" font-weight="500" fill="var(--text)">Pure | Except E | EffM ITree</text>
  <text x="407" y="216" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">Loops -&gt; termination_by omega</text>
  <path d="M407 228 V252" fill="none" stroke="var(--shared)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/>
  <rect x="86" y="256" width="388" height="58" rx="8" fill="var(--panel)" stroke="var(--shared)" stroke-width="1.6"/>
  <text x="280" y="281" text-anchor="middle" font-size="15" font-weight="500" fill="var(--shared)">Lean 4 kernel check · composable .olean</text>
  <text x="280" y="302" text-anchor="middle" font-size="13" font-weight="500" fill="var(--muted)">Audit explicit theorem assumptions</text>
  </g>
</svg>
