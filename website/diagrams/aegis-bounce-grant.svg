<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 336" width="560" height="336" role="img" aria-labelledby="title description">
  <title id="title">Aegis single-fetch design</title>
  <desc id="description">An illustrated copy from shared host memory into private guest memory. The copy limits double-fetch races during validation.</desc>
  <style>
    :root { --canvas: #111a25; --inset: #15202d; --panel: #1b2735; --border: #536479; --arrow: #788b9e; --shared: #83dacc; --muted: #bac7d6; --text: #e8edf5; --error: #ff9fae; --exclusive: #ffbf7f; }
    @media (prefers-color-scheme: light) { :root { --canvas: #f7f5f0; --inset: #f0efe9; --panel: #eeede7; --border: #747874; --arrow: #535852; --shared: #006b80; --muted: #535852; --text: #1b2030; --error: #9e2438; --exclusive: #a24800; } }
  </style>
  <defs><marker id="teal" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--shared)"/></marker><marker id="gold" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--exclusive)"/></marker><marker id="red" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--error)"/></marker></defs>
  <rect width="560" height="336" fill="var(--canvas)" rx="10"/>
  <g font-family="Inter, Arial, sans-serif">
  <rect x="20" y="34" width="152" height="206" rx="8" fill="var(--panel)" stroke="var(--error)" stroke-width="1.6"/>
  <text x="96" y="64" text-anchor="middle" font-size="15" font-weight="500" fill="var(--error)">Untrusted Host</text>
  <text x="96" y="92" text-anchor="middle" font-size="17" font-weight="500" fill="var(--text)" font-family="JetBrains Mono, ui-monospace, monospace">SharedGpa</text>
  <text x="96" y="116" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">VMM / VirtIO ring</text>
  <text x="96" y="138" text-anchor="middle" font-size="12" font-weight="500" fill="var(--error)" font-family="JetBrains Mono, ui-monospace, monospace">UntrustedHostVal</text>
  <rect x="34" y="162" width="124" height="62" rx="6" fill="var(--inset)" stroke="var(--error)" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="96" y="187" text-anchor="middle" font-size="12" font-weight="500" fill="var(--error)">2nd fetch blocked</text>
  <text x="96" y="208" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">Zero TOCTOU</text>
  <path d="M172 118 H198" fill="none" stroke="var(--exclusive)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#gold)"/>
  <rect x="202" y="34" width="156" height="206" rx="8" fill="var(--panel)" stroke="var(--exclusive)" stroke-width="1.6"/>
  <text x="280" y="64" text-anchor="middle" font-size="14" font-weight="500" fill="var(--exclusive)">Linear bounce gate</text>
  <text x="280" y="92" text-anchor="middle" font-size="14" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">HostBounceGrant</text>
  <text x="280" y="122" text-anchor="middle" font-size="14" font-weight="500" fill="var(--text)">Single-fetch copy</text>
  <text x="280" y="144" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">snapshot once</text>
  <text x="280" y="176" text-anchor="middle" font-size="13" font-weight="500" fill="var(--shared)" font-family="JetBrains Mono, ui-monospace, monospace">ConstTime AEAD</text>
  <text x="280" y="198" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">+ bounds validate</text>
  <text x="280" y="222" text-anchor="middle" font-size="12" font-weight="500" fill="var(--arrow)">0 heap Alloc</text>
  <path d="M358 118 H384" fill="none" stroke="var(--shared)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/>
  <rect x="388" y="34" width="152" height="206" rx="8" fill="var(--panel)" stroke="var(--shared)" stroke-width="1.6"/>
  <text x="464" y="64" text-anchor="middle" font-size="15" font-weight="500" fill="var(--shared)">Confidential VM</text>
  <text x="464" y="92" text-anchor="middle" font-size="17" font-weight="500" fill="var(--shared)" font-family="JetBrains Mono, ui-monospace, monospace">PrivateGpa</text>
  <text x="464" y="116" text-anchor="middle" font-size="12" font-weight="500" fill="var(--text)" font-family="JetBrains Mono, ui-monospace, monospace">PrivateEnc Region</text>
  <text x="464" y="142" text-anchor="middle" font-size="13" font-weight="500" fill="var(--muted)">TDX / SEV-SNP</text>
  <text x="464" y="174" text-anchor="middle" font-size="13" font-weight="500" fill="var(--shared)">Verified plaintext</text>
  <text x="464" y="198" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">Sealed reply only</text>
  <rect x="20" y="260" width="520" height="54" rx="8" fill="var(--panel)" stroke="var(--border)" stroke-width="1.6"/>
  <text x="280" y="283" text-anchor="middle" font-size="13" font-weight="500" fill="var(--text)">Every exit consumes sink bounce_slot: flush_ciphertext or abort_and_scrub</text>
  <text x="280" y="303" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">Validate the private snapshot before use</text>
  </g>
</svg>
