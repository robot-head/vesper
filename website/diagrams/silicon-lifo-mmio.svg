<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 356" width="560" height="356" role="img" aria-labelledby="title description">
  <title id="title">Silicon ordered guards and DMA ownership</title>
  <desc id="description">The diagram illustrates last-in, first-out interrupt restoration and an owned buffer moving between CPU and device.</desc>
  <style>
    :root { --canvas: #111a25; --inset: #15202d; --panel: #1b2735; --border: #536479; --arrow: #788b9e; --shared: #83dacc; --muted: #bac7d6; --text: #e8edf5; --error: #ff9fae; --exclusive: #ffbf7f; }
    @media (prefers-color-scheme: light) { :root { --canvas: #f7f5f0; --inset: #f0efe9; --panel: #eeede7; --border: #747874; --arrow: #535852; --shared: #006b80; --muted: #535852; --text: #1b2030; --error: #9e2438; --exclusive: #a24800; } }
  </style>
  <defs><marker id="teal" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--shared)"/></marker><marker id="gold" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--exclusive)"/></marker><marker id="red" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--error)"/></marker></defs>
  <rect width="560" height="356" fill="var(--canvas)" rx="10"/>
  <g font-family="Inter, Arial, sans-serif">
  <rect x="20" y="20" width="248" height="316" rx="8" fill="var(--panel)" stroke="var(--border)" stroke-width="1.6"/>
  <text x="144" y="46" text-anchor="middle" font-size="16" font-weight="500" fill="var(--text)">@ lifo IrqGuard stack</text>
  <rect x="36" y="62" width="216" height="46" rx="6" fill="var(--inset)" stroke="var(--exclusive)" stroke-width="1.6"/>
  <text x="144" y="82" text-anchor="middle" font-size="13" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">1. push g1 : IrqGuard</text>
  <text x="144" y="99" text-anchor="middle" font-size="11" font-weight="500" fill="var(--muted)" font-family="JetBrains Mono, ui-monospace, monospace">disable_local_save()</text>
  <rect x="36" y="118" width="216" height="46" rx="6" fill="var(--inset)" stroke="var(--exclusive)" stroke-width="1.6"/>
  <text x="144" y="138" text-anchor="middle" font-size="13" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">2. push g2 : IrqGuard</text>
  <text x="144" y="155" text-anchor="middle" font-size="11" font-weight="500" fill="var(--muted)">nested critical section</text>
  <rect x="36" y="180" width="216" height="62" rx="6" fill="var(--inset)" stroke="var(--shared)" stroke-width="1.6"/>
  <text x="144" y="204" text-anchor="middle" font-size="14" font-weight="500" fill="var(--shared)">Valid: restore g2 -&gt; g1</text>
  <text x="144" y="226" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">Strict LIFO stack order</text>
  <rect x="36" y="254" width="216" height="66" rx="6" fill="var(--inset)" stroke="var(--error)" stroke-width="1.6"/>
  <text x="144" y="278" text-anchor="middle" font-size="14" font-weight="500" fill="var(--error)">Out-of-order g1 first</text>
  <text x="144" y="302" text-anchor="middle" font-size="12" font-weight="500" fill="var(--error)" font-family="JetBrains Mono, ui-monospace, monospace">Invalid release order</text>
  <rect x="292" y="20" width="248" height="316" rx="8" fill="var(--panel)" stroke="var(--border)" stroke-width="1.6"/>
  <text x="416" y="46" text-anchor="middle" font-size="16" font-weight="500" fill="var(--text)">DMA buffer typestate</text>
  <rect x="316" y="62" width="200" height="52" rx="6" fill="var(--inset)" stroke="var(--shared)" stroke-width="1.6"/>
  <text x="416" y="85" text-anchor="middle" font-size="15" font-weight="500" fill="var(--shared)" font-family="JetBrains Mono, ui-monospace, monospace">CpuOwned</text>
  <text x="416" y="104" text-anchor="middle" font-size="11" font-weight="500" fill="var(--muted)">CPU reads / writes SRAM</text>
  <path d="M416 114 V144" fill="none" stroke="var(--exclusive)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#gold)"/>
  <text x="426" y="134" text-anchor="start" font-size="11" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">submit_rx(sink)</text>
  <rect x="316" y="148" width="200" height="56" rx="6" fill="var(--inset)" stroke="var(--exclusive)" stroke-width="1.6"/>
  <text x="416" y="172" text-anchor="middle" font-size="15" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">DeviceActive</text>
  <text x="416" y="192" text-anchor="middle" font-size="11" font-weight="500" fill="var(--muted)">DmaTransfer · 0 CPU alias</text>
  <path d="M416 204 V234" fill="none" stroke="var(--shared)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/>
  <text x="426" y="224" text-anchor="start" font-size="11" font-weight="500" fill="var(--shared)" font-family="JetBrains Mono, ui-monospace, monospace">await_complete</text>
  <rect x="316" y="238" width="200" height="52" rx="6" fill="var(--inset)" stroke="var(--shared)" stroke-width="1.6"/>
  <text x="416" y="261" text-anchor="middle" font-size="15" font-weight="500" fill="var(--shared)" font-family="JetBrains Mono, ui-monospace, monospace">CpuOwned</text>
  <text x="416" y="280" text-anchor="middle" font-size="11" font-weight="500" fill="var(--muted)">D-cache invalidated · reuse</text>
  <text x="416" y="316" text-anchor="middle" font-size="12" font-weight="500" fill="var(--arrow)">0 heap · 0 Pin · race-free DMA</text>
  </g>
</svg>
