<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" role="img" aria-labelledby="title description">
  <title id="title">A round trip through a one-shot handler</title>
  <desc id="description">The computation asks for an integer. The handler resumes it with 20. Adding one returns 21 through the return clause. The handler doubles the result to 42.</desc>
  <defs><marker id="teal" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#83dacc"/></marker><marker id="gold" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#ffbf7f"/></marker><marker id="red" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#ff9fae"/></marker></defs>
  <rect width="560" height="340" fill="#111a25" rx="10"/>
  <g font-family="system-ui, sans-serif">
  <rect x="26" y="18" width="166" height="43" rx="8" fill="#1b2735" stroke="#536479" stroke-width="1.6"/>
  <text x="109" y="46" text-anchor="middle" font-size="20" font-weight="500" fill="#e8edf5">Computation</text>
  <rect x="365" y="18" width="166" height="43" rx="8" fill="#1b2735" stroke="#536479" stroke-width="1.6"/>
  <text x="448" y="46" text-anchor="middle" font-size="20" font-weight="500" fill="#e8edf5">Ask handler</text>
  <path d="M109 62 V280" fill="none" stroke="#788b9e" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="5 5"/>
  <path d="M448 62 V303" fill="none" stroke="#788b9e" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="5 5"/>
  <text x="277" y="88" text-anchor="middle" font-size="17" font-weight="500" fill="#bac7d6">request a value</text>
  <path d="M109 100 H445" fill="none" stroke="#83dacc" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/>
  <text x="278" y="139" text-anchor="middle" font-size="18" font-weight="500" fill="#ffbf7f">resume with 20</text>
  <path d="M448 151 H113" fill="none" stroke="#ffbf7f" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#gold)"/>
  <text x="46" y="185" text-anchor="start" font-size="18" font-weight="500" fill="#83dacc">add 1</text>
  <text x="276" y="203" text-anchor="middle" font-size="18" font-weight="500" fill="#83dacc">return 21</text>
  <path d="M109 215 H445" fill="none" stroke="#83dacc" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/>
  <text x="442" y="250" text-anchor="middle" font-size="18" font-weight="500" fill="#ffbf7f">double 21</text>
  <path d="M448 260 V280" fill="none" stroke="#ffbf7f" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#gold)"/>
  <rect x="390" y="284" width="116" height="39" rx="8" fill="#1b2735" stroke="#ffbf7f" stroke-width="1.6"/>
  <text x="448" y="310" text-anchor="middle" font-size="21" font-weight="500" fill="#ffbf7f">42</text>
  </g>
</svg>
