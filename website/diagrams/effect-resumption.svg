<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" role="img" aria-labelledby="title description">
  <title id="title">A round trip through a one-shot handler</title>
  <desc id="description">The computation asks for an integer. The handler resumes it with 20. Adding one returns 21 through the return clause. The handler doubles the result to 42.</desc>
  <style>
    :root { --canvas: #111a25; --panel: #1b2735; --border: #536479; --arrow: #788b9e; --shared: #83dacc; --muted: #bac7d6; --text: #e8edf5; --error: #ff9fae; --exclusive: #ffbf7f; }
    @media (prefers-color-scheme: light) { :root { --canvas: #f7f5f0; --panel: #eeede7; --border: #747874; --arrow: #535852; --shared: #006b80; --muted: #535852; --text: #1b2030; --error: #9e2438; --exclusive: #a24800; } }
  </style>
  <defs><marker id="teal" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--shared)"/></marker><marker id="gold" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--exclusive)"/></marker><marker id="red" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--error)"/></marker></defs>
  <rect width="560" height="340" fill="var(--canvas)" rx="10"/>
  <g font-family="Inter, Arial, sans-serif">
  <rect x="26" y="18" width="166" height="43" rx="8" fill="var(--panel)" stroke="var(--border)" stroke-width="1.6"/>
  <text x="109" y="46" text-anchor="middle" font-size="20" font-weight="500" fill="var(--text)">Computation</text>
  <rect x="365" y="18" width="166" height="43" rx="8" fill="var(--panel)" stroke="var(--border)" stroke-width="1.6"/>
  <text x="448" y="46" text-anchor="middle" font-size="20" font-weight="500" fill="var(--text)">Ask handler</text>
  <path d="M109 62 V280" fill="none" stroke="var(--arrow)" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="5 5"/>
  <path d="M448 62 V303" fill="none" stroke="var(--arrow)" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="5 5"/>
  <text x="277" y="88" text-anchor="middle" font-size="17" font-weight="500" fill="var(--muted)">request a value</text>
  <path d="M109 100 H445" fill="none" stroke="var(--shared)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/>
  <text x="278" y="139" text-anchor="middle" font-size="18" font-weight="500" fill="var(--exclusive)">resume with 20</text>
  <path d="M448 151 H113" fill="none" stroke="var(--exclusive)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#gold)"/>
  <text x="46" y="185" text-anchor="start" font-size="18" font-weight="500" fill="var(--shared)">add 1</text>
  <text x="276" y="203" text-anchor="middle" font-size="18" font-weight="500" fill="var(--shared)">return 21</text>
  <path d="M109 215 H445" fill="none" stroke="var(--shared)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/>
  <text x="442" y="250" text-anchor="middle" font-size="18" font-weight="500" fill="var(--exclusive)">double 21</text>
  <path d="M448 260 V280" fill="none" stroke="var(--exclusive)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#gold)"/>
  <rect x="390" y="284" width="116" height="39" rx="8" fill="var(--panel)" stroke="var(--exclusive)" stroke-width="1.6"/>
  <text x="448" y="310" text-anchor="middle" font-size="21" font-weight="500" fill="var(--exclusive)">42</text>
  </g>
</svg>
