<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" role="img" aria-labelledby="title description">
  <title id="title">Ignis render-graph design</title>
  <desc id="description">Passes describe which attachments they read, initialize, or change. The design uses those edges to derive barriers for the selected backend.</desc>
  <style>
    :root { --canvas: #111a25; --inset: #15202d; --panel: #1b2735; --border: #536479; --arrow: #788b9e; --shared: #83dacc; --muted: #bac7d6; --text: #e8edf5; --error: #ff9fae; --exclusive: #ffbf7f; }
    @media (prefers-color-scheme: light) { :root { --canvas: #f7f5f0; --inset: #f0efe9; --panel: #eeede7; --border: #747874; --arrow: #535852; --shared: #006b80; --muted: #535852; --text: #1b2030; --error: #9e2438; --exclusive: #a24800; } }
  </style>
  <defs><marker id="teal" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--shared)"/></marker><marker id="gold" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--exclusive)"/></marker><marker id="red" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--error)"/></marker></defs>
  <rect width="560" height="340" fill="var(--canvas)" rx="10"/>
  <g font-family="Inter, Arial, sans-serif">
  <rect x="20" y="28" width="132" height="122" rx="8" fill="var(--panel)" stroke="var(--exclusive)" stroke-width="1.6"/>
  <text x="86" y="54" text-anchor="middle" font-size="15" font-weight="500" fill="var(--text)">1 · G-Buffer</text>
  <text x="86" y="78" text-anchor="middle" font-size="13" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">out albedo</text>
  <text x="86" y="98" text-anchor="middle" font-size="13" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">out depth</text>
  <text x="86" y="120" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">Write-init RTV</text>
  <text x="86" y="138" text-anchor="middle" font-size="11" font-weight="500" fill="var(--arrow)" font-family="JetBrains Mono, ui-monospace, monospace">SrvIdx / UavIdx</text>
  <path d="M152 89 H210" fill="none" stroke="var(--exclusive)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#gold)"/>
  <text x="183" y="76" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--error)" font-family="JetBrains Mono, ui-monospace, monospace">RTV-&gt;UAV</text>
  <rect x="214" y="28" width="132" height="122" rx="8" fill="var(--panel)" stroke="var(--exclusive)" stroke-width="1.6"/>
  <text x="280" y="54" text-anchor="middle" font-size="14" font-weight="500" fill="var(--text)">2 · Lighting CS</text>
  <text x="280" y="78" text-anchor="middle" font-size="12.5" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">inout hdr_uav</text>
  <text x="280" y="98" text-anchor="middle" font-size="12.5" font-weight="500" fill="var(--shared)" font-family="JetBrains Mono, ui-monospace, monospace">in albedo</text>
  <text x="280" y="120" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">SM 6.9 compute</text>
  <text x="280" y="138" text-anchor="middle" font-size="11" font-weight="500" fill="var(--arrow)" font-family="JetBrains Mono, ui-monospace, monospace">wire struct ABI</text>
  <path d="M346 89 H404" fill="none" stroke="var(--shared)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/>
  <text x="377" y="76" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--error)" font-family="JetBrains Mono, ui-monospace, monospace">UAV-&gt;SRV</text>
  <rect x="408" y="28" width="132" height="122" rx="8" fill="var(--panel)" stroke="var(--shared)" stroke-width="1.6"/>
  <text x="474" y="54" text-anchor="middle" font-size="15" font-weight="500" fill="var(--text)">3 · ToneMap</text>
  <text x="474" y="78" text-anchor="middle" font-size="13" font-weight="500" fill="var(--shared)" font-family="JetBrains Mono, ui-monospace, monospace">in hdr_srv</text>
  <text x="474" y="98" text-anchor="middle" font-size="13" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">out backbuf</text>
  <text x="474" y="120" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">Read SRV + out</text>
  <text x="474" y="138" text-anchor="middle" font-size="11" font-weight="500" fill="var(--arrow)" font-family="JetBrains Mono, ui-monospace, monospace">CmdList[Closed]</text>
  <path d="M183 102 V204" fill="none" stroke="var(--error)" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#red)"/>
  <path d="M377 102 V204" fill="none" stroke="var(--error)" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#red)"/>
  <rect x="20" y="208" width="520" height="108" rx="8" fill="var(--panel)" stroke="var(--shared)" stroke-width="1.6"/>
  <text x="280" y="234" text-anchor="middle" font-size="14" font-weight="500" fill="var(--shared)">Compile-time hazard barrier schedule · 0 per-draw CPU maps</text>
  <rect x="36" y="250" width="152" height="50" rx="6" fill="var(--inset)" stroke="var(--border)" stroke-width="1.6"/>
  <text x="112" y="272" text-anchor="middle" font-size="13" font-weight="500" fill="var(--text)">D3D12 Enhanced</text>
  <text x="112" y="290" text-anchor="middle" font-size="11" font-weight="500" fill="var(--muted)" font-family="JetBrains Mono, ui-monospace, monospace">TEXTURE_BARRIER</text>
  <rect x="204" y="250" width="152" height="50" rx="6" fill="var(--inset)" stroke="var(--border)" stroke-width="1.6"/>
  <text x="280" y="272" text-anchor="middle" font-size="13" font-weight="500" fill="var(--text)">Vulkan 1.4</text>
  <text x="280" y="290" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--muted)" font-family="JetBrains Mono, ui-monospace, monospace">VkImageMemoryBarrier2</text>
  <rect x="372" y="250" width="152" height="50" rx="6" fill="var(--inset)" stroke="var(--border)" stroke-width="1.6"/>
  <text x="448" y="272" text-anchor="middle" font-size="13" font-weight="500" fill="var(--text)">Metal 4</text>
  <text x="448" y="290" text-anchor="middle" font-size="11" font-weight="500" fill="var(--muted)" font-family="JetBrains Mono, ui-monospace, monospace">MTL4 Barrier / Fence</text>
  </g>
</svg>
