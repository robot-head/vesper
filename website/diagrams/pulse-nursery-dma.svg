<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 356" width="560" height="356" role="img" aria-labelledby="title description">
  <title id="title">Pulse nurseries and device ownership</title>
  <desc id="description">Child work joins before the scope exits. A submitted device buffer must remain owned until terminal completion. The escrow alternative is a design proposal.</desc>
  <style>
    :root { --canvas: #111a25; --panel: #1b2735; --border: #536479; --arrow: #788b9e; --shared: #83dacc; --muted: #bac7d6; --text: #e8edf5; --error: #ff9fae; --exclusive: #ffbf7f; }
    @media (prefers-color-scheme: light) { :root { --canvas: #f7f5f0; --panel: #eeede7; --border: #747874; --arrow: #535852; --shared: #006b80; --muted: #535852; --text: #1b2030; --error: #9e2438; --exclusive: #a24800; } }
  </style>
  <defs><marker id="teal" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--shared)"/></marker><marker id="gold" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--exclusive)"/></marker><marker id="red" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--error)"/></marker></defs>
  <rect width="560" height="356" fill="var(--canvas)" rx="10"/>
  <g font-family="Inter, Arial, sans-serif">
  <rect x="22" y="20" width="516" height="58" rx="8" fill="var(--panel)" stroke="var(--border)" stroke-width="1.6"/>
  <text x="280" y="44" text-anchor="middle" font-size="16" font-weight="500" fill="var(--text)">Parent stack · Pulse::scope structured nursery</text>
  <text x="280" y="65" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)" font-family="JetBrains Mono, ui-monospace, monospace">broker.{index, repl_stream} · in wire_slice · stack DMA buf</text>
  <path d="M106 78 V112" fill="none" stroke="var(--exclusive)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#gold)"/>
  <path d="M280 78 V112" fill="none" stroke="var(--shared)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/>
  <path d="M454 78 V112" fill="none" stroke="var(--error)" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#red)"/>
  <rect x="22" y="116" width="168" height="118" rx="8" fill="var(--panel)" stroke="var(--exclusive)" stroke-width="1.6"/>
  <text x="106" y="141" text-anchor="middle" font-size="15" font-weight="500" fill="var(--text)">Child Fiber 1</text>
  <text x="106" y="164" text-anchor="middle" font-size="12" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">inout broker.index</text>
  <text x="106" y="184" text-anchor="middle" font-size="12" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">sink tx.commit()</text>
  <text x="106" y="205" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)" font-family="JetBrains Mono, ui-monospace, monospace">wal_join : linear</text>
  <text x="106" y="223" text-anchor="middle" font-size="11" font-weight="500" fill="var(--arrow)">0 Arc / 0 Mutex</text>
  <rect x="196" y="116" width="168" height="118" rx="8" fill="var(--panel)" stroke="var(--shared)" stroke-width="1.6"/>
  <text x="280" y="141" text-anchor="middle" font-size="15" font-weight="500" fill="var(--text)">Child Fiber 2</text>
  <text x="280" y="164" text-anchor="middle" font-size="12" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">inout repl_stream</text>
  <text x="280" y="184" text-anchor="middle" font-size="12" font-weight="500" fill="var(--shared)" font-family="JetBrains Mono, ui-monospace, monospace">in wire_slice</text>
  <text x="280" y="205" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)" font-family="JetBrains Mono, ui-monospace, monospace">net_join : linear</text>
  <text x="280" y="223" text-anchor="middle" font-size="11" font-weight="500" fill="var(--arrow)">Disjoint sibling</text>
  <rect x="370" y="116" width="168" height="118" rx="8" fill="var(--panel)" stroke="var(--error)" stroke-width="1.6"/>
  <text x="454" y="141" text-anchor="middle" font-size="15" font-weight="500" fill="var(--error)">io_uring stack DMA</text>
  <text x="454" y="164" text-anchor="middle" font-size="13" font-weight="500" fill="var(--text)">Cancel across DMA</text>
  <text x="454" y="185" text-anchor="middle" font-size="13" font-weight="500" fill="var(--error)" font-family="JetBrains Mono, ui-monospace, monospace">Invalid buffer loan</text>
  <text x="454" y="205" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">Await CQE or use</text>
  <text x="454" y="222" text-anchor="middle" font-size="12" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">escrow quarantine</text>
  <path d="M106 234 V268" fill="none" stroke="var(--exclusive)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#gold)"/>
  <path d="M280 234 V268" fill="none" stroke="var(--shared)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/>
  <rect x="22" y="272" width="516" height="62" rx="8" fill="var(--panel)" stroke="var(--shared)" stroke-width="1.6"/>
  <text x="280" y="297" text-anchor="middle" font-size="14" font-weight="500" fill="var(--shared)" font-family="JetBrains Mono, ui-monospace, monospace">Lexical join barrier · (wal_join.join(), net_join.join())</text>
  <text x="280" y="319" text-anchor="middle" font-size="13" font-weight="500" fill="var(--muted)">Every linear JoinHandle completes before parent frame pops</text>
  </g>
</svg>
