<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 348" width="560" height="348" role="img" aria-labelledby="title description">
  <title id="title">Warp AF_XDP buffer ownership</title>
  <desc id="description">An illustrated frame moves through the fill, receive, transmit, and completion rings. A live linear frame must be returned or consumed.</desc>
  <style>
    :root { --canvas: #111a25; --panel: #1b2735; --shared: #83dacc; --muted: #bac7d6; --text: #e8edf5; --error: #ff9fae; --exclusive: #ffbf7f; }
    @media (prefers-color-scheme: light) { :root { --canvas: #f7f5f0; --panel: #eeede7; --shared: #006b80; --muted: #535852; --text: #1b2030; --error: #9e2438; --exclusive: #a24800; } }
  </style>
  <defs><marker id="teal" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--shared)"/></marker><marker id="gold" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--exclusive)"/></marker><marker id="red" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--error)"/></marker></defs>
  <rect width="560" height="348" fill="var(--canvas)" rx="10"/>
  <g font-family="Inter, Arial, sans-serif">
  <rect x="24" y="32" width="148" height="88" rx="8" fill="var(--panel)" stroke="var(--shared)" stroke-width="1.6"/>
  <text x="98" y="60" text-anchor="middle" font-size="16" font-weight="500" fill="var(--shared)">1 · Fill Ring</text>
  <text x="98" y="83" text-anchor="middle" font-size="12" font-weight="500" fill="var(--text)" font-family="JetBrains Mono, ui-monospace, monospace">replenish(sink)</text>
  <text x="98" y="104" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">NIC RX DMA ready</text>
  <path d="M172 76 H216" fill="none" stroke="var(--shared)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/>
  <text x="194" y="65" text-anchor="middle" font-size="12" font-weight="500" fill="var(--shared)">DMA</text>
  <rect x="220" y="32" width="148" height="88" rx="8" fill="var(--panel)" stroke="var(--exclusive)" stroke-width="1.6"/>
  <text x="294" y="60" text-anchor="middle" font-size="16" font-weight="500" fill="var(--exclusive)">2 · RX Ring</text>
  <text x="294" y="83" text-anchor="middle" font-size="12" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">UmemFrame[Rx]</text>
  <text x="294" y="104" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">Zero-copy view</text>
  <path d="M294 120 V192" fill="none" stroke="var(--exclusive)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#gold)"/>
  <text x="304" y="160" text-anchor="start" font-size="12" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">turn_around</text>
  <rect x="220" y="196" width="148" height="88" rx="8" fill="var(--panel)" stroke="var(--exclusive)" stroke-width="1.6"/>
  <text x="294" y="224" text-anchor="middle" font-size="16" font-weight="500" fill="var(--exclusive)">3 · TX Ring</text>
  <text x="294" y="247" text-anchor="middle" font-size="12" font-weight="500" fill="var(--exclusive)" font-family="JetBrains Mono, ui-monospace, monospace">UmemFrame[Tx]</text>
  <text x="294" y="268" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">EDT paced send</text>
  <path d="M220 240 H176" fill="none" stroke="var(--exclusive)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#gold)"/>
  <text x="198" y="229" text-anchor="middle" font-size="12" font-weight="500" fill="var(--exclusive)">sent</text>
  <rect x="24" y="196" width="148" height="88" rx="8" fill="var(--panel)" stroke="var(--shared)" stroke-width="1.6"/>
  <text x="98" y="224" text-anchor="middle" font-size="16" font-weight="500" fill="var(--shared)">4 · Completion</text>
  <text x="98" y="247" text-anchor="middle" font-size="12" font-weight="500" fill="var(--text)">Reclaim 4K slot</text>
  <text x="98" y="268" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">0 Arc refcounts</text>
  <path d="M98 196 V124" fill="none" stroke="var(--shared)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/>
  <text x="88" y="160" text-anchor="end" font-size="12" font-weight="500" fill="var(--shared)">reuse</text>
  <path d="M368 76 H398" fill="none" stroke="var(--error)" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#red)"/>
  <rect x="402" y="42" width="136" height="152" rx="8" fill="var(--panel)" stroke="var(--error)" stroke-width="1.6"/>
  <text x="470" y="72" text-anchor="middle" font-size="15" font-weight="500" fill="var(--error)">Drop frame?</text>
  <text x="470" y="98" text-anchor="middle" font-size="15" font-weight="500" fill="var(--error)">Rejected</text>
  <text x="470" y="124" text-anchor="middle" font-size="14" font-weight="500" fill="var(--text)" font-family="JetBrains Mono, ui-monospace, monospace">Error E0302</text>
  <text x="470" y="150" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">No leaked</text>
  <text x="470" y="169" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">UMEM slots</text>
  <text x="280" y="316" text-anchor="middle" font-size="12" font-weight="500" fill="var(--muted)">16B XdpDescWire · Domain-1 DmaSlab · 100% linear frame conservation</text>
  </g>
</svg>
