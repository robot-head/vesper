<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="560" height="260" role="img" aria-labelledby="title description">
  <title id="title">Two loans into one Broker</title>
  <desc id="description">The exclusive loan reaches index and metrics. A separate shared loan reaches config. No field appears in both loans.</desc>
  <style>
    :root { --canvas: #111a25; --panel: #1b2735; --border: #536479; --shared: #83dacc; --muted: #bac7d6; --text: #e8edf5; --error: #ff9fae; --exclusive: #ffbf7f; }
    @media (prefers-color-scheme: light) { :root { --canvas: #f7f5f0; --panel: #eeede7; --border: #747874; --shared: #006b80; --muted: #535852; --text: #1b2030; --error: #9e2438; --exclusive: #a24800; } }
  </style>
  <defs><marker id="teal" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--shared)"/></marker><marker id="gold" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--exclusive)"/></marker><marker id="red" viewBox="0 0 9 9" markerWidth="7" markerHeight="7" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="var(--error)"/></marker></defs>
  <rect width="560" height="260" fill="var(--canvas)" rx="10"/>
  <g font-family="Inter, Arial, sans-serif">
  <text x="30" y="38" text-anchor="start" font-size="19" font-weight="500" fill="var(--muted)">Parameters of append</text>
  <text x="371" y="38" text-anchor="start" font-size="19" font-weight="500" fill="var(--muted)">Broker fields</text>
  <rect x="28" y="71" width="170" height="56" rx="8" fill="var(--panel)" stroke="var(--exclusive)" stroke-width="1.6"/>
  <text x="113" y="106" text-anchor="middle" font-size="21" font-weight="500" fill="var(--exclusive)">inout · write</text>
  <rect x="28" y="186" width="170" height="52" rx="8" fill="var(--panel)" stroke="var(--shared)" stroke-width="1.6"/>
  <text x="113" y="219" text-anchor="middle" font-size="21" font-weight="500" fill="var(--shared)">in · read</text>
  <path d="M198 99 H251 V83 H351" fill="none" stroke="var(--exclusive)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#gold)"/>
  <path d="M251 99 V148 H351" fill="none" stroke="var(--exclusive)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#gold)"/>
  <path d="M198 212 H351" fill="none" stroke="var(--shared)" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)" stroke-dasharray="5 5"/>
  <rect x="362" y="57" width="167" height="50" rx="8" fill="var(--panel)" stroke="var(--border)" stroke-width="1.6"/>
  <text x="445" y="89" text-anchor="middle" font-size="21" font-weight="500" fill="var(--text)">index</text>
  <rect x="362" y="122" width="167" height="50" rx="8" fill="var(--panel)" stroke="var(--border)" stroke-width="1.6"/>
  <text x="445" y="154" text-anchor="middle" font-size="21" font-weight="500" fill="var(--text)">metrics</text>
  <rect x="362" y="187" width="167" height="50" rx="8" fill="var(--panel)" stroke="var(--border)" stroke-width="1.6"/>
  <text x="445" y="219" text-anchor="middle" font-size="21" font-weight="500" fill="var(--text)">config</text>
  </g>
</svg>
