# CI on BuildBuddy Workflows (https://www.buildbuddy.io/docs/workflows-config).
# Each action is one GitHub check. Every build and test runs through Bazel
# (docs/bazel.md): compile actions execute on BuildBuddy's remote executors
# (--config=rbe_build); host-dependent tests run in the VM, which has Lean and
# QEMU. BuildBuddy adds the API key, build event upload and ROLE=CI itself.

actions:
  - name: "Test all targets"
    container_image: "ubuntu-24.04"
    resource_requests:
      cpu: 8
      memory: 22GB
      disk: 60GB
    timeout: 60m
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
    steps:
      # Recycled runners keep earlier runs' /tmp leftovers (#1200).
      - run: "scripts/ci/reclaim-disk.sh"
      - run: "python3 tools/bazel/sync_build_files.py --check"
      - run: "scripts/ci/install-lean.sh"
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      # Core builds, tests, Clippy and rustfmt. The explicit build filter
      # keeps replay test binaries and their runfiles off this runner.
      - run: |
          export VESPER_LEAN="$(cat .ci-lean-path)"
          scripts/ci/reclaim-disk.sh watch &
          disk_watch=$!
          trap 'kill "$disk_watch" 2>/dev/null || true; scripts/ci/reclaim-disk.sh report' EXIT
          bazel test --config=ci --config=rbe_build --config=ci_tests --remote_download_outputs=minimal --build_tag_filters=-lean_replay,-self_host --test_tag_filters=-lean_replay,-self_host //...

  # The corpus differentials (test/self_host_*, tagged `self_host` by
  # tools/bazel/defs.bzl) on their own runner: on one runner with the rest of
  # the suite they pushed "Test all targets" past the one-hour limit (#1519).
  - name: "Self-host differentials"
    container_image: "ubuntu-24.04"
    resource_requests:
      cpu: 8
      memory: 22GB
      disk: 60GB
    timeout: 60m
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
    steps:
      - run: "scripts/ci/reclaim-disk.sh"
      - run: "scripts/ci/install-lean.sh"
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - run: |
          export VESPER_LEAN="$(cat .ci-lean-path)"
          scripts/ci/reclaim-disk.sh watch &
          disk_watch=$!
          trap 'kill "$disk_watch" 2>/dev/null || true; scripts/ci/reclaim-disk.sh report' EXIT
          bazel test --config=ci --config=rbe_build --config=ci_tests --remote_download_outputs=minimal --build_tests_only --test_tag_filters=self_host,-lean_replay //...

  - name: "Native and acceptance scripts"
    container_image: "ubuntu-24.04"
    resource_requests:
      cpu: 8
      memory: 22GB
      disk: 60GB
    timeout: 60m
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
    env:
      BAZEL_FLAGS: "--config=ci --config=rbe_build"
      # Written by the prebuild step below; scripts/bazel-lib.sh reads it.
      VESPER_BAZEL_EXECUTABLES: ".ci-bazel-executables"
    steps:
      - run: "scripts/ci/reclaim-disk.sh"
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python-is-python3 qemu-user binutils-aarch64-linux-gnu
      - run: "scripts/ci/install-lean.sh"
      # One Bazel build for every executable the scripts run, instead of a
      # build and a cquery per executable.
      - run: "scripts/ci/prebuild-acceptance.sh .ci-bazel-executables"
      - run: "scripts/test-aarch64.sh"
      - run: "scripts/test-simd-aarch64.sh"
      - run: "scripts/test-native-host.sh"
      - run: "scripts/test-canonical-protocols.sh"
      - run: "scripts/test-diagnostics.sh"
      # Every tracked .ves file must be `vesper fmt` canonical (scripts/fmt-exclude.txt).
      - run: "scripts/test-fmt.sh"
      - run: "scripts/test-editor.sh"
      - run: "scripts/test-expansion-foundations.sh"
      - run: "scripts/test-recovery.sh"
      - run: "scripts/test-source-tooling.sh"
      - run: "scripts/test-source-macros.sh"
      - run: |
          VESPER_LEAN="$(cat .ci-lean-path)" scripts/test-format-proof.sh
      - run: "scripts/test-macro-preview.sh"
      - run: "scripts/test-source-macro-parameters.sh"
      - run: "scripts/test-source-macro-tuples.sh"
      - run: "scripts/test-doc-links.sh"
      # Keep model validation and replay on this separate required runner.
      - run: "scripts/ci/check-lean-models.sh"
      - run: "bash scripts/ci/test-lean-replay.sh"
