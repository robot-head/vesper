# CI on BuildBuddy Workflows (https://www.buildbuddy.io/docs/workflows-config).
# Each action is one GitHub check. Every build and test runs through Bazel
# (docs/bazel.md): compile actions execute on BuildBuddy's remote executors
# (--config=rbe_build); host-dependent tests run in the VM, which has Lean and
# QEMU. BuildBuddy adds the API key, build event upload and ROLE=CI itself.

actions:
  - name: "Test all targets"
    container_image: "ubuntu-24.04"
    # .bazelrc `ci_tests` budgets 18GiB of this for local tests; keep the
    # resources:memory tags in BUILD.bazel honest so the VM stays inside it.
    resource_requests:
      cpu: 8
      memory: 22GB
      disk: 60GB
    timeout: 60m
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
    steps:
      - &aspect_directory
        run: mkdir -p ./.git/vesper-aspect
      - &aspect_download
        run: curl --fail --silent --show-error --location --retry 3 https://github.com/aspect-build/aspect-cli/releases/download/v2026.47.12/aspect-launcher-x86_64-unknown-linux-musl -o ./.git/vesper-aspect/aspect
      - &aspect_verify
        run: sha256sum --check .aspect/launcher-linux-x86_64.sha256
      - &aspect_executable
        run: chmod +x ./.git/vesper-aspect/aspect
      # Recycled runners keep earlier runs' /tmp leftovers (#1200).
      - run: ./.git/vesper-aspect/aspect ci reclaim-disk
      - run: ./.git/vesper-aspect/aspect maintenance bazel sync-build-files -- --check
      - run: ./.git/vesper-aspect/aspect ci install-lean
      - &apt_update
        run: sudo apt-get update
      - &build_tools
        run: sudo apt-get install -y build-essential
      # Core builds, tests, Clippy and rustfmt. The explicit build filter
      # keeps replay test binaries and their runfiles off this runner. Test
      # binaries are optimized, with debug assertions and overflow checks on
      # (`--config=ci_opt`), as in the self-host checks below, which then share
      # its compiler builds in the remote cache.
      - run: ./.git/vesper-aspect/aspect ci bazel-tests -- --config=ci --config=rbe_build --config=ci_tests --config=ci_opt --remote_download_outputs=minimal --build_tag_filters=-lean_replay,-self_host --test_tag_filters=-lean_replay,-self_host //...

  # The corpus differentials (test/self_host_*, tagged `self_host` by
  # tools/bazel/defs.bzl) on their own runners: on one runner with the rest of
  # the suite they pushed "Test all targets" past the one-hour limit, and on
  # one runner of their own they took 48 minutes (#1519). The codegen ones
  # (also tagged `self_host_codegen`) run in "Self-host codegen differentials".
  # The rest neared the hour on one runner too (#1882), so the ones tagged
  # `self_host_part2` (_SELF_HOST_PART2 in tools/bazel/defs.bzl) run in
  # "Self-host differentials 2". `--test_summary=short` prints each target's
  # time, which is what the split is balanced on. All three, like "Test all
  # targets", build optimized test binaries (`--config=ci_opt` in .bazelrc),
  # with debug assertions and overflow checks still on.
  - name: "Self-host differentials"
    container_image: "ubuntu-24.04"
    resource_requests:
      cpu: 8
      memory: 25GB
      disk: 60GB
    timeout: 60m
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
    steps:
      - *aspect_directory
      - *aspect_download
      - *aspect_verify
      - *aspect_executable
      - run: ./.git/vesper-aspect/aspect ci reclaim-disk
      - run: ./.git/vesper-aspect/aspect ci install-lean
      - *apt_update
      - *build_tools
      - run: ./.git/vesper-aspect/aspect ci bazel-tests -- --config=ci --config=rbe_build --config=ci_tests --config=ci_opt --remote_download_outputs=minimal --build_tests_only --test_summary=short --test_tag_filters=self_host,-self_host_codegen,-self_host_part2,-lean_replay //...

  # The `self_host_part2` differentials (see above).
  - name: "Self-host differentials 2"
    container_image: "ubuntu-24.04"
    resource_requests:
      cpu: 8
      memory: 25GB
      disk: 60GB
    timeout: 60m
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
    steps:
      - *aspect_directory
      - *aspect_download
      - *aspect_verify
      - *aspect_executable
      - run: ./.git/vesper-aspect/aspect ci reclaim-disk
      - run: ./.git/vesper-aspect/aspect ci install-lean
      - *apt_update
      - *build_tools
      - run: ./.git/vesper-aspect/aspect ci bazel-tests -- --config=ci --config=rbe_build --config=ci_tests --config=ci_opt --remote_download_outputs=minimal --build_tests_only --test_summary=short --test_tag_filters=self_host_part2,-lean_replay //...

  # The codegen swap point and backend differentials (`self_host_codegen`).
  # These carry no resources:memory tag, so the VM gets the same 25GB as the
  # other differentials: at 22GB the check failed after about 50 minutes on
  # #1950 and #1970.
  - name: "Self-host codegen differentials"
    container_image: "ubuntu-24.04"
    resource_requests:
      cpu: 8
      memory: 25GB
      disk: 60GB
    timeout: 60m
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
    steps:
      - *aspect_directory
      - *aspect_download
      - *aspect_verify
      - *aspect_executable
      - run: ./.git/vesper-aspect/aspect ci reclaim-disk
      - run: ./.git/vesper-aspect/aspect ci install-lean
      - *apt_update
      - *build_tools
      - run: ./.git/vesper-aspect/aspect ci bazel-tests -- --config=ci --config=rbe_build --config=ci_tests --config=ci_opt --remote_download_outputs=minimal --build_tests_only --test_summary=short --test_tag_filters=self_host_codegen,-lean_replay //...

  - name: "Native and acceptance scripts"
    container_image: "ubuntu-24.04"
    resource_requests:
      cpu: 8
      memory: 22GB
      disk: 60GB
    timeout: 60m
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
    env:
      BAZEL_FLAGS: "--config=ci --config=rbe_build"
      # Written by the prebuild step below and read by the acceptance tasks.
      VESPER_BAZEL_EXECUTABLES: ".ci-bazel-executables"
    steps:
      - *aspect_directory
      - *aspect_download
      - *aspect_verify
      - *aspect_executable
      - run: ./.git/vesper-aspect/aspect ci reclaim-disk
      - *apt_update
      - run: sudo apt-get install -y build-essential qemu-user binutils-aarch64-linux-gnu
      - run: ./.git/vesper-aspect/aspect ci install-lean
      # One Bazel build for every executable the tasks run, instead of a
      # build and a cquery per executable.
      - run: ./.git/vesper-aspect/aspect ci prebuild-acceptance -- .ci-bazel-executables
      - run: ./.git/vesper-aspect/aspect acceptance test-aarch64
      - run: ./.git/vesper-aspect/aspect acceptance test-simd-aarch64
      - run: ./.git/vesper-aspect/aspect acceptance test-native-host
      - run: ./.git/vesper-aspect/aspect acceptance test-canonical-protocols
      - run: ./.git/vesper-aspect/aspect acceptance test-diagnostics
      # Every tracked .ves file must be `vesper fmt` canonical (scripts/fmt-exclude.txt).
      - run: ./.git/vesper-aspect/aspect acceptance test-fmt
      - run: ./.git/vesper-aspect/aspect acceptance test-editor
      - run: ./.git/vesper-aspect/aspect acceptance test-expansion-foundations
      - run: ./.git/vesper-aspect/aspect acceptance test-recovery
      - run: ./.git/vesper-aspect/aspect acceptance test-source-tooling
      - run: ./.git/vesper-aspect/aspect acceptance test-source-macros
      - run: ./.git/vesper-aspect/aspect acceptance test-format-proof
      - run: ./.git/vesper-aspect/aspect acceptance test-macro-preview
      - run: ./.git/vesper-aspect/aspect acceptance test-source-macro-parameters
      - run: ./.git/vesper-aspect/aspect acceptance test-source-macro-tuples
      - run: ./.git/vesper-aspect/aspect acceptance test-doc-links
      # Keep model validation and replay on this separate required runner.
      - run: ./.git/vesper-aspect/aspect ci check-lean-models
      - run: ./.git/vesper-aspect/aspect ci test-lean-replay
