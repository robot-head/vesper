[package]
name = "@vesper/check-world"
version = "0.1.0"
edition = "2026"
license = "MIT OR Apache-2.0"
# The checked world only computes: no I/O, clock or network (design §42.3).
capability_ceiling = ["Fail", "Alloc"]

[dependencies]
"@vesper/ast" = { version = "^0.1", path = "../vesper-ast" }
"@vesper/check-collect" = { version = "^0.1", path = "../vesper-check-collect" }
"@vesper/check-data" = { version = "^0.1", path = "../vesper-check-data" }
"@vesper-std/arena" = { version = "^0.1", path = "../vesper-std/arena" }
"@vesper-std/intern" = { version = "^0.1", path = "../vesper-std/intern" }
