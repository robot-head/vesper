[package]
name = "@vesper/driver-commands"
version = "0.1.0"
edition = "2026"
# The command layers of the `vesper` CLI beyond the compile path
# (self-hosting SH5 lane 13, #1336). They read files through
# @vesper-std/fs and print, and reach the engines that are still Rust
# through the `HybridCommands` import (commands.vsys), which the hybrid
# compiler implements (crates/vesper-hybrid/src/commands.rs).
capability_ceiling = ["Fail", "Alloc", "Ffi[StdFs]", "Ffi[HybridCommands]"]
vsys = ["commands.vsys"]

[dependencies]
"@vesper/driver" = { version = "^0.1", path = "../vesper-driver" }
"@vesper/beacon" = { version = "^0.1", path = "../../crates/vesper-beacon/vesper" }
"@vesper-std/fs" = { version = "^0.1", path = "../vesper-std/fs" }
"@vesper-std/fmt" = { version = "^0.1", path = "../vesper-std/fmt" }
