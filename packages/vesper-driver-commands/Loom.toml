[package]
name = "@vesper/driver-commands"
version = "0.1.0"
edition = "2026"
# The routing in front of every command of the `vesper` CLI (self-hosting
# SH5 lane 13, #1336): help, version, the unknown-command error and the
# hand-off to `vesper-<tool>` programs (src/tool_commands.rs). It prints
# and finds tools through @vesper-std/fs and @vesper-std/env and runs them
# through @vesper-std/process; the command engines still in Rust it calls
# through @vesper/driver-engines (the `HybridCommands` import, which the
# hybrid compiler implements in crates/vesper-hybrid/src/commands.rs, and
# refused on wasm32-wasip2, #1996).
capability_ceiling = ["Fail", "Alloc", "Ffi[StdFs]", "Ffi[StdEnv]", "Ffi[StdProcess]", "Ffi[HybridCommands]", "Ffi[Blake3]"]

[dependencies]
"@vesper/driver" = { version = "^0.1", path = "../vesper-driver" }
"@vesper/driver-engines" = { version = "^0.1", path = "../vesper-driver-engines" }
"@vesper-std/env" = { version = "^0.1", path = "../vesper-std/env" }
"@vesper-std/fs" = { version = "^0.1", path = "../vesper-std/fs" }
"@vesper-std/process" = { version = "^0.1", path = "../vesper-std/process" }
# `vesper fmt`'s formatter, the Vesper port of vesper_fmt (#1996 part 3d).
"@vesper/fmt" = { version = "^0.1", path = "../../crates/vesper-fmt/vesper" }
# `vesper graph`'s lockfile reader, validation and report, the Vesper port
# of vesper_loom_calculus (#1996).
"@vesper/loom-calculus" = { version = "^0.1", path = "../../crates/vesper-loom-calculus/vesper" }
# `vesper proof-audit`, the Vesper port of src/proof_commands.rs (#1341,
# #1996), and `vesper verify SOURCE --format`, of src/verify_commands.rs.
"@vesper/proof-audit" = { version = "^0.1", path = "../vesper-proof-audit" }
"@vesper/verify" = { version = "^0.1", path = "../vesper-verify" }
# `vesper lsp`'s loop (#1828 part 15c).
"@vesper/lsp-server" = { version = "^0.1", path = "../vesper-lsp-server" }
