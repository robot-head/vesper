[package]
name = "@vesper/native-lib"
version = "0.1.0"
edition = "2026"
# The library object is emitted through @vesper/cranelift's `.vsys`
# library; the bodies are @vesper/codegen-scalar's plans, and a v2
# library's glue comes from the seq, numeric and export emitters.
capability_ceiling = ["Fail", "Alloc", "Ffi"]

[dependencies]
"@vesper/codegen-export-glue" = { version = "^0.1", path = "../vesper-codegen-export/glue" }
"@vesper/codegen-numeric" = { version = "^0.1", path = "../vesper-codegen-numeric" }
"@vesper/codegen-scalar-emit" = { version = "^0.1", path = "../vesper-codegen-scalar/emit" }
"@vesper/codegen-scalar" = { version = "^0.1", path = "../vesper-codegen-scalar" }
"@vesper/codegen-seq-emit" = { version = "^0.1", path = "../vesper-codegen-seq/emit" }
"@vesper/cranelift" = { version = "^0.1", path = "../vesper-cranelift" }
"@vesper/check-data" = { version = "^0.1", path = "../vesper-check-data" }
"@vesper/check-layout" = { version = "^0.1", path = "../vesper-check-layout" }
"@vesper/codegen-calls" = { version = "^0.1", path = "../vesper-codegen-calls" }
"@vesper/place-ir" = { version = "^0.1", path = "../vesper-place-ir" }
"@vesper/native-clif-opt" = { version = "^0.1", path = "../vesper-native-clif-opt" }
"@vesper/native-vectorize" = { version = "^0.1", path = "../vesper-native-vectorize" }
"@vesper/native-walk" = { version = "^0.1", path = "../vesper-codegen-walk" }
"@vesper/native-cold-outline" = { version = "^0.1", path = "../vesper-native-cold-outline" }
