[package]
name = "@vesper/codegen-calls-emit"
version = "0.1.0"
edition = "2026"
# Call emission reaches Cranelift through @vesper/cranelift's `.vsys`
# library; the decisions stay in @vesper/codegen-calls (no Ffi).
capability_ceiling = ["Fail", "Ffi"]

[dependencies]
"@vesper/cranelift" = { version = "^0.1", path = "../../vesper-cranelift" }
"@vesper/codegen-base" = { version = "^0.1", path = "../../vesper-codegen-base" }
