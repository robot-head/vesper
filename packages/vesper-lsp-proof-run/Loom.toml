[package]
name = "@vesper/lsp-proof-run"
version = "0.1.0"
edition = "2026"
# The proof-lens runner starts Lean and the proof auditor, and keeps its
# staging and .olean cache directories on disk.
capability_ceiling = ["Fail", "Alloc", "Ffi[StdFs]", "Ffi[StdProcess]", "Ffi[StdEnv]"]

[dependencies]
"@vesper-std/fs" = { version = "^0.1", path = "../vesper-std/fs" }
"@vesper-std/process" = { version = "^0.1", path = "../vesper-std/process" }
"@vesper-std/env" = { version = "^0.1", path = "../vesper-std/env" }
"@vesper-std/hash" = { version = "^0.1", path = "../vesper-std/hash" }
"@vesper-std/bytes" = { version = "^0.1", path = "../vesper-std/bytes" }
