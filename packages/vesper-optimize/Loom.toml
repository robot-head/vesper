[package]
name = "@vesper/optimize"
version = "0.1.0"
edition = "2026"
# The optimizer only computes: no I/O, clock or network (design §42.3).
capability_ceiling = ["Fail", "Alloc"]

[dependencies]
"@vesper/ast" = { version = "^0.1", path = "../vesper-ast" }
"@vesper/egraph" = { version = "^0.1", path = "../vesper-egraph" }
"@vesper-std/arena" = { version = "^0.1", path = "../vesper-std/arena" }
"@vesper-std/intern" = { version = "^0.1", path = "../vesper-std/intern" }
