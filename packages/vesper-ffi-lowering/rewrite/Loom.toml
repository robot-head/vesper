[package]
name = "@vesper/ffi-rewrite"
version = "0.1.0"
edition = "2026"
# The source rewrite of foreign (`.vsys`) calls (SH4 lane 13, #1287, part
# 2): `src/ffi_lowering.rs`'s `Rewriter` over @vesper/ast. It only
# computes: no I/O, clock or network (design §42.3).
capability_ceiling = ["Fail", "Alloc"]

[dependencies]
"@vesper/ffi-lowering" = { version = "^0.1", path = ".." }
"@vesper/ast" = { version = "^0.1", path = "../../vesper-ast" }
"@vesper-std/arena" = { version = "^0.1", path = "../../vesper-std/arena" }
"@vesper-std/intern" = { version = "^0.1", path = "../../vesper-std/intern" }
