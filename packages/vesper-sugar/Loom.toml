[package]
name = "@vesper/sugar"
version = "0.1.0"
edition = "2026"
# Sugar expansion only computes: no I/O, clock or network (design §42.3).
capability_ceiling = ["Alloc", "Fail"]

[dependencies]
"@vesper/front" = { version = "^0.1", path = "../vesper-front" }
"@vesper-std/arena" = { version = "^0.1", path = "../vesper-std/arena" }
"@vesper-std/intern" = { version = "^0.1", path = "../vesper-std/intern" }
"@vesper/ast" = { version = "^0.1", path = "../vesper-ast" }
