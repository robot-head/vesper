[package]
name = "@vesper-std/hash-sys"
version = "0.1.0"
edition = "2026"
capability_ceiling = ["Fail", "Alloc", "Ffi"]
# The `.vsys` library Blake3 and the C that provides it (manuscript §16.3):
# each wrapper in c/ includes one upstream BLAKE3 file with its symbols
# renamed; a per-target name exists only for the targets that build it.
vsys = ["blake3-@OS@.vsys"]
objects = [
    "c/b3-blake3.c",
    "c/b3-dispatch.c",
    "c/b3-portable.c",
    "c/b3-glue.c",
    "c/b3-sse2-@ARCH@.c",
    "c/b3-sse41-@ARCH@.c",
    "c/b3-avx2-@ARCH@.c",
    "c/b3-avx512-@ARCH@.c",
    "c/b3-neon-@ARCH@.c",
]

[dependencies]
"@vesper-std/hash" = { version = "^0.1", path = ".." }
