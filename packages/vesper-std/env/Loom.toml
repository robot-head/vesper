[package]
name = "@vesper-std/env"
version = "0.1.0"
edition = "2026"
capability_ceiling = ["Fail", "Alloc", "Ffi[StdEnv]"]
# The `.vsys` library this package imports (manuscript §16.3): every package
# that depends on it, and every executable over it, gets it from here.
vsys = ["env.vsys"]

[dependencies]
"@vesper-std/fs" = { version = "^0.1", path = "../fs" }
