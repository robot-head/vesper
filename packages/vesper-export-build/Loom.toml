[package]
name = "@vesper/export-build"
version = "0.1.0"
edition = "2026"
license = "MIT OR Apache-2.0"
# Reads the package it plans; no clock or network (design §42.3).
capability_ceiling = ["Fail", "Alloc", "Ffi[StdFs]"]

[dependencies]
"@vesper/check-collect" = { version = "^0.1", path = "../vesper-check-collect" }
"@vesper/check-data" = { version = "^0.1", path = "../vesper-check-data" }
"@vesper/check-layout" = { version = "^0.1", path = "../vesper-check-layout" }
"@vesper/check-names-packages" = { version = "^0.1", path = "../vesper-check-names-packages" }
"@vesper/codegen-export" = { version = "^0.1", path = "../vesper-codegen-export" }
"@vesper/stage2" = { version = "^0.1", path = "../vesper-stage2" }
"@vesper/place-ir" = { version = "^0.1", path = "../vesper-place-ir" }
"@vesper/place-ir-lower" = { version = "^0.1", path = "../vesper-place-ir-lower" }
"@vesper/vsys" = { version = "^0.1", path = "../vesper-vsys" }
"@vesper-std/fs" = { version = "^0.1", path = "../vesper-std/fs" }
"@vesper-std/intern" = { version = "^0.1", path = "../vesper-std/intern" }
