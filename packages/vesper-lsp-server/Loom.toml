[package]
name = "@vesper/lsp-server"
version = "0.1.0"
edition = "2026"
# The `vesper lsp` loop (#1828 part 15): it reads and writes the client's
# streams (part 16a) and calls the checked-document engine seam
# (@vesper/driver-engines' `lsp_engine_*`, the `HybridCommands` import)
# that the Rust session serves until the checker runs in Vesper.
capability_ceiling = ["Fail", "Alloc", "Ffi[HybridCommands]", "Ffi[StdFs]", "Ffi[StdProcess]"]

[dependencies]
# The engine seam: `lsp_engine_*` (#1828 part 15c).
"@vesper/driver-engines" = { version = "^0.1", path = "../vesper-driver-engines" }
"@vesper/lsp" = { version = "^0.1", path = "../vesper-lsp" }
"@vesper/serde" = { version = "^0.1", path = "../../crates/vesper-serde/vesper" }
# The client's streams (#1828 part 16a).
"@vesper-std/fs" = { version = "^0.1", path = "../vesper-std/fs" }
"@vesper-std/process" = { version = "^0.1", path = "../vesper-std/process" }
