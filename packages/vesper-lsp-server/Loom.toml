[package]
name = "@vesper/lsp-server"
version = "0.1.0"
edition = "2026"
# The `vesper lsp` loop (#1828 part 15): it computes over the client stream
# and calls the checked-document engine seam (@vesper/driver-engines'
# `lsp_engine_*`, the `HybridCommands` import) that the Rust session
# serves until the checker runs in Vesper.
capability_ceiling = ["Fail", "Alloc", "Ffi[HybridCommands]"]

[dependencies]
# The engine seam: `lsp_engine_*` (#1828 part 15c).
"@vesper/driver-engines" = { version = "^0.1", path = "../vesper-driver-engines" }
"@vesper/lsp" = { version = "^0.1", path = "../vesper-lsp" }
"@vesper/serde" = { version = "^0.1", path = "../../crates/vesper-serde/vesper" }
