[package]
name = "@local/proof-lens-toolchain"
version = "0.1.0"
edition = "2026"
# The fake Lean toolchain of tests/self_host_proof_lens.rs: one native
# program that is the launcher, `prefix/bin/lean` or the proof auditor by
# the name it runs under.
capability_ceiling = ["Fail", "Alloc", "Ffi[StdFs]", "Ffi[StdProcess]", "Ffi[StdEnv]"]

[dependencies]
"@vesper-std/fs" = { version = "^0.1", path = "../../../packages/vesper-std/fs" }
"@vesper-std/env" = { version = "^0.1", path = "../../../packages/vesper-std/env" }
"@vesper-std/process" = { version = "^0.1", path = "../../../packages/vesper-std/process" }
