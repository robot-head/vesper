name: Merge gate
description: >-
  Project rule (#1321): no CI for pull requests that cannot merge yet. Runs
  scripts/ci/merge_gate.py against main and the open pull requests. When the
  pull request cannot merge yet (its base is not main, it carries an open
  parent's commits, or it conflicts with main), it cancels every GitHub
  Actions run for the commit, this one included, and fails with the reason.
  It runs as the first step of each job it guards (#1479), so it takes no
  runner of its own. The caller checks the pull request head out into `path`
  first (full history, sparse is fine: .github/actions and scripts/ci), since
  the job's own checkout of the merge ref fails on a conflicting pull request.
  BuildBuddy checks are not GitHub Actions runs and are not cancelled here.
inputs:
  number:
    description: Pull request number.
    required: true
  base-ref:
    description: The pull request's base branch.
    required: true
  head-sha:
    description: The pull request's head commit.
    required: true
  path:
    description: Checkout of the pull request head, relative to the workspace.
    required: false
    default: .gate
  token:
    description: Token with actions:write and pull-requests:read.
    required: false
    default: ${{ github.token }}
outputs:
  blocked:
    description: "'true' when the pull request cannot merge yet (the step also fails)."
    value: ${{ steps.gate.outputs.blocked }}
runs:
  using: composite
  steps:
    - name: Check whether this pull request can merge yet
      id: gate
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.path }}
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        NUMBER: ${{ inputs.number }}
        BASE_REF: ${{ inputs.base-ref }}
        HEAD_SHA: ${{ inputs.head-sha }}
        RUN_ID: ${{ github.run_id }}
      run: |
        set -euo pipefail
        gate="$RUNNER_TEMP/merge-gate-$RUN_ID-$GITHUB_JOB"
        mkdir -p "$gate"
        git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
        gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
          --jq '.[] | {number, base: .base.ref, ref: "refs/gate/pr/\(.number)"}' \
          | jq -s . > "$gate/open-prs.json"
        refspecs=$(jq -r '.[] | "+refs/pull/\(.number)/head:refs/gate/pr/\(.number)"' "$gate/open-prs.json")
        # shellcheck disable=SC2086
        [ -z "$refspecs" ] || git fetch --quiet origin $refspecs
        git config user.name merge-gate
        git config user.email merge-gate@users.noreply.github.com
        if python3 scripts/ci/merge_gate.py --number "$NUMBER" --base-ref "$BASE_REF" \
            --head "$HEAD_SHA" --main origin/main --open-prs "$gate/open-prs.json" \
            | tee "$gate/gate.txt"; then
          echo "blocked=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "blocked=true" >> "$GITHUB_OUTPUT"
        {
          echo "### CI skipped: this pull request cannot merge yet"
          cat "$gate/gate.txt"
          echo
          echo "Push again once the parent has merged or the conflict is fixed."
        } >> "$GITHUB_STEP_SUMMARY"
        # Runs for the same push can appear a few seconds after this one.
        for pass in 1 2 3; do
          gh api --paginate "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&per_page=100" \
            --jq ".workflow_runs[] | select(.id != $RUN_ID and .status != \"completed\") | .id" |
          while read -r id; do
            echo "cancelling run $id"
            gh api -X POST "repos/$REPO/actions/runs/$id/cancel" >/dev/null || true
          done
          [ "$pass" = 3 ] || sleep 20
        done
        # Last, this run, so its other jobs do not take runners either.
        gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/cancel" >/dev/null || true
        exit 1
