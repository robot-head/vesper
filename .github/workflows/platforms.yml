name: Platforms
# Linux CI runs the general workspace and acceptance suites on BuildBuddy.
# macOS and Windows run only host-specific tests and native executables.
# Run on pushes to main, on pull requests, and on merge queue groups. A push
# trigger on every branch would start a second, duplicate run for each commit
# pushed to a PR branch. The merge queue only advances once the required
# checks report on its temporary gh-readonly-queue/main/* branch, so
# `merge_group` must stay here for as long as the queue is enabled on main.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: Test profile (Linux coverage; native OS tests are unchanged)
        type: choice
        options: [full, pr]
        default: full
      checkout_ref:
        description: Optional commit or ref to validate (resolved to an immutable SHA)
        type: string
        default: ''
  workflow_call:
    inputs:
      profile:
        type: string
        default: full
      checkout_ref:
        type: string
        required: true
    outputs:
      checked_sha:
        description: Exact tested SHA, only emitted after every platform job succeeds
        value: ${{ jobs.complete.outputs.checked_sha }}
      validation_profile:
        description: Successful validation profile
        value: ${{ jobs.complete.outputs.validation_profile }}

permissions:
  contents: read

# Newer PR/main runs replace obsolete validation; nightly and release calls
# have independent run-id groups so they cannot cancel an exact-SHA candidate.
concurrency:
  group: platforms-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'push' && 'main' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  plan:
    name: Plan platform coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      profile: ${{ steps.plan.outputs.profile }}
      groups: ${{ steps.plan.outputs.groups }}
      ports: ${{ steps.ports.outputs.crates }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install workflow test dependency
        run: python -m pip install PyYAML==6.0.2
      - name: Check CI policy and workflow regressions
        run: python -m unittest discover -s scripts/ci/tests -p 'test_platform*.py'
      - id: plan
        env:
          REQUESTED_PROFILE: ${{ inputs.profile || (github.event_name == 'schedule' && 'full') || 'pr' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          python scripts/ci/platform_test_plan.py --profile "$REQUESTED_PROFILE" \
            --base "$BASE_SHA" --head "$(git rev-parse HEAD)" \
            --github-output "$GITHUB_OUTPUT" --output "$RUNNER_TEMP/platform-plan.json"
      - id: ports
        name: Choose the ports to test
        env:
          REQUESTED_PROFILE: ${{ inputs.profile || (github.event_name == 'schedule' && 'full') || 'pr' }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          crates=$(python scripts/ci/port_harness_selection.py --profile "$REQUESTED_PROFILE" \
            --event "$EVENT" --base "$BASE_SHA" --head "$(git rev-parse HEAD)")
          echo "ports to test: $crates"
          echo "crates=$crates" >> "$GITHUB_OUTPUT"
      - name: Preserve platform plan
        uses: actions/upload-artifact@v4
        with:
          name: platform-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/platform-plan.json
  # Linux owns the workspace, proof, lint and general acceptance suites.
  # These lanes exercise only host-specific implementations and native ABI.
  platform:
    needs: plan
    if: ${{ always() && !cancelled() }}
    name: ${{ matrix.name }}${{ needs.plan.outputs.profile == 'full' && ' (full)' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (AArch64)
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Require successful profile planning
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$PLAN_RESULT" = success
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test macOS fiber and kqueue implementations
        run: |
          cargo test --locked -p vesper-fiber-abi --test platform
          cargo test --locked -p vesper-pulse --test drivers
          cargo test --locked -p vesper-pulse --test pool
          cargo test --locked -p vesper-loom-tuf --test offline system_symlink_ancestor_is_accepted -- --exact
      - name: Validate native Mach-O executables
        run: |
          cargo build --locked --bin vesper
          VESPER_NATIVE_BINARY=target/debug/vesper scripts/ci/test-native-executables.sh
      - name: Test the Cranelift C-ABI shim
        # Self-hosting SH0 lane 4 (#1126): Vesper drives Cranelift through
        # crates/vesper-cranelift-sys, links the object it builds and runs it.
        run: cargo test --locked -p vesper-cranelift-sys
      - name: Test the Vesper port export ABI
        # Only the host-sensitive tier of the port harness: the pilot's export
        # ABI v2/v3 libraries and divergence checks, package linking and the
        # closure guard. The ported crates run once, in the Linux job below.
        env:
          VESPER_PORT_COMPILER: ${{ github.workspace }}/target/debug/vesper
          VESPER_PORT_HARNESS_SCOPE: abi
        run: scripts/test-port-harness.sh

  windows:
    needs: plan
    if: ${{ always() && !cancelled() }}
    name: Windows (x86_64 MSVC)${{ needs.plan.outputs.profile == 'full' && ' (full)' || '' }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Require successful profile planning
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$PLAN_RESULT" = success
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test Windows fiber and IOCP implementations
        run: |
          cargo test --locked -p vesper-fiber-abi --test windows_platform
          cargo test --locked -p vesper-pulse --test windows
          cargo test --locked -p vesper-pulse --test drivers
          cargo test --locked -p vesper-pulse --test pool
      - name: Validate native COFF executables
        run: |
          cargo build --locked --bin vesper
          VESPER_NATIVE_BINARY=target/debug/vesper.exe VESPER_NATIVE_SUFFIX=.exe scripts/ci/test-native-executables.sh
      - name: Test the Cranelift C-ABI shim
        # Self-hosting SH0 lane 4 (#1126): Vesper drives Cranelift through
        # crates/vesper-cranelift-sys, links the object it builds and runs it.
        run: cargo test --locked -p vesper-cranelift-sys
      - name: Test the Vesper port export ABI
        # Only the host-sensitive tier of the port harness: the pilot's export
        # ABI v2/v3 libraries and divergence checks, package linking and the
        # closure guard. The ported crates run once, in the Linux job below.
        env:
          VESPER_PORT_COMPILER: ${{ github.workspace }}/target/debug/vesper.exe
          VESPER_PORT_HARNESS_SCOPE: abi
        run: scripts/test-port-harness.sh

  # The ported crates' tests and divergence checks are platform-neutral, so
  # they run once, here (#1010). Bazel on BuildBuddy builds the same ports.
  # One optimized compiler build is shared by every shard (#1103): nearly all
  # of the harness's time is the compiler compiling Vesper sources, which a
  # debug build of it did several times slower.
  ports-compiler:
    needs: plan
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.ports != 'none' }}
    name: Vesper ports compiler
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ports-compiler
      - name: Build the compiler (port-compiler profile)
        run: cargo build --locked --profile port-compiler --bin vesper
      - uses: actions/upload-artifact@v4
        with:
          name: vesper-port-compiler
          path: target/port-compiler/vesper
          retention-days: 1
          overwrite: true

  # Seven parallel shards of the harness (#1019, #1100) keep each near 30
  # min; with three, the last one ran past 90 min. On pull requests the plan
  # names the affected ports (scripts/ci/port_harness_selection.py): a change
  # inside some ports' crates tests only those ports and their dependents;
  # anything else, and every push to main and nightly, tests them all.
  # When the plan names no affected port, the shards are skipped as jobs, so
  # they take no runners (#1321); `complete` accepts that skip.
  ports:
    needs: [plan, ports-compiler]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.ports != 'none' }}
    name: Vesper ports (Linux ${{ matrix.shard }}/7)${{ needs.plan.outputs.profile == 'full' && ' (full)' || '' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    # A backstop: each shard's tests and divergent builds take about
    # 10-30 minutes (scripts/test-port-harness.sh).
    timeout-minutes: 60
    steps:
      - name: Require successful profile planning
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$PLAN_RESULT" = success
      - name: Require the shared compiler
        env:
          PORTS: ${{ needs.plan.outputs.ports }}
          COMPILER_RESULT: ${{ needs.ports-compiler.result }}
        run: |
          if [ "$PORTS" = none ]; then
            echo "no port is affected by this change; nothing to test"
          else
            test "$COMPILER_RESULT" = success
          fi
      - if: ${{ needs.plan.outputs.ports != 'none' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Verify exact checkout
        if: ${{ needs.plan.outputs.ports != 'none' }}
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - if: ${{ needs.plan.outputs.ports != 'none' }}
        uses: dtolnay/rust-toolchain@stable
      - if: ${{ needs.plan.outputs.ports != 'none' }}
        uses: Swatinem/rust-cache@v2
        with:
          key: ports-${{ matrix.shard }}
      - if: ${{ needs.plan.outputs.ports != 'none' }}
        uses: actions/download-artifact@v4
        with:
          name: vesper-port-compiler
          path: ${{ runner.temp }}/port-compiler
      - name: Test the Vesper port harness
        if: ${{ needs.plan.outputs.ports != 'none' }}
        # Every port compiles with the shared compiler downloaded above.
        env:
          VESPER_PORT_COMPILER: ${{ runner.temp }}/port-compiler/vesper
          VESPER_PORT_HARNESS_SHARD: ${{ matrix.shard }}
          VESPER_PORT_HARNESS_CRATES: ${{ needs.plan.outputs.ports }}
        run: |
          chmod +x "$VESPER_PORT_COMPILER"
          scripts/test-port-harness.sh

  complete:
    name: Platform validation complete
    needs: [plan, platform, windows, ports]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      checked_sha: ${{ steps.ready.outputs.checked_sha }}
      validation_profile: ${{ steps.ready.outputs.validation_profile }}
    steps:
      - id: ready
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          MAC_RESULT: ${{ needs.platform.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          PORTS_RESULT: ${{ needs.ports.result }}
          PORTS: ${{ needs.plan.outputs.ports }}
          CHECKED_SHA: ${{ needs.plan.outputs.sha }}
          PROFILE: ${{ needs.plan.outputs.profile }}
        run: |
          test "$PLAN_RESULT" = success
          test "$MAC_RESULT" = success
          test "$WINDOWS_RESULT" = success
          # The shards are skipped only when no port is affected.
          if [ "$PORTS_RESULT" != skipped ] || [ "$PORTS" != none ]; then
            test "$PORTS_RESULT" = success
          fi
          echo "checked_sha=$CHECKED_SHA" >> "$GITHUB_OUTPUT"
          echo "validation_profile=$PROFILE" >> "$GITHUB_OUTPUT"
