name: Platforms
# Linux CI runs the general workspace and acceptance suites on BuildBuddy.
# macOS and Windows run only host-specific tests and native executables.
# Run on pushes to main, nightly, on merge queue groups and by dispatch.
# Pull requests do not trigger it directly (#1479): once a pull request can
# merge, `Native and acceptance scripts` is green and no BuildBuddy check has
# failed, `Native platform checks`
# (native-checks.yml) dispatches it on the PR branch with `pull_request` set,
# and its macOS and Windows jobs report the required checks on the PR head.
# That run skips the Linux port shards, which run on main and nightly. The
# merge queue only advances once the required
# checks report on its temporary gh-readonly-queue/main/* branch, so
# `merge_group` must stay here for as long as the queue is enabled on main.
on:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: Test profile (Linux coverage; native OS tests are unchanged)
        type: choice
        options: [full, pr]
        default: full
      checkout_ref:
        description: Optional commit or ref to validate (resolved to an immutable SHA)
        type: string
        default: ''
      pull_request:
        description: Pull request number (set by native-checks.yml); runs macOS and Windows only
        type: string
        default: ''
  workflow_call:
    inputs:
      profile:
        type: string
        default: full
      checkout_ref:
        type: string
        required: true
    outputs:
      checked_sha:
        description: Exact tested SHA, only emitted after every platform job succeeds
        value: ${{ jobs.complete.outputs.checked_sha }}
      validation_profile:
        description: Successful validation profile
        value: ${{ jobs.complete.outputs.validation_profile }}

permissions:
  contents: read

# A newer PR dispatch replaces the older one for that branch, and so does a
# newer `pr`-profile dispatch by hand: before, each hand dispatch had a group
# of its own, so a branch dispatched three times queued three runs, each with
# nine port shards and a macOS job, behind the account's 5 macOS runners.
# Hand dispatches with profile `full` and those on main keep their own groups.
# Main runs are never cancelled (#1479): pull requests no longer run the port
# shards, so a main run is the first to catch a port regression and must
# finish. One main run goes at a time; GitHub keeps only the newest waiting push, so a burst of
# merges collapses into one more run. Nightly and release calls have
# independent run-id groups so they cannot cancel an exact-SHA candidate.
concurrency:
  group: platforms-${{ github.event_name == 'workflow_dispatch' && (inputs.pull_request != '' || (inputs.profile == 'pr' && github.ref != 'refs/heads/main')) && github.ref || github.event_name == 'push' && 'main' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && (inputs.pull_request != '' || (inputs.profile == 'pr' && github.ref != 'refs/heads/main')) }}

jobs:
  plan:
    name: Plan platform coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.plan.outputs.sha || steps.legacy_plan.outputs.sha }}
      profile: ${{ steps.plan.outputs.profile || steps.legacy_plan.outputs.profile }}
      groups: ${{ steps.plan.outputs.groups || steps.legacy_plan.outputs.groups }}
      ports: ${{ steps.ports.outputs.crates || steps.legacy_ports.outputs.crates }}
      shards: ${{ steps.shards.outputs.shards || steps.historical_shards.outputs.shards }}
      # `none` for a dispatched pull request that changes only documentation.
      native: ${{ steps.plan.outputs.native || steps.legacy_plan.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 0
      - if: ${{ hashFiles('.aspect/version.axl') != '' }}
        uses: ./.github/actions/aspect
      - name: Check out Aspect tasks for a historical revision
        if: ${{ hashFiles('.aspect/platform-plan.axl') == '' || hashFiles('.aspect/port-harness-selection.axl') == '' || hashFiles('.aspect/workflow-policy-test.axl') == '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .platform-legacy-tools
          persist-credentials: false
      - if: ${{ hashFiles('.aspect/platform-plan.axl') == '' || hashFiles('.aspect/port-harness-selection.axl') == '' || hashFiles('.aspect/workflow-policy-test.axl') == '' }}
        uses: ./.platform-legacy-tools/.github/actions/aspect
      - name: Verify the dispatched pull request commit
        # The checks report on the commit the run was dispatched on, so it
        # must be the PR head that went green: the checkout is that head or
        # GitHub's test merge of it into main.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_request != '' && hashFiles('.aspect/platform-plan.axl') != '' }}
        env:
          PR_HEAD: ${{ github.sha }}
        run: aspect ci verify-platform-dispatch
      - name: Verify a historical checkout's dispatched commit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_request != '' && hashFiles('.aspect/platform-plan.axl') == '' }}
        working-directory: .platform-legacy-tools
        env:
          PLATFORM_WORKSPACE: ${{ github.workspace }}
          PR_HEAD: ${{ github.sha }}
        run: aspect ci verify-platform-dispatch
      - if: ${{ hashFiles('.aspect/fixtures/tool-launcher.rs') != '' || hashFiles('.aspect/workflow-policy-test.axl') == '' }}
        uses: dtolnay/rust-toolchain@stable
      # The GPT-2 reference fixtures (.aspect/lib/gpt2-reference.axl)
      # pretokenize with ripgrep's PCRE2 engine; the runner image has no rg.
      - name: Refresh the package index for ripgrep
        if: ${{ hashFiles('.aspect/lib/gpt2-reference.axl') != '' }}
        run: sudo apt-get update --quiet
      - name: Install ripgrep for the GPT-2 reference fixtures
        if: ${{ hashFiles('.aspect/lib/gpt2-reference.axl') != '' }}
        run: sudo apt-get install --yes --quiet --no-install-recommends ripgrep
      - name: Check CI policy and workflow regressions
        if: ${{ hashFiles('.aspect/workflow-policy-test.axl') != '' }}
        run: aspect ci platform-tests
      - name: Check CI policy and workflow regressions for a historical checkout
        if: ${{ hashFiles('.aspect/workflow-policy-test.axl') == '' }}
        working-directory: .platform-legacy-tools
        run: aspect ci platform-tests
      - id: plan
        if: ${{ hashFiles('.aspect/platform-plan.axl') != '' }}
        env:
          REQUESTED_PROFILE: ${{ inputs.profile || (github.event_name == 'schedule' && 'full') || 'pr' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: aspect ci plan-platform-workflow
      - id: legacy_plan
        if: ${{ hashFiles('.aspect/platform-plan.axl') == '' }}
        working-directory: .platform-legacy-tools
        env:
          PLATFORM_WORKSPACE: ${{ github.workspace }}
          REQUESTED_PROFILE: ${{ inputs.profile || (github.event_name == 'schedule' && 'full') || 'pr' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: aspect ci plan-platform-workflow
      - id: ports
        name: Choose the ports to test
        if: ${{ hashFiles('.aspect/port-harness-selection.axl') != '' }}
        env:
          REQUESTED_PROFILE: ${{ inputs.profile || (github.event_name == 'schedule' && 'full') || 'pr' }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: aspect ci choose-platform-ports
      - id: legacy_ports
        name: Choose the ports for a historical checkout
        if: ${{ hashFiles('.aspect/port-harness-selection.axl') == '' }}
        working-directory: .platform-legacy-tools
        env:
          PLATFORM_WORKSPACE: ${{ github.workspace }}
          REQUESTED_PROFILE: ${{ inputs.profile || (github.event_name == 'schedule' && 'full') || 'pr' }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: aspect ci choose-platform-ports
      - id: shards
        if: ${{ (steps.ports.outputs.crates || steps.legacy_ports.outputs.crates) != 'none' && hashFiles('.aspect/port-shards.axl') != '' }}
        run: aspect ci port-shard-matrix
      - name: Check out shard planning tools for a historical revision
        if: ${{ (steps.ports.outputs.crates || steps.legacy_ports.outputs.crates) != 'none' && hashFiles('.aspect/port-shards.axl') == '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .platform-shard-tools
          persist-credentials: false
          sparse-checkout: |
            .aspect
            .github/actions/aspect
            scripts/port-harness-plan.json
      - if: ${{ (steps.ports.outputs.crates || steps.legacy_ports.outputs.crates) != 'none' && hashFiles('.aspect/port-shards.axl') == '' }}
        uses: ./.platform-shard-tools/.github/actions/aspect
      - id: historical_shards
        if: ${{ (steps.ports.outputs.crates || steps.legacy_ports.outputs.crates) != 'none' && hashFiles('.aspect/port-shards.axl') == '' }}
        working-directory: .platform-shard-tools
        env:
          PORT_HARNESS_ROOT: ${{ github.workspace }}
        run: aspect ci port-shard-matrix
      - name: Preserve platform plan
        uses: actions/upload-artifact@v4
        with:
          name: platform-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/platform-plan.json
  # Linux owns the workspace, proof, lint and general acceptance suites.
  # These lanes exercise only host-specific implementations and native ABI.
  # A documentation-only pull request skips them (plan output `native`).
  # This job has no matrix: a skipped matrix job reports under its unexpanded
  # name, so the required `macOS (AArch64)` check would never arrive.
  platform:
    needs: plan
    if: ${{ always() && !cancelled() && needs.plan.outputs.native != 'none' }}
    name: macOS (AArch64)${{ needs.plan.outputs.profile == 'full' && ' (full)' || '' }}
    runs-on: macos-latest
    # Passing runs took 30-55 min with a debug "Test the codegen swap point",
    # so 60 timed out on many PRs on 2026-11-25. Windows has 120 (#1537).
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Fail when profile planning failed
        if: needs.plan.result != 'success'
        run: exit 1
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - if: ${{ hashFiles('.aspect/version.axl') != '' }}
        uses: ./.github/actions/aspect
      - name: Verify exact checkout
        if: ${{ hashFiles('.aspect/platform-plan.axl') != '' }}
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.sha }}
        run: aspect ci verify-platform-checkout
      - if: ${{ hashFiles('.aspect/platform-plan.axl') == '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .platform-verify-tools
          persist-credentials: false
          sparse-checkout: |
            .aspect
            .github/actions/aspect
            scripts/native-example-cases.txt
            scripts/port-abi-plan.json
      - if: ${{ hashFiles('.aspect/platform-plan.axl') == '' }}
        uses: ./.platform-verify-tools/.github/actions/aspect
      - name: Verify exact historical checkout
        if: ${{ hashFiles('.aspect/platform-plan.axl') == '' }}
        working-directory: .platform-verify-tools
        env:
          PLATFORM_WORKSPACE: ${{ github.workspace }}
          EXPECTED_SHA: ${{ needs.plan.outputs.sha }}
        run: aspect ci verify-platform-checkout
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test macOS fiber and kqueue implementations
        run: cargo test --locked -p vesper-fiber-abi --test platform
      - run: cargo test --locked -p vesper-pulse --test drivers
      - run: cargo test --locked -p vesper-pulse --test pool
      - run: cargo test --locked -p vesper-loom-tuf --test offline system_symlink_ancestor_is_accepted -- --exact
      - name: Build the compiler (port-compiler profile)
        # Optimized like the port shards' compiler, with debug assertions
        # and overflow checks on. The tests below build with the same
        # profile, so they reuse its dependencies: a separate debug build
        # took 9 minutes of this job.
        run: cargo build --locked --profile port-compiler --bin vesper
      - name: Validate native Mach-O executables
        if: ${{ hashFiles('.aspect/version.axl') != '' }}
        env:
          VESPER_NATIVE_BINARY: target/port-compiler/vesper
        run: aspect ci test-native-executables
      - name: Validate native Mach-O executables in a historical checkout
        if: ${{ hashFiles('.aspect/version.axl') == '' }}
        working-directory: .platform-verify-tools
        env:
          PLATFORM_WORKSPACE: ${{ github.workspace }}
          VESPER_NATIVE_BINARY: target/port-compiler/vesper
        run: aspect ci test-native-executables
      - name: Test the Vesper Pulse port on kqueue
        # The kqueue poller and completion driver in @vesper/pulse's macOS
        # copy against vesper_pulse (Linux runs the epoll copy).
        run: aspect ci test-pulse-port
      - name: Test the Cranelift C-ABI shim
        # Self-hosting SH0 lane 4 (#1126): Vesper drives Cranelift through
        # crates/vesper-cranelift-sys, links the object it builds and runs it.
        run: cargo test --locked --profile port-compiler -p vesper-cranelift-sys
      - name: Test the codegen swap point
        # Self-hosting SH4 lane 1 (#1275): lent handles and the pilot swap,
        # only the part that needs this machine: the Vesper hooks called
        # here and the JIT runs, over every fourth corpus file
        # (CHECK_HARNESS_STRIDE). The Mach-O objects of the whole sweep are
        # compared on Linux in `Codegen swap point (Linux for macOS)`
        # (docs/ci-platforms.md). Checking the corpus is most of each test
        # binary's time, so a quarter of it took a third of the time. The
        # two skipped tests need corpus worlds a quarter may lack, and
        # check nothing host-specific; the Linux job runs them.
        env:
          CHECK_HARNESS_STRIDE: "4"
        run: cargo test --locked --profile port-compiler -p vesper-codegen-swap-test -- --skip a_divergent_hook_is_caught --skip box_drops_match_the_rust_emitter
      - name: Test the Vesper port export ABI
        # Only the host-sensitive tier of the port harness: the pilot's export
        # ABI v2/v3 libraries and divergence checks, package linking and the
        # closure guard. The ported crates run once, in the Linux job below.
        if: ${{ hashFiles('.aspect/version.axl') != '' }}
        env:
          VESPER_PORT_COMPILER: ${{ github.workspace }}/target/port-compiler/vesper
          VESPER_PORT_HARNESS_SCOPE: abi
        run: aspect ci test-port-abi
      - name: Test the Vesper port export ABI in a historical checkout
        if: ${{ hashFiles('.aspect/version.axl') == '' }}
        working-directory: .platform-verify-tools
        env:
          PLATFORM_WORKSPACE: ${{ github.workspace }}
          VESPER_PORT_COMPILER: ${{ github.workspace }}/target/port-compiler/vesper
          VESPER_PORT_HARNESS_SCOPE: abi
        run: aspect ci test-port-abi

  windows:
    needs: plan
    if: ${{ always() && !cancelled() && needs.plan.outputs.native != 'none' }}
    name: Windows (x86_64 MSVC)${{ needs.plan.outputs.profile == 'full' && ' (full)' || '' }}
    runs-on: windows-latest
    # The debug codegen swap tests took 35-61 minutes on windows-latest,
    # which pushed the job past 60 (#1519); they now build optimized.
    # GitHub-hosted jobs allow up to 6 hours.
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Fail when profile planning failed
        if: needs.plan.result != 'success'
        run: exit 1
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Verify exact checkout
        if: ${{ hashFiles('scripts/windows/verify-platform-checkout.ps1') != '' }}
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.sha }}
        run: ./scripts/windows/verify-platform-checkout.ps1
      - if: ${{ hashFiles('scripts/windows/verify-platform-checkout.ps1') == '' || hashFiles('scripts/windows/test-native-executables.ps1') == '' || hashFiles('scripts/windows/test-port-abi.ps1') == '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .platform-verify-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/windows/
            /scripts/native-example-cases.txt
            /scripts/port-abi-plan.json
      - name: Verify exact historical checkout
        if: ${{ hashFiles('scripts/windows/verify-platform-checkout.ps1') == '' }}
        shell: pwsh
        env:
          PLATFORM_WORKSPACE: ${{ github.workspace }}
          EXPECTED_SHA: ${{ needs.plan.outputs.sha }}
        run: ./.platform-verify-tools/scripts/windows/verify-platform-checkout.ps1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test Windows fiber and IOCP implementations
        run: cargo test --locked -p vesper-fiber-abi --test windows_platform
      - run: cargo test --locked -p vesper-pulse --test windows
      - run: cargo test --locked -p vesper-pulse --test drivers
      - run: cargo test --locked -p vesper-pulse --test pool
      - name: Build the compiler (port-compiler profile)
        # Optimized like the port shards' compiler, with debug assertions
        # and overflow checks on. The tests below build with the same
        # profile, so they reuse its dependencies: a separate debug build
        # took 9 minutes of this job.
        run: cargo build --locked --profile port-compiler --bin vesper
      - name: Validate native COFF executables
        if: ${{ hashFiles('scripts/windows/test-native-executables.ps1') != '' }}
        shell: pwsh
        env:
          VESPER_NATIVE_BINARY: target/port-compiler/vesper.exe
          VESPER_NATIVE_SUFFIX: .exe
        run: ./scripts/windows/test-native-executables.ps1
      - name: Validate native COFF executables in a historical checkout
        if: ${{ hashFiles('scripts/windows/test-native-executables.ps1') == '' }}
        shell: pwsh
        env:
          PLATFORM_WORKSPACE: ${{ github.workspace }}
          VESPER_NATIVE_BINARY: target/port-compiler/vesper.exe
          VESPER_NATIVE_SUFFIX: .exe
        run: ./.platform-verify-tools/scripts/windows/test-native-executables.ps1
      - name: Test the Cranelift C-ABI shim
        # Self-hosting SH0 lane 4 (#1126): Vesper drives Cranelift through
        # crates/vesper-cranelift-sys, links the object it builds and runs it.
        run: cargo test --locked --profile port-compiler -p vesper-cranelift-sys
      - name: Test the codegen swap point
        # Self-hosting SH4 lane 1 (#1275): lent handles and the pilot swap,
        # only the part that needs this machine: the Vesper hooks called
        # here and the JIT runs, over every fourth corpus file
        # (CHECK_HARNESS_STRIDE). The COFF objects of the whole sweep are
        # compared on Linux in `Codegen swap point (Linux for Windows)`
        # (docs/ci-platforms.md). Checking the corpus is most of each test
        # binary's time, so a quarter of it took a third of the time. The
        # two skipped tests need corpus worlds a quarter may lack, and
        # check nothing host-specific; the Linux job runs them.
        env:
          CHECK_HARNESS_STRIDE: "4"
        run: cargo test --locked --profile port-compiler -p vesper-codegen-swap-test -- --skip a_divergent_hook_is_caught --skip box_drops_match_the_rust_emitter
      - name: Test the Vesper port export ABI
        # Only the host-sensitive tier of the port harness: the pilot's export
        # ABI v2/v3 libraries and divergence checks, package linking and the
        # closure guard. The ported crates run once, in the Linux job below.
        if: ${{ hashFiles('scripts/windows/test-port-abi.ps1') != '' }}
        env:
          VESPER_PORT_COMPILER: ${{ github.workspace }}/target/port-compiler/vesper.exe
          VESPER_PORT_HARNESS_SCOPE: abi
        shell: pwsh
        run: ./scripts/windows/test-port-abi.ps1
      - name: Test the Vesper port export ABI in a historical checkout
        if: ${{ hashFiles('scripts/windows/test-port-abi.ps1') == '' }}
        shell: pwsh
        env:
          PLATFORM_WORKSPACE: ${{ github.workspace }}
          VESPER_PORT_COMPILER: ${{ github.workspace }}/target/port-compiler/vesper.exe
          VESPER_PORT_HARNESS_SCOPE: abi
        run: ./.platform-verify-tools/scripts/windows/test-port-abi.ps1

  # The codegen swap point's macOS and Windows objects (#1275), compared
  # on Linux: an object for another target needs no machine of that kind,
  # so only the hooks' calls and the JIT runs stay on macOS and Windows.
  # Same sweep as those jobs ran before: every fourth corpus world for the
  # pilot, control and walk-state swaps, every world for the others.
  codegen-swap:
    needs: plan
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.native != 'none' }}
    name: Codegen swap point (Linux for ${{ matrix.name }})${{ needs.plan.outputs.profile == 'full' && ' (full)' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            target: aarch64-apple-darwin
          - name: Windows
            target: x86_64-pc-windows-msvc
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: ./.github/actions/aspect
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.sha }}
        run: aspect ci verify-platform-checkout
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: codegen-swap
      - name: Compare the codegen swap point's objects
        env:
          CODEGEN_SWAP_TARGET: ${{ matrix.target }}
          CODEGEN_SWAP_STEP: "4"
        run: cargo test --locked --profile port-compiler -p vesper-codegen-swap-test

  # The ported crates' tests and divergence checks are platform-neutral, so
  # they run once, here (#1010). Bazel on BuildBuddy builds the same ports.
  # One optimized compiler build is shared by every shard (#1103): nearly all
  # of the harness's time is the compiler compiling Vesper sources, which a
  # debug build of it did several times slower.
  ports-compiler:
    needs: plan
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.ports != 'none' }}
    name: Vesper ports compiler
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - if: ${{ hashFiles('.aspect/platform-plan.axl') != '' }}
        uses: ./.github/actions/aspect
      - name: Verify exact checkout
        if: ${{ hashFiles('.aspect/platform-plan.axl') != '' }}
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.sha }}
        run: aspect ci verify-platform-checkout
      - if: ${{ hashFiles('.aspect/platform-plan.axl') == '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .platform-verify-tools
          persist-credentials: false
          sparse-checkout: |
            .aspect
            .github/actions/aspect
      - if: ${{ hashFiles('.aspect/platform-plan.axl') == '' }}
        uses: ./.platform-verify-tools/.github/actions/aspect
      - name: Verify exact historical checkout
        if: ${{ hashFiles('.aspect/platform-plan.axl') == '' }}
        working-directory: .platform-verify-tools
        env:
          PLATFORM_WORKSPACE: ${{ github.workspace }}
          EXPECTED_SHA: ${{ needs.plan.outputs.sha }}
        run: aspect ci verify-platform-checkout
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ports-compiler
      - name: Build the compiler (port-compiler profile)
        run: cargo build --locked --profile port-compiler --bin vesper
      - uses: actions/upload-artifact@v4
        with:
          name: vesper-port-compiler
          path: target/port-compiler/vesper
          retention-days: 1
          overwrite: true

  # Nine parallel shards of the harness (#1019, #1100, #1924) keep each near 30
  # min; with three, the last one ran past 90 min. On pull requests the plan
  # names the affected ports (aspect ci port-harness-selection): a change
  # inside some ports' crates tests only those ports and their dependents;
  # anything else, and every push to main and nightly, tests them all.
  # When the plan names no affected port, the shards are skipped as jobs, so
  # they take no runners (#1321); `complete` accepts that skip.
  ports:
    needs: [plan, ports-compiler]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.ports != 'none' }}
    name: Vesper ports (Linux ${{ matrix.shard }}/${{ strategy.job-total }})${{ needs.plan.outputs.profile == 'full' && ' (full)' || '' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards || '[1]') }}
    runs-on: ubuntu-latest
    # A backstop: each shard's tests and divergent builds take about
    # 10-30 minutes (scripts/port-harness-plan.json).
    timeout-minutes: 60
    steps:
      - name: Fail when profile planning failed
        if: needs.plan.result != 'success'
        run: exit 1
      - name: Fail when the shared compiler build failed
        if: needs.ports-compiler.result != 'success'
        run: exit 1
      - if: ${{ needs.plan.outputs.ports != 'none' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - if: ${{ needs.plan.outputs.ports != 'none' && hashFiles('.aspect/version.axl') != '' }}
        uses: ./.github/actions/aspect
      - name: Verify exact checkout
        if: ${{ needs.plan.outputs.ports != 'none' && hashFiles('.aspect/platform-plan.axl') != '' }}
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.sha }}
        run: aspect ci verify-platform-checkout
      - if: ${{ needs.plan.outputs.ports != 'none' && hashFiles('.aspect/platform-plan.axl') == '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .platform-verify-tools
          persist-credentials: false
          sparse-checkout: |
            .aspect
            .github/actions/aspect
            scripts/port-abi-plan.json
            scripts/port-harness-plan.json
      - if: ${{ needs.plan.outputs.ports != 'none' && hashFiles('.aspect/platform-plan.axl') == '' }}
        uses: ./.platform-verify-tools/.github/actions/aspect
      - name: Verify exact historical checkout
        if: ${{ needs.plan.outputs.ports != 'none' && hashFiles('.aspect/platform-plan.axl') == '' }}
        working-directory: .platform-verify-tools
        env:
          PLATFORM_WORKSPACE: ${{ github.workspace }}
          EXPECTED_SHA: ${{ needs.plan.outputs.sha }}
        run: aspect ci verify-platform-checkout
      - if: ${{ needs.plan.outputs.ports != 'none' }}
        uses: dtolnay/rust-toolchain@stable
      - if: ${{ needs.plan.outputs.ports != 'none' }}
        uses: Swatinem/rust-cache@v2
        with:
          key: ports-${{ matrix.shard }}
      - if: ${{ needs.plan.outputs.ports != 'none' }}
        uses: actions/download-artifact@v4
        with:
          name: vesper-port-compiler
          path: ${{ runner.temp }}/port-compiler
      - name: Make the shared compiler executable
        if: ${{ needs.plan.outputs.ports != 'none' }}
        env:
          VESPER_PORT_COMPILER: ${{ runner.temp }}/port-compiler/vesper
        run: chmod +x "$VESPER_PORT_COMPILER"
      - name: Test the Vesper port harness
        if: ${{ needs.plan.outputs.ports != 'none' && hashFiles('.aspect/version.axl') != '' }}
        # Every port compiles with the shared compiler downloaded above.
        env:
          VESPER_PORT_COMPILER: ${{ runner.temp }}/port-compiler/vesper
          VESPER_PORT_HARNESS_SHARD: ${{ matrix.shard }}
          VESPER_PORT_HARNESS_CRATES: ${{ needs.plan.outputs.ports }}
        run: aspect acceptance test-port-harness
      - name: Test the Vesper port harness in a historical checkout
        if: ${{ needs.plan.outputs.ports != 'none' && hashFiles('.aspect/version.axl') == '' }}
        working-directory: .platform-verify-tools
        env:
          PLATFORM_WORKSPACE: ${{ github.workspace }}
          VESPER_PORT_COMPILER: ${{ runner.temp }}/port-compiler/vesper
          VESPER_PORT_HARNESS_SHARD: ${{ matrix.shard }}
          VESPER_PORT_HARNESS_CRATES: ${{ needs.plan.outputs.ports }}
        run: aspect acceptance test-port-harness

  complete:
    name: Platform validation complete
    needs: [plan, platform, windows, codegen-swap, ports]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      checked_sha: ${{ steps.ready.outputs.checked_sha }}
      validation_profile: ${{ steps.ready.outputs.validation_profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            .aspect
            .github/actions/aspect
      - uses: ./.github/actions/aspect
      - id: ready
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          MAC_RESULT: ${{ needs.platform.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          SWAP_RESULT: ${{ needs.codegen-swap.result }}
          PORTS_RESULT: ${{ needs.ports.result }}
          PORTS: ${{ needs.plan.outputs.ports }}
          NATIVE: ${{ needs.plan.outputs.native }}
          CHECKED_SHA: ${{ needs.plan.outputs.sha }}
          PROFILE: ${{ needs.plan.outputs.profile }}
        run: aspect ci complete-platform-validation
