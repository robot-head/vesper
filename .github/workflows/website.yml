name: Website

on:
  push:
    branches: [main]
    paths: ['website/**', 'crates/vesper-highlight/**', 'src/highlight_commands.rs', 'docs/manuscript/**', '.github/workflows/website.yml', 'examples/transaction.ves', 'examples/projections.ves', 'examples/checked_math.ves']
  pull_request:
    paths: ['website/**', 'crates/vesper-highlight/**', 'src/highlight_commands.rs', 'docs/manuscript/**', '.github/workflows/website.yml', 'examples/transaction.ves', 'examples/projections.ves', 'examples/checked_math.ves']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Website checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: website-chroma
      - name: Build Vesper for highlighting and diagnostics
        run: cargo build --locked --bin vesper
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
      - uses: typst-community/setup-typst@00ad6338f0b34724ea002136bfb701a6c18585b0 # v5.3.2
        with:
          typst-version: '0.15.1'
      - name: Typeset the language manuscript
        run: typst compile --ignore-system-fonts --root .. ../docs/manuscript/main.typ vesper-specification.pdf
      - name: Install manuscript verification dependency
        run: python -m pip install PyMuPDF==1.26.6
      - name: Verify manuscript and checker
        run: |
          python -m unittest discover -s ../docs/manuscript -p 'test_*.py'
          python ../docs/manuscript/verify.py --pdf vesper-specification.pdf
      - run: npm run build:wasm
      - run: npm run build
      - run: npm run check
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
