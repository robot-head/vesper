name: Merge gate
# Project rule (#1321): no CI for pull requests that cannot merge yet. On each
# push this checks whether the pull request is based on main, carries no
# other open pull request's commits (an unmerged parent merged in) and merges
# into main without conflicts (scripts/ci/merge_gate.py). If it cannot merge
# yet, it cancels every other GitHub Actions run for the pushed commit and
# fails with the reason. Push again (for example, merge main) once the parent
# has landed or the conflict is fixed, and CI runs as usual. BuildBuddy
# checks are not GitHub Actions runs and are not cancelled here.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Can merge yet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The default merge ref does not exist for a conflicting PR.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Fetch main and the open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
          gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
            --jq '.[] | {number, base: .base.ref, ref: "refs/gate/pr/\(.number)"}' \
            | jq -s . > "$RUNNER_TEMP/open-prs.json"
          refspecs=$(jq -r '.[] | "+refs/pull/\(.number)/head:refs/gate/pr/\(.number)"' "$RUNNER_TEMP/open-prs.json")
          # shellcheck disable=SC2086
          git fetch --quiet origin $refspecs
      - name: Check whether this pull request can merge yet
        id: gate
        env:
          NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git config user.name merge-gate
          git config user.email merge-gate@users.noreply.github.com
          if python3 scripts/ci/merge_gate.py --number "$NUMBER" --base-ref "$BASE_REF" \
              --head "$HEAD_SHA" --main origin/main --open-prs "$RUNNER_TEMP/open-prs.json" \
              | tee "$RUNNER_TEMP/gate.txt"; then
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          else
            echo "blocked=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Cancel this commit's other runs
        if: steps.gate.outputs.blocked == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Runs for the same push can appear a few seconds after this one.
          for pass in 1 2 3; do
            gh api --paginate "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&per_page=100" \
              --jq ".workflow_runs[] | select(.id != $RUN_ID and .status != \"completed\") | .id" |
            while read -r id; do
              echo "cancelling run $id"
              gh api -X POST "repos/$REPO/actions/runs/$id/cancel" >/dev/null || true
            done
            [ "$pass" = 3 ] || sleep 20
          done
          {
            echo "### CI skipped: this pull request cannot merge yet"
            cat "$RUNNER_TEMP/gate.txt"
            echo
            echo "Push again once the parent has merged or the conflict is fixed."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
