name: Checked source tooling

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/vesper-grammar/**'
      - 'crates/vesper-fmt/**'
      - 'crates/vesper-lint/**'
      - 'crates/vesper-doc/**'
      - 'crates/vesper-bench/**'
      - 'crates/vesper-core/**'
      - 'crates/vesper-syntax/**'
      - 'src/**'
      - 'tests/bench_cli.rs'
      - 'tests/doc_cli.rs'
      - 'tests/doctest_cli.rs'
      - 'tests/fmt_cli.rs'
      - 'tests/lint_cli.rs'
      - 'tests/native_batch.rs'
      - 'lean/MetronomeArithmetic.lean'
      - 'lean-toolchain'
      - 'scripts/test-source-tooling.sh'
      - 'scripts/check-source-tooling.py'
      - '.github/workflows/source-tooling.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'crates/vesper-grammar/**'
      - 'crates/vesper-fmt/**'
      - 'crates/vesper-lint/**'
      - 'crates/vesper-doc/**'
      - 'crates/vesper-bench/**'
      - 'crates/vesper-core/**'
      - 'crates/vesper-syntax/**'
      - 'src/**'
      - 'tests/bench_cli.rs'
      - 'tests/doc_cli.rs'
      - 'tests/doctest_cli.rs'
      - 'tests/fmt_cli.rs'
      - 'tests/lint_cli.rs'
      - 'tests/native_batch.rs'
      - 'lean/MetronomeArithmetic.lean'
      - 'lean-toolchain'
      - 'scripts/test-source-tooling.sh'
      - 'scripts/check-source-tooling.py'
      - '.github/workflows/source-tooling.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

concurrency:
  group: source-tooling-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
  CARGO_TARGET_DIR: target/source-tooling

jobs:
  host-tooling:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test five source tooling libraries
        run: >-
          cargo test --locked
          -p vesper-grammar -p vesper-fmt -p vesper-lint -p vesper-doc -p vesper-bench
      - name: Execute actual root CLI and owned JIT batch tests
        run: >-
          cargo test --locked -p vesper
          --test bench_cli --test doc_cli --test doctest_cli
          --test fmt_cli --test lint_cli --test native_batch
      - name: Check strict source tooling and root Clippy
        run: >-
          cargo clippy --locked --all-targets -p vesper
          -p vesper-grammar -p vesper-fmt -p vesper-lint -p vesper-doc -p vesper-bench
          -- -D warnings
      - name: Execute disposable source acceptance and three leaf examples
        run: scripts/test-source-tooling.sh

  metronome-kernel-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain manager
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check actual pinned Lean version
        run: lean --version | grep -F 'version 4.24.0'
      - name: Kernel-check scoped Metronome arithmetic and axiom reports
        run: lean lean/MetronomeArithmetic.lean
