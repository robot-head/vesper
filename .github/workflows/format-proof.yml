name: Formatter document model kernel proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/vesper-fmt/**'
      - 'crates/vesper-doc/**'
      - 'crates/vesper-syntax/**'
      - 'crates/vesper-core/**'
      - 'crates/vesper-span/**'
      - 'crates/vesper-forge/**'
      - 'crates/vesper-lean-syntax/**'
      - 'src/**'
      - 'lean/**'
      - 'lean-toolchain'
      - 'tests/format_proof_cli.rs'
      - 'tests/proof_audit_cli.rs'
      - 'tests/fmt_cli.rs'
      - 'tests/fixtures/format_proof/**'
      - 'scripts/check-format-proof.py'
      - 'scripts/test-format-proof.sh'
      - '.github/workflows/format-proof.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'crates/vesper-fmt/**'
      - 'crates/vesper-doc/**'
      - 'crates/vesper-syntax/**'
      - 'crates/vesper-core/**'
      - 'crates/vesper-span/**'
      - 'crates/vesper-forge/**'
      - 'crates/vesper-lean-syntax/**'
      - 'src/**'
      - 'lean/**'
      - 'lean-toolchain'
      - 'tests/format_proof_cli.rs'
      - 'tests/proof_audit_cli.rs'
      - 'tests/fmt_cli.rs'
      - 'tests/fixtures/format_proof/**'
      - 'scripts/check-format-proof.py'
      - 'scripts/test-format-proof.sh'
      - '.github/workflows/format-proof.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

concurrency:
  group: format-proof-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  native-format-proof:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Assert default CLI does not require the Wasmtime engine
        run: >-
          cargo tree --locked -p vesper --edges normal --prefix none |
          python -c 'import sys; names={line.split()[0] for line in sys.stdin if line.strip()}; assert not names.intersection({"wasmtime", "wasmtime-wasi", "vesper-loom-sandbox"})'
      - name: Install Lean toolchain manager (Unix)
        if: runner.os != 'Windows'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install Lean toolchain manager (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe -O --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.ps1
          ./elan-init.ps1 -NoPrompt $true -DefaultToolchain none
          Remove-Item elan-init.ps1
          "$env:USERPROFILE\.elan\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check actual pinned Lean version
        run: lean --version
      - name: Elaborate bundled model with actual kernel
        run: lean --trust=0 lean/StylusAndLintSafety.lean
      - name: Test actual formatter projection and AST emission
        run: cargo test --locked -p vesper-fmt -p vesper-lean-syntax --all-targets
        env:
          VESPER_LEAN: lean
      - name: Test explicit formatter proof CLI and existing artifact kernel guards
        run: cargo test --locked -p vesper --lib --test format_proof_cli --test proof_audit_cli --test fmt_cli
        env:
          VESPER_LEAN: lean
      - name: Check strict formatter and source proof integration Clippy
        run: cargo clippy --locked -p vesper -p vesper-fmt -p vesper-lean-syntax --all-targets -- -D warnings
      - name: Execute actual proof acceptance and independent witness replay
        run: scripts/test-format-proof.sh
        env:
          VESPER_LEAN: lean
