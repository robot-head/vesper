name: Rust census

# Regenerates docs/maintenance/rust-census.md on main and keeps one pull
# request, "Refresh the Rust census", open with the result. Lane pull requests
# edit only the STATUS tables in scripts/rust-census.py: the generated file
# was the most common merge conflict between them. The merge gate
# (scripts/ci/merge_gate.py) stops CI for any other pull request that changes
# it. The output names no commit, so merging the refresh changes nothing the
# next run would regenerate.

on:
  push:
    branches: [main]
    paths: ['src/**', 'crates/**', 'tests/**', 'scripts/rust-census.py', '.github/workflows/rust-census.yml']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rust-census
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh the Rust census
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: census-refresh
      FILE: docs/maintenance/rust-census.md
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Regenerate the census
        run: python3 scripts/rust-census.py > "$FILE"
      - name: Open or update the refresh pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- "$FILE"; then
            # A refresh made obsolete by a later change (a revert, say) must
            # not stay open to replace the current census.
            for number in $(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number'); do
              gh pr close "$number" --delete-branch --comment "The census on main is current; this refresh is obsolete."
            done
            echo "the census on main is current"
            exit 0
          fi
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B "$BRANCH"
          git commit -q -m "Refresh the Rust census" -- "$FILE"
          git push --force origin "$BRANCH"
          open=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$open" = 0 ]; then
            gh pr create --base main --head "$BRANCH" --title "Refresh the Rust census" \
              --body "Regenerated by .github/workflows/rust-census.yml from main at $(git rev-parse --short origin/main). It changes only $FILE; merge it like any green PR."
          fi
