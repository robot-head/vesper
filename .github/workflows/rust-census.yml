name: Rust census

# Regenerates docs/maintenance/rust-census.md on main and keeps one pull
# request, "Refresh the Rust census", open with the result. Lane pull requests
# edit only the STATUS tables in .aspect/rust-census.axl: the generated file
# was the most common merge conflict between them. The merge gate
# (aspect ci merge-gate) stops CI for any other pull request that changes
# it. The output names no commit, so merging the refresh changes nothing the
# next run would regenerate.

on:
  push:
    branches: [main]
    paths: ['src/**', 'crates/**', 'tests/**', '.aspect/rust-census.axl', '.aspect/census-refresh.axl', '.github/workflows/rust-census.yml']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rust-census
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh the Rust census
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: census-refresh
      FILE: docs/maintenance/rust-census.md
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: ./.github/actions/aspect
      - name: Regenerate the census
        run: aspect ci generate-census
      - name: Open or update the refresh pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: aspect ci refresh-census-pr
