name: Hybrid compiler

# The hybrid Stage 2 compiler (crates/vesper-hybrid, self-hosting SH0 lane 1,
# #1123): the default CLI with compiler modules swapped for Vesper objects.
# On Linux, macOS and Windows this builds the default `vesper` once, builds
# `vesper-hybrid` with it, and runs the crate's tests: the differential
# harness (both compilers over the bootstrap corpus, examples/ and tests/
# must agree on exit status, stdout, stderr and object bytes), the pilot's
# function-by-function check and the manifest guard. Then it rebuilds the
# hybrid with a deliberately wrong pilot module (`--features divergent`),
# which the differential harness must catch. Not a required check; Bazel
# (Test all targets) builds the crate and runs the same tests on Linux.

on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * *'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'crates/vesper-hybrid/**'
      - 'crates/vesper-port-harness/**'
      - 'crates/vesper-port-abi/**'
      - '.github/workflows/hybrid.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'src/**'
      - 'crates/vesper-hybrid/**'
      - 'crates/vesper-port-harness/**'
      - 'crates/vesper-port-abi/**'
      - '.github/workflows/hybrid.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

concurrency:
  group: hybrid-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  hybrid:
    name: Hybrid compiler (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
          - name: macOS AArch64
            os: macos-latest
          - name: Windows x86_64 MSVC
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the default compiler
        run: |
          cargo build --locked --bin vesper
          exe=vesper
          if [ "$RUNNER_OS" = Windows ]; then exe=vesper.exe; fi
          echo "VESPER_PORT_COMPILER=$GITHUB_WORKSPACE/target/debug/$exe" >> "$GITHUB_ENV"
          echo "VESPER_DEFAULT_COMPILER=$GITHUB_WORKSPACE/target/debug/$exe" >> "$GITHUB_ENV"
      - name: Build and test the hybrid compiler
        run: cargo test --locked -p vesper-hybrid -- --nocapture
      - name: The differential harness catches a divergent pilot module
        run: cargo test --locked -p vesper-hybrid --features divergent --test differential -- --nocapture
