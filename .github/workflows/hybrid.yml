name: Hybrid compiler

# The hybrid Stage 2 compiler (crates/vesper-hybrid, self-hosting SH0 lane 1,
# #1123): the default CLI with compiler modules swapped for Vesper objects.
# On Linux, macOS and Windows this builds the default `vesper` once, builds
# `vesper-hybrid` with it, and runs the crate's tests: the differential
# harness (both compilers over the bootstrap corpus, examples/ and tests/
# must agree on exit status, stdout, stderr and object bytes), the pilot's
# function-by-function check, the checker swaps' direct checks, the
# stack-bound CLI check and the manifest guard. Then it rebuilds the hybrid
# with a deliberately wrong layout (`--features divergent`), parse, IR check
# and stack bound, which the differential harness must catch, and with wrong
# doc pages, which the doc differential (tests/doc.rs, #1338) must catch.
# Those divergent rebuilds check the harnesses, which are the same code on
# every host, so they run on Linux only: each rebuilds the hybrid, and on
# macOS and Windows the nine of them would hold one of the account's 5 macOS
# runners (and a Windows runner) for most of the job's 75 minutes. It
# runs on pushes to main, nightly and manual dispatch only, not on pull
# requests (#1479): it is not a required check, and Bazel (Test all targets)
# builds the crate and runs the same tests on Linux for every pull request.

on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * *'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'crates/vesper-syntax/**'
      - 'packages/vesper-front/**'
      - 'packages/vesper-ast/**'
      - 'packages/vesper-std/**'
      - 'packages/vesper-check-data/**'
      - 'packages/vesper-check-layout/**'
      - 'packages/vesper-ir-check/**'
      - 'packages/vesper-doc/**'
      - 'crates/vesper-doc/**'
      - 'crates/vesper-serde/vesper/**'
      - 'packages/vesper-driver/**'
      - 'packages/vesper-driver-commands/**'
      - 'packages/vesper-check-loops-atomics/**'
      - 'tests/common/stack_words.rs'
      - 'tests/common/check_words.rs'
      - 'crates/vesper-hybrid/**'
      - 'crates/vesper-port-harness/**'
      - 'crates/vesper-port-abi/**'
      - '.aspect/hybrid.axl'
      - '.aspect/lib/process.axl'
      - 'scripts/windows/test-hybrid-cli.ps1'
      - '.github/workflows/hybrid.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

# Main runs are not cancelled by the next merge (#1479): pull requests do not
# run this workflow, so a main run must finish to catch a regression. GitHub
# keeps only the newest waiting push behind the running one.
concurrency:
  group: hybrid-${{ github.event_name == 'push' && 'main' || github.run_id }}
  cancel-in-progress: false

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  hybrid:
    name: Hybrid compiler (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            compiler: vesper
          - name: macOS AArch64
            os: macos-latest
            compiler: vesper
          - name: Windows x86_64 MSVC
            os: windows-latest
            compiler: vesper.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      VESPER_PORT_COMPILER: ${{ github.workspace }}/target/debug/${{ matrix.compiler }}
      VESPER_DEFAULT_COMPILER: ${{ github.workspace }}/target/debug/${{ matrix.compiler }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - if: runner.os != 'Windows'
        uses: ./.github/actions/aspect
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the default compiler
        run: cargo build --locked --bin vesper
      - name: Build and test the hybrid compiler
        run: cargo test --locked -p vesper-hybrid -- --nocapture
      - name: The CLI suites on the hybrid (its main is the Vesper driver)
        # SH5 lane 12 (#1335): every tests/*cli*.rs suite of the root package
        # with the hybrid binary in place of target/debug/vesper. It builds
        # every CLI suite, so pull requests skip it (#1321).
        if: github.event_name != 'pull_request' && runner.os != 'Windows'
        run: aspect crate hybrid cli-suites
      - name: The CLI suites on the hybrid (Windows)
        if: github.event_name != 'pull_request' && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows/test-hybrid-cli.ps1
      - name: The differential harness catches a divergent layout
        if: runner.os == 'Linux'
        # The pilot's word arithmetic and the whole layout (#1177) are both
        # wrong; a wrong layout cannot compile the pilot test's program, so
        # only the harness runs here.
        run: cargo test --locked -p vesper-hybrid --features divergent --test differential hybrid_matches_the_default_compiler -- --nocapture
      - name: The differential harness catches a divergent IR check
        if: runner.os == 'Linux'
        run: cargo test --locked -p vesper-hybrid --features divergent-ir-check --test differential hybrid_matches_the_default_compiler -- --nocapture
      - name: The differential harness catches a divergent inliner
        if: runner.os == 'Linux'
        run: cargo test --locked -p vesper-hybrid --features divergent-ir-inline --test differential hybrid_matches_the_default_compiler -- --nocapture
      - name: The differential harness catches a divergent AST optimizer
        if: runner.os == 'Linux'
        run: cargo test --locked -p vesper-hybrid --features divergent-optimize --test differential hybrid_matches_the_default_compiler -- --nocapture
      - name: The differential harness catches a divergent IR optimizer
        if: runner.os == 'Linux'
        run: cargo test --locked -p vesper-hybrid --features divergent-ir-opt --test differential hybrid_matches_the_default_compiler -- --nocapture
      - name: The differential harness catches a divergent trait declaration pass
        if: runner.os == 'Linux'
        run: cargo test --locked -p vesper-hybrid --features divergent-pact --test differential hybrid_matches_the_default_compiler -- --nocapture
      - name: The differential harness catches a divergent parse module
        if: runner.os == 'Linux'
        # A wrong parse cannot compile the pilot test's program, so only the
        # harness runs here.
        run: cargo test --locked -p vesper-hybrid --features divergent-parse --test differential hybrid_matches_the_default_compiler -- --nocapture
      - name: The doc differential catches a divergent doc module
        if: runner.os == 'Linux'
        run: cargo test --locked -p vesper-hybrid --features divergent-doc --test doc hybrid_docs_match_the_default_compiler -- --nocapture
      - name: The Lean differential catches a divergent Lean extraction module
        if: runner.os == 'Linux'
        run: cargo test --locked -p vesper-hybrid --features divergent-lean-extract --test lean_extract hybrid_lean_matches_the_default_compiler -- --nocapture
      - name: The verified codegen differential catches a divergent verified code generator
        if: runner.os == 'Linux'
        run: cargo test --locked -p vesper-hybrid --features divergent-verified-codegen --test verified_codegen hybrid_verified_builds_match_rust -- --nocapture
      - name: The stack-bound check catches a divergent stack bound
        if: runner.os == 'Linux'
        run: cargo test --locked -p vesper-hybrid --features divergent-stack-bound --test stack_bound -- --nocapture
