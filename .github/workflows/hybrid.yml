name: Hybrid compiler

# The hybrid Stage 2 compiler (crates/vesper-hybrid, self-hosting SH0 lane 1,
# #1123): the default CLI with compiler modules swapped for Vesper objects.
# On Linux, macOS and Windows this builds the default `vesper` once, builds
# `vesper-hybrid` with it, and runs the crate's tests: the differential
# harness (both compilers over the bootstrap corpus, examples/ and tests/
# must agree on exit status, stdout, stderr and object bytes), the pilot's
# function-by-function check, the checker swaps' direct checks and the
# manifest guard. Then it rebuilds the hybrid with a deliberately wrong
# layout (`--features divergent`), parse and IR check, which the
# differential harness must catch. Pull requests run Linux only; main,
# nightly and manual runs add macOS and Windows. Not a required check; Bazel
# (Test all targets) builds the crate and runs the same tests on Linux.

on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * *'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'crates/vesper-syntax/**'
      - 'packages/vesper-front/**'
      - 'packages/vesper-ast/**'
      - 'packages/vesper-std/**'
      - 'packages/vesper-check-data/**'
      - 'packages/vesper-check-layout/**'
      - 'packages/vesper-ir-check/**'
      - 'packages/vesper-driver/**'
      - 'tests/common/check_words.rs'
      - 'crates/vesper-hybrid/**'
      - 'crates/vesper-port-harness/**'
      - 'crates/vesper-port-abi/**'
      - '.github/workflows/hybrid.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'src/**'
      - 'crates/vesper-syntax/**'
      - 'packages/vesper-front/**'
      - 'packages/vesper-ast/**'
      - 'packages/vesper-std/**'
      - 'packages/vesper-check-data/**'
      - 'packages/vesper-check-layout/**'
      - 'packages/vesper-ir-check/**'
      - 'packages/vesper-driver/**'
      - 'tests/common/check_words.rs'
      - 'crates/vesper-hybrid/**'
      - 'crates/vesper-port-harness/**'
      - 'crates/vesper-port-abi/**'
      - '.github/workflows/hybrid.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

concurrency:
  group: hybrid-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'push' && 'main' || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  hybrid:
    name: Hybrid compiler (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run the Linux leg only (#1321): the macOS and Windows
        # legs took ~30-45 min each and, with 5 macOS jobs per account, kept
        # the required Platforms macOS job queued for hours. main, the
        # nightly schedule and manual runs still cover all three hosts.
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"name":"Linux x86_64","os":"ubuntu-latest"}]' || '[{"name":"Linux x86_64","os":"ubuntu-latest"},{"name":"macOS AArch64","os":"macos-latest"},{"name":"Windows x86_64 MSVC","os":"windows-latest"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the default compiler
        run: |
          cargo build --locked --bin vesper
          exe=vesper
          if [ "$RUNNER_OS" = Windows ]; then exe=vesper.exe; fi
          echo "VESPER_PORT_COMPILER=$GITHUB_WORKSPACE/target/debug/$exe" >> "$GITHUB_ENV"
          echo "VESPER_DEFAULT_COMPILER=$GITHUB_WORKSPACE/target/debug/$exe" >> "$GITHUB_ENV"
      - name: Build and test the hybrid compiler
        run: cargo test --locked -p vesper-hybrid -- --nocapture
      - name: The CLI suites on the hybrid (its main is the Vesper driver)
        # SH5 lane 12 (#1335): every tests/*cli*.rs suite of the root package
        # with the hybrid binary in place of target/debug/vesper. It builds
        # every CLI suite, so pull requests skip it (#1321).
        if: github.event_name != 'pull_request'
        run: crates/vesper-hybrid/cli-suites.sh
      - name: The differential harness catches a divergent layout
        # The pilot's word arithmetic and the whole layout (#1177) are both
        # wrong; a wrong layout cannot compile the pilot test's program, so
        # only the harness runs here.
        run: cargo test --locked -p vesper-hybrid --features divergent --test differential hybrid_matches_the_default_compiler -- --nocapture
      - name: The differential harness catches a divergent IR check
        run: cargo test --locked -p vesper-hybrid --features divergent-ir-check --test differential hybrid_matches_the_default_compiler -- --nocapture
      - name: The differential harness catches a divergent inliner
        run: cargo test --locked -p vesper-hybrid --features divergent-ir-inline --test differential hybrid_matches_the_default_compiler -- --nocapture
      - name: The differential harness catches a divergent parse module
        # A wrong parse cannot compile the pilot test's program, so only the
        # harness runs here.
        run: cargo test --locked -p vesper-hybrid --features divergent-parse --test differential hybrid_matches_the_default_compiler -- --nocapture
