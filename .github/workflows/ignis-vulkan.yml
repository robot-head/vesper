name: Ignis Vulkan (lavapipe)

# Runs the vesper-ignis-vulkan tests on Mesa lavapipe (a CPU Vulkan driver)
# with VK_LAYER_KHRONOS_validation and synchronization validation required.
# Elsewhere (Bazel, macOS, Windows) the device tests report the device as
# unavailable and pass; here VESPER_IGNIS_VULKAN_REQUIRE makes that a failure,
# and any validation error fails the test that caused it. Presentation runs
# against Xvfb (the test starts its own server) and sync fds use lavapipe's
# native SYNC_FD export, which needs /dev/udmabuf; both are required here.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/vesper-ignis/**'
      - 'crates/vesper-ignis-vulkan/**'
      - 'crates/vesper-pulse/**'
      - '.github/workflows/ignis-vulkan.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    # Cargo.toml/Cargo.lock are left out here on purpose (#1321): nearly every
    # PR touches the lock file, and these integration lanes then queued behind
    # the account's job limit. Pushes to main still run on those changes.
    paths:
      - 'crates/vesper-ignis/**'
      - 'crates/vesper-ignis-vulkan/**'
      - 'crates/vesper-pulse/**'
      - '.github/workflows/ignis-vulkan.yml'

permissions:
  contents: read
  # The merge gate reads open pull requests and cancels blocked runs.
  actions: write
  pull-requests: read

concurrency:
  group: ignis-vulkan-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'push' && 'main' || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
  VESPER_IGNIS_VULKAN_REQUIRE: '1'
  VESPER_IGNIS_VULKAN_VALIDATION: required
  VESPER_IGNIS_VULKAN_DEVICE: llvmpipe
  VESPER_IGNIS_VULKAN_PRINT: '1'
  VESPER_IGNIS_VULKAN_REQUIRE_PRESENT: '1'
  VESPER_IGNIS_VULKAN_REQUIRE_SYNC_FD: '1'

jobs:
  lavapipe:
    name: Vulkan on lavapipe with validation layers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Merge gate (#1321, #1479): a pull request that cannot merge yet runs no CI.
      - name: Check out the pull request head for the merge gate
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .gate
          fetch-depth: 0
          sparse-checkout: |
            .github/actions
            scripts/ci
      - name: Merge gate
        if: github.event_name == 'pull_request'
        uses: ./.gate/.github/actions/merge-gate
        with:
          number: ${{ github.event.pull_request.number }}
          base-ref: ${{ github.event.pull_request.base.ref }}
          head-sha: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v4
      - name: Install Mesa lavapipe and the Vulkan validation layers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 vulkan-validationlayers vulkan-tools \
            xvfb libxcb1
      - name: Load udmabuf (lavapipe sync-fd export needs /dev/udmabuf)
        run: |
          # Built into some runner kernels; a module on others. The sync-fd
          # test itself fails (VESPER_IGNIS_VULKAN_REQUIRE_SYNC_FD) if the
          # extension is still missing afterwards.
          if [ ! -e /dev/udmabuf ]; then
            sudo modprobe udmabuf || {
              sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)" &&
                sudo modprobe udmabuf
            } || echo "udmabuf unavailable"
          fi
          if [ -e /dev/udmabuf ]; then sudo chmod a+rw /dev/udmabuf; ls -l /dev/udmabuf; fi
      - name: Report the Vulkan device
        run: |
          vulkaninfo | grep -E "external_(semaphore|fence)_fd|xcb_surface" || echo "no sync-fd or XCB extensions"
          dpkg-query -W mesa-vulkan-drivers vulkan-validationlayers libvulkan1
          vulkaninfo --summary
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test vesper-ignis-vulkan on lavapipe
        run: cargo test --locked -p vesper-ignis-vulkan -- --nocapture
      - name: Test the vesper-ignis planner it depends on
        run: cargo test --locked -p vesper-ignis
