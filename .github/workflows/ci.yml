name: CI
# Run on pushes to main and on pull requests. A push trigger on every branch
# would start a second, duplicate run for each commit pushed to a PR branch.
on:
  push:
    branches: [main]
  pull_request:

# Both compiler and sandbox Cranelift versions are intentional. Keep clean
# hosted-runner builds within their memory/disk budget; assertions stay enabled.
env:
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

# PR runs share one group per PR (refs/pull/N/merge), so a newer push cancels
# the older run. Every other run (pushes to main) gets its own group keyed by
# run id: a shared group would replace a pending run with a newer one, so a
# burst of merges could leave a commit with no CI result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Linux is the reference lane: formatting, Clippy, the full workspace tests,
  # Lean, and AArch64 object validation under QEMU.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Lean toolchain manager
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lean --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo test --workspace --locked
        env:
          VESPER_LEAN: lean
      - run: lean lean/Foundations.lean
      - run: lean lean/RuntimeFrames.lean
      - run: lean lean/SpecificationCounterexample.lean
      - run: lean lean/EffectPlaces.lean
      - name: Validate AArch64 executables
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user binutils-aarch64-linux-gnu
          scripts/test-aarch64.sh
      - name: Validate host native executables
        if: runner.os != 'Windows'
        run: scripts/test-native-host.sh

  # Per-platform lanes build and test every workspace member on the host OS.
  # Platform-specific code is gated with cfg in the crates themselves (for
  # example, Pulse's io_uring driver is Linux-only), so these lanes check that
  # the portable surface really is portable. See docs/ci-platforms.md.
  platform:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (AArch64)
            os: macos-latest
          - name: Windows (x86_64 MSVC)
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Keep sources byte-identical to Linux so snapshot and span tests agree.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Lean toolchain manager (Unix)
        if: runner.os != 'Windows'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install Lean toolchain manager (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe -O --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.ps1
          ./elan-init.ps1 -NoPrompt $true -DefaultToolchain none
          Remove-Item elan-init.ps1
          "$env:USERPROFILE\.elan\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: lean --version
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo test --workspace --locked
        env:
          VESPER_LEAN: lean
      - run: lean lean/Foundations.lean
      - run: lean lean/RuntimeFrames.lean
      - run: lean lean/SpecificationCounterexample.lean
      - run: lean lean/EffectPlaces.lean
      # On Apple silicon the host is real AArch64 hardware, so native code
      # runs here rather than under QEMU. The native executable driver does
      # not yet support linking with MSVC.
      - name: Validate host native executables
        if: runner.os != 'Windows'
        run: scripts/test-native-host.sh
