name: Bootstrap Stage 1

# Stage 1 of the verified bootstrap (manuscript chapter 10, issue #582): the
# Rust seed builds the self-hosted frontend packages/vesper-compiler with both
# Cranelift and the verified backend, runs each build over bootstrap/corpus,
# and requires the CST digests to agree with each other and with the seed's
# own parser.
#
# `stage1` builds the Stage 1 runner twice from clean target directories and
# requires byte-identical locks (seed digest, objects, verified executables),
# then ratchets the fresh measurement against the committed
# bootstrap/stage1.lock: another corpus, or a program that the committed lock
# records as verified-built and that no longer builds, fails. A new verified
# build is reported as an improvement to re-record. Once the committed lock is
# fully cross-backend (strict), the fresh lock must be strict too.
#
# `stage0-two-seed` is the long Stage 0 run (two clean seed builds, Path B via
# Lean's C emitter and gcc) that `cargo test` skips as #[ignore]; it runs on a
# schedule and on demand.
#
# Not a required check. Linux x86-64 only: other hosts record their own seed.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
  push:
    branches: [main]
    paths:
      - 'bootstrap/**'
      - 'crates/vesper-codegen-verified/**'
      - 'packages/vesper-compiler/**'
      - 'src/verified_codegen.rs'
      - 'src/verified_codegen/**'
      - '.github/workflows/bootstrap-stage1.yml'
  pull_request:
    paths:
      - 'bootstrap/**'
      - 'crates/vesper-codegen-verified/**'
      - 'packages/vesper-compiler/**'
      - 'src/verified_codegen.rs'
      - 'src/verified_codegen/**'
      - '.github/workflows/bootstrap-stage1.yml'

permissions:
  contents: read

concurrency:
  group: bootstrap-stage1-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 4
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_TOOLCHAIN: 1.100.0

jobs:
  stage1:
    name: Stage 1 reproducibility and cross-backend ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc -vV
      - name: Two clean builds, then ratchet against the committed lock
        env:
          WORK: ${{ runner.temp }}/stage1
        run: bootstrap/run.sh stage1 --reproduce --outcome
      - name: Strict cross-backend gate
        env:
          WORK: ${{ runner.temp }}/stage1
        run: |
          cargo build --locked -p vesper-codegen-verified --bin vesper-bootstrap
          gate=target/debug/vesper-bootstrap
          if "$gate" check-stage1-lock bootstrap/stage1.lock; then
            echo "committed lock is strict; the fresh lock must be too"
            "$gate" check-stage1-lock "$WORK/stage1.fresh.lock"
          elif "$gate" check-stage1-lock "$WORK/stage1.fresh.lock"; then
            echo "::notice::the fresh Stage 1 lock passes the strict gate; re-record bootstrap/stage1.lock"
          else
            echo "::notice::strict Stage 1 gate not yet satisfiable (verified backend refuses part of the frontend)"
          fi
      - name: Keep the measured locks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-locks-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/stage1/stage1.fresh.lock
            ${{ runner.temp }}/stage1/repro-*/stage1.lock
          if-no-files-found: ignore

  stage0-two-seed:
    name: Stage 0 two-seed build and Path B
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Install Lean
        run: |
          scripts/ci/install-lean.sh
          echo "VESPER_LEAN=$(cat .ci-lean-path)" >> "$GITHUB_ENV"
      - name: Two clean seed builds compile the corpus bit-identically
        run: >-
          cargo test --locked --release -p vesper-codegen-verified --test model --
          --ignored two_seed_builds_compile_the_corpus_bit_identically --nocapture
