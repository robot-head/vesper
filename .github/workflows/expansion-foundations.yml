name: Expanded foundation contracts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/vesper-serde/**'
      - 'crates/vesper-beacon/**'
      - 'crates/vesper-beacon-arrow/**'
      - 'crates/vesper-quarry/**'
      - 'crates/vesper-tensor/**'
      - 'crates/vesper-flux/**'
      - 'crates/vesper-aether/**'
      - 'lean/FluxDbsp.lean'
      - 'lean/AetherMemory.lean'
      - 'lean/MetatheoryAppendix.lean'
      - 'scripts/test-expansion-foundations.sh'
      - 'scripts/check-specification-snapshot.py'
      - 'scripts/tests/test_specification_snapshot.py'
      - 'docs/specification*'
      - '.github/workflows/expansion-foundations.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'crates/vesper-serde/**'
      - 'crates/vesper-beacon/**'
      - 'crates/vesper-beacon-arrow/**'
      - 'crates/vesper-quarry/**'
      - 'crates/vesper-tensor/**'
      - 'crates/vesper-flux/**'
      - 'crates/vesper-aether/**'
      - 'lean/FluxDbsp.lean'
      - 'lean/AetherMemory.lean'
      - 'lean/MetatheoryAppendix.lean'
      - 'scripts/test-expansion-foundations.sh'
      - 'scripts/check-specification-snapshot.py'
      - 'scripts/tests/test_specification_snapshot.py'
      - 'docs/specification*'
      - '.github/workflows/expansion-foundations.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

concurrency:
  group: expansion-foundations-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  host-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check recorded design revision
        run: |
          python scripts/check-specification-snapshot.py
          python -m unittest discover -s scripts/tests -p test_specification_snapshot.py
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check host-library contracts
        run: >-
          cargo test --locked
          -p vesper-serde -p vesper-beacon -p vesper-beacon-arrow -p vesper-quarry
          -p vesper-tensor -p vesper-flux -p vesper-aether
      - name: Check strict host-library Clippy
        run: >-
          cargo clippy --locked --all-targets
          -p vesper-serde -p vesper-beacon -p vesper-beacon-arrow -p vesper-quarry
          -p vesper-tensor -p vesper-flux -p vesper-aether
          -- -D warnings
      - name: Execute host acceptance examples
        run: scripts/test-expansion-foundations.sh

  kernel-models:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain manager
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lean --version
      - name: Check DBSP model and axiom reports
        run: lean lean/FluxDbsp.lean
      - name: Check interval/page model and axiom reports
        run: lean lean/AetherMemory.lean
      - name: Check scoped Appendix A model and axiom reports
        run: lean lean/MetatheoryAppendix.lean
