name: Explicit current-source macro previews

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/vesper-syntax/**'
      - 'crates/vesper-core/**'
      - 'crates/vesper-forge/**'
      - 'crates/vesper-span/**'
      - 'crates/vesper-diagnostics/**'
      - 'crates/vesper-lsp/**'
      - 'src/**'
      - 'tests/database_macro_preview.rs'
      - 'tests/macro_preview.rs'
      - 'tests/macro_preview_cli.rs'
      - 'tests/fixtures/macro_preview/**'
      - 'scripts/check-macro-preview.py'
      - 'scripts/test-macro-preview.sh'
      - '.github/workflows/macro-preview.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'crates/vesper-syntax/**'
      - 'crates/vesper-core/**'
      - 'crates/vesper-forge/**'
      - 'crates/vesper-span/**'
      - 'crates/vesper-diagnostics/**'
      - 'crates/vesper-lsp/**'
      - 'src/**'
      - 'tests/database_macro_preview.rs'
      - 'tests/macro_preview.rs'
      - 'tests/macro_preview_cli.rs'
      - 'tests/fixtures/macro_preview/**'
      - 'scripts/check-macro-preview.py'
      - 'scripts/test-macro-preview.sh'
      - '.github/workflows/macro-preview.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

concurrency:
  group: macro-preview-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  native-macro-preview:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Assert pure preview does not require a Wasmtime engine
        run: >-
          cargo tree --locked -p vesper --edges normal --prefix none |
          python -c 'import sys; names={line.split()[0] for line in sys.stdin if line.strip()}; assert not names.intersection({"wasmtime", "wasmtime-wasi", "vesper-loom-sandbox"})'
      - name: Test actual full-input memoization and bounded associated reports
        run: >-
          cargo test --locked -p vesper --lib --test database_macro_preview
          --test macro_preview --test macro_preview_cli
      - name: Preserve ordinary editor, recovery and compiler authority guards
        run: >-
          cargo test --locked -p vesper --test lsp_cli --test recovery_cli
          --test lsp_navigation --test forge_cli --test forge_authority --test forge_lower
      - name: Check strict current-source preview and pure compiler Clippy
        run: >-
          cargo clippy --locked -p vesper -p vesper-forge -p vesper-syntax
          -p vesper-core -p vesper-lsp --all-targets -- -D warnings
      - name: Exercise actual stdio lifecycle and explicitly run expanded normal artifacts
        run: scripts/test-macro-preview.sh
