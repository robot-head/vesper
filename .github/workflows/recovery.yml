name: Original source recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/vesper-syntax/**'
      - 'crates/vesper-core/**'
      - 'crates/vesper-span/**'
      - 'crates/vesper-diagnostics/**'
      - 'crates/vesper-lsp/**'
      - 'crates/vesper-serde/**'
      - 'crates/vesper-doc/**'
      - 'crates/vesper-lint/**'
      - 'crates/vesper-fmt/**'
      - 'src/**'
      - 'tests/recovery_analysis.rs'
      - 'tests/database_recovery.rs'
      - 'tests/recovery_cli.rs'
      - 'scripts/test-recovery.sh'
      - 'scripts/check-recovery.py'
      - '.github/workflows/recovery.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'crates/vesper-syntax/**'
      - 'crates/vesper-core/**'
      - 'crates/vesper-span/**'
      - 'crates/vesper-diagnostics/**'
      - 'crates/vesper-lsp/**'
      - 'crates/vesper-serde/**'
      - 'crates/vesper-doc/**'
      - 'crates/vesper-lint/**'
      - 'crates/vesper-fmt/**'
      - 'src/**'
      - 'tests/recovery_analysis.rs'
      - 'tests/database_recovery.rs'
      - 'tests/recovery_cli.rs'
      - 'scripts/test-recovery.sh'
      - 'scripts/check-recovery.py'
      - '.github/workflows/recovery.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

concurrency:
  group: recovery-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  native-recovery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test actual syntax recovery, fragments, CST reuse and diagnostic boundary
        run: cargo test --locked -p vesper-syntax -p vesper-core -p vesper-span -p vesper-diagnostics --all-targets
      - name: Test scoped diagnostics, current database snapshots and actual stdio
        run: >-
          cargo test --locked -p vesper --lib --test recovery_analysis
          --test database_recovery --test recovery_cli --test lsp_cli
          --test diagnostics_cli --test database_signatures
      - name: Check strict recovery and compiler Clippy
        run: >-
          cargo clippy --locked --all-targets -p vesper -p vesper-syntax
          -p vesper-core -p vesper-span -p vesper-diagnostics -- -D warnings
      - name: Execute actual disposable recovery acceptance
        run: scripts/test-recovery.sh
