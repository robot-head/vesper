name: GPU compute on lavapipe

# Differential tests of crates/vesper-gpu-compute against the CPU Tensor and
# Kinetic references on Mesa lavapipe (llvmpipe), Vulkan's software
# implementation. Bazel and the other platform jobs build the crate and run
# its naga compile tests, but have no Vulkan device; this job is where the
# device tests actually run (VESPER_GPU_REQUIRE=1 makes a missing device a
# failure instead of a skip). No performance is measured here.
#
# Every test also runs against the Vesper runtime (feature `vesper-port`,
# crates/vesper-gpu-compute/vesper/, SH6 lane 15, #1410), which calls the
# Vulkan loader from Vesper. Its build script compiles the in-tree `vesper`
# compiler first and links the system libvulkan (libvulkan-dev).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/vesper-gpu-compute/**'
      - 'crates/vesper-tensor/**'
      - 'crates/vesper-kinetic/**'
      - 'crates/vesper-alloc/**'
      - '.github/workflows/gpu-compute.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    # Cargo.toml/Cargo.lock are left out here on purpose (#1321): nearly every
    # PR touches the lock file, and these integration lanes then queued behind
    # the account's job limit. Pushes to main still run on those changes.
    paths:
      - 'crates/vesper-gpu-compute/**'
      - 'crates/vesper-tensor/**'
      - 'crates/vesper-kinetic/**'
      - 'crates/vesper-alloc/**'
      - '.github/workflows/gpu-compute.yml'

permissions:
  contents: read
  # The merge gate reads open pull requests and cancels blocked runs.
  actions: write
  pull-requests: read

concurrency:
  group: gpu-compute-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'push' && 'main' || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  lavapipe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VESPER_GPU_REQUIRE: '1'
      VESPER_GPU_DEVICE: llvmpipe
    steps:
      # Merge gate (#1321, #1479): a pull request that cannot merge yet runs no CI.
      - name: Check out the pull request head for the merge gate
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .gate
          fetch-depth: 0
          sparse-checkout: |
            .github/actions
            scripts/ci
      - name: Merge gate
        if: github.event_name == 'pull_request'
        uses: ./.gate/.github/actions/merge-gate
        with:
          number: ${{ github.event.pull_request.number }}
          base-ref: ${{ github.event.pull_request.base.ref }}
          head-sha: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Mesa lavapipe and the Vulkan validation layers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 libvulkan-dev vulkan-tools vulkan-validationlayers
      - name: Show the Vulkan device
        run: |
          dpkg -l mesa-vulkan-drivers libvulkan1 | tail -n 2
          vulkaninfo --summary
      - name: Check formatting
        run: cargo fmt -p vesper-gpu-compute -p vesper-kinetic-gpu -- --check
      - name: Clippy
        run: cargo clippy --locked -p vesper-gpu-compute -p vesper-kinetic-gpu --all-targets -- -D warnings
      - name: Differential tests on lavapipe
        run: cargo test --locked -p vesper-gpu-compute -p vesper-kinetic-gpu -- --nocapture
      - name: Same tests under the Khronos validation layer
        env:
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
        run: |
          set -o pipefail
          cargo test --locked -p vesper-gpu-compute -p vesper-kinetic-gpu -- --nocapture --test-threads=1 2>&1 | tee validation.log
          if grep -q "Validation Error" validation.log; then
            echo "::error::the Vulkan validation layer reported errors"
            exit 1
          fi
      - name: Clippy with the Vesper runtime
        run: cargo clippy --locked -p vesper-gpu-compute --features vesper-port --all-targets -- -D warnings
      - name: Differential tests on lavapipe with the Vesper runtime
        run: cargo test --locked -p vesper-gpu-compute -p vesper-kinetic-gpu --features vesper-gpu-compute/vesper-port -- --nocapture
      - name: The Vesper runtime under the Khronos validation layer
        env:
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
        run: |
          set -o pipefail
          cargo test --locked -p vesper-gpu-compute -p vesper-kinetic-gpu --features vesper-gpu-compute/vesper-port -- --nocapture --test-threads=1 2>&1 | tee validation-vesper.log
          if grep -q "Validation Error" validation-vesper.log; then
            echo "::error::the Vulkan validation layer reported errors"
            exit 1
          fi
