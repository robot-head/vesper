name: Macro and partial-buffer formatting

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/vesper-fmt/**'
      - 'crates/vesper-doc/**'
      - 'crates/vesper-syntax/**'
      - 'crates/vesper-core/**'
      - 'crates/vesper-span/**'
      - 'crates/vesper-diagnostics/**'
      - 'crates/vesper-lsp/**'
      - 'crates/vesper-forge/**'
      - 'src/**'
      - 'tests/stylus_cli.rs'
      - 'tests/fmt_cli.rs'
      - 'tests/lsp_actions.rs'
      - 'tests/lsp_cli.rs'
      - 'tests/recovery_cli.rs'
      - 'tests/fixtures/stylus/**'
      - 'scripts/check-stylus.py'
      - 'scripts/test-stylus.sh'
      - '.github/workflows/stylus.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'crates/vesper-fmt/**'
      - 'crates/vesper-doc/**'
      - 'crates/vesper-syntax/**'
      - 'crates/vesper-core/**'
      - 'crates/vesper-span/**'
      - 'crates/vesper-diagnostics/**'
      - 'crates/vesper-lsp/**'
      - 'crates/vesper-forge/**'
      - 'src/**'
      - 'tests/stylus_cli.rs'
      - 'tests/fmt_cli.rs'
      - 'tests/lsp_actions.rs'
      - 'tests/lsp_cli.rs'
      - 'tests/recovery_cli.rs'
      - 'tests/fixtures/stylus/**'
      - 'scripts/check-stylus.py'
      - 'scripts/test-stylus.sh'
      - '.github/workflows/stylus.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read
  # The merge gate reads open pull requests and cancels blocked runs.
  actions: write
  pull-requests: read

concurrency:
  group: stylus-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'push' && 'main' || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  native-stylus:
    strategy:
      fail-fast: false
      matrix:
        # Native workspace tests/lints and check-stylus.py are owned by
        # Platforms on Windows/macOS. Keep this extra Linux integration lane.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      # Merge gate (#1321, #1479): a pull request that cannot merge yet runs no CI.
      - name: Check out the pull request head for the merge gate
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .gate
          fetch-depth: 0
          sparse-checkout: |
            .github/actions
            scripts/ci
      - name: Merge gate
        if: github.event_name == 'pull_request'
        uses: ./.gate/.github/actions/merge-gate
        with:
          number: ${{ github.event.pull_request.number }}
          base-ref: ${{ github.event.pull_request.base.ref }}
          head-sha: ${{ github.event.pull_request.head.sha }}
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # cargo-fmt hands every workspace target root to one rustfmt command,
      # which is longer than Windows allows (os error 206). Formatting does
      # not depend on the host, so the Linux leg checks it for everyone.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Assert default CLI does not require the Wasmtime engine
        run: >-
          cargo tree --locked -p vesper --edges normal --prefix none |
          python -c 'import sys; names={line.split()[0] for line in sys.stdin if line.strip()}; assert not names.intersection({"wasmtime", "wasmtime-wasi", "vesper-loom-sandbox"})'
      - name: Test actual formatter with macro and complete-function recovery sources
        run: cargo test --locked -p vesper-fmt --all-targets
      - name: Test actual CLI, current editor actions and original-buffer recovery
        run: >-
          cargo test --locked -p vesper --lib --test stylus_cli --test fmt_cli
          --test lsp_actions --test lsp_cli --test recovery_cli --test forge_cli
      - name: Check strict formatter and source integration Clippy
        run: cargo clippy --locked -p vesper -p vesper-fmt --all-targets -- -D warnings
      - name: Execute actual formatting and stdio acceptance
        run: scripts/test-stylus.sh
