name: Stage 2 bootstrap prerequisites

# The C runner, ported Wasm backend and hybrid compiler driver each have
# differential tests. The full compiler self-rebuild remains a separate
# milestone (see bootstrap/seed/README.md).
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: read

jobs:
  bootstrap:
    name: Seed runner, Wasm packages and hybrid driver
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: 1.100.0
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_BUILD_JOBS: 4
      VESPER_PORT_COMPILER: ${{ github.workspace }}/target/debug/vesper
      VESPER_DEFAULT_COMPILER: ${{ github.workspace }}/target/debug/vesper
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/aspect
      - name: Install the bootstrap toolchain
        # wasm32-wasip2 builds the Cranelift component Stage 2 calls (#2210).
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned wasmtime CLI (v50.0.1) for Stage 2 checks
        run: aspect ci install-wasmtime
      - name: Verify Stage 2 runner wrapper
        env:
          WASMTIME_BIN: ${{ runner.temp }}/wasmtime/wasmtime
        run: aspect bootstrap stage2 -- which
      - name: Build the compiler used by the port and hybrid tests
        run: cargo build --locked -p vesper --bin vesper
      - name: Compare the C seed runner with Wasmtime and the Stage 1 lock
        run: cargo test --locked -p vesper --test stage2_seed_runner -- --test-threads=1
      - name: Exercise Wasm packages under the Rust-built boot Stage 2
        env:
          WASMTIME_BIN: ${{ runner.temp }}/wasmtime/wasmtime
        run: cargo test --locked -p vesper --test wasm_seed_breadth --test wasm_seed_package_io -- --test-threads=1
      - name: Verify the Stage 2 fixed point from the committed seed
        env:
          WASMTIME_BIN: ${{ runner.temp }}/wasmtime/wasmtime
        run: cargo test --locked -p vesper-stage2-gate -- --test-threads=1
      - name: Compare the Cranelift component's objects with the native shim's
        run: cargo test --locked -p vesper-cranelift-component --test objects -- --test-threads=1
      - name: Install pinned wac CLI (v0.8.1) for the Cranelift component
        run: aspect ci install-wac
      - name: Run Cranelift programs through the Wasm backend and the composed component
        env:
          WAC_BIN: ${{ runner.temp }}/wac/wac
          WASMTIME_BIN: ${{ runner.temp }}/wasmtime/wasmtime
        run: cargo test --locked -p vesper-cranelift-component --test wasm_imports -- --test-threads=1
      - name: Compare the Vesper wit-component's Cranelift imports with wit-component's
        run: cargo test --locked -p vesper --test wasm_cranelift_wit_component -- --test-threads=1
      - name: Compare Vesper package assembly with the bootstrap loader
        run: cargo test --locked -p vesper --test self_host_check_names_packages -- --test-threads=1
      - name: Compare the hybrid driver with the default compiler
        run: cargo test --locked -p vesper-hybrid --test driver -- --test-threads=1
