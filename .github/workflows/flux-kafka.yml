name: Flux Kafka interop

# Interop tests of crates/vesper-flux against a real broker: Apache Kafka
# 4.3.2 in KRaft mode (single node, combined broker and controller), from
# the Apache release archive with its SHA-512 checked. Bazel and the other
# platform jobs build the crate and run tests/kafka.rs without a broker,
# where every broker test skips; here VESPER_KAFKA_REQUIRE=1 makes a missing
# broker a failure. Each test starts its own broker on free local ports with
# three client listeners: PLAINTEXT, SSL (a test CA and broker certificate
# generated by the test with rcgen) and SASL_SSL with PLAIN, SCRAM-SHA-256
# and SCRAM-SHA-512 (SCRAM users added by `kafka-storage format
# --add-scram`). The tests cover idempotent and transactional producers,
# zombie fencing, delayed in-flight requests, read_committed reads, consumer
# groups, compression codecs and dead-letter topics; the crash tests SIGKILL
# and restart the broker. No performance is measured here.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/vesper-flux/**'
      - 'crates/vesper-quarry/**'
      - 'crates/vesper-loom-cas/**'
      - 'crates/vesper-simpulse/**'
      - '.github/workflows/flux-kafka.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    # Cargo.toml/Cargo.lock are left out here on purpose (#1321): nearly every
    # PR touches the lock file, and these integration lanes then queued behind
    # the account's job limit. Pushes to main still run on those changes.
    paths:
      - 'crates/vesper-flux/**'
      - 'crates/vesper-quarry/**'
      - 'crates/vesper-loom-cas/**'
      - 'crates/vesper-simpulse/**'
      - '.github/workflows/flux-kafka.yml'

permissions:
  contents: read
  # The merge gate reads open pull requests and cancels blocked runs.
  actions: write
  pull-requests: read

concurrency:
  group: flux-kafka-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'push' && 'main' || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
  KAFKA_VERSION: 4.3.2
  KAFKA_SCALA: '2.13'
  KAFKA_SHA512: c2063485f90312bba795052df3e49b8eea337adf97f1111b946c60771c7a2f088055d2ccc7221d72fe30bd6a3f7a58348f14e14240eaddfe60446ea1c033618b

jobs:
  kafka:
    name: Apache Kafka (KRaft)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VESPER_KAFKA_REQUIRE: '1'
    steps:
      # Merge gate (#1321, #1479): a pull request that cannot merge yet runs no CI.
      - name: Check out the pull request head for the merge gate
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .gate
          fetch-depth: 0
          sparse-checkout: |
            .github/actions
            scripts/ci
      - name: Merge gate
        if: github.event_name == 'pull_request'
        uses: ./.gate/.github/actions/merge-gate
        with:
          number: ${{ github.event.pull_request.number }}
          base-ref: ${{ github.event.pull_request.base.ref }}
          head-sha: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download Apache Kafka
        run: |
          name="kafka_${KAFKA_SCALA}-${KAFKA_VERSION}"
          curl -sSfL -o kafka.tgz "https://archive.apache.org/dist/kafka/${KAFKA_VERSION}/${name}.tgz"
          echo "${KAFKA_SHA512}  kafka.tgz" | sha512sum -c -
          tar xzf kafka.tgz -C "$RUNNER_TEMP"
          echo "VESPER_KAFKA_HOME=$RUNNER_TEMP/${name}" >> "$GITHUB_ENV"
      - name: Show the broker version
        run: |
          java -version
          "$VESPER_KAFKA_HOME/bin/kafka-server-start.sh" --version
      - name: Interop tests against the broker
        run: cargo test --locked --release -p vesper-flux --test kafka -- --nocapture --test-threads=2
      - name: Unit tests (wire codec, record batches, compression)
        run: cargo test --locked --release -p vesper-flux --lib
