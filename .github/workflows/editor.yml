name: Bounded editor stdio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/vesper-span/**'
      - 'crates/vesper-lsp/**'
      - 'crates/vesper-diagnostics/**'
      - 'crates/vesper-serde/**'
      - 'crates/vesper-syntax/**'
      - 'crates/vesper-core/**'
      - 'crates/vesper-doc/**'
      - 'crates/vesper-lint/**'
      - 'crates/vesper-fmt/**'
      - 'src/**'
      - 'tests/lsp_cli.rs'
      - 'tests/lsp_navigation.rs'
      - 'tests/lsp_actions.rs'
      - 'tests/database_signatures.rs'
      - 'scripts/test-editor.sh'
      - 'scripts/check-editor.py'
      - '.github/workflows/editor.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'crates/vesper-span/**'
      - 'crates/vesper-lsp/**'
      - 'crates/vesper-diagnostics/**'
      - 'crates/vesper-serde/**'
      - 'crates/vesper-syntax/**'
      - 'crates/vesper-core/**'
      - 'crates/vesper-doc/**'
      - 'crates/vesper-lint/**'
      - 'crates/vesper-fmt/**'
      - 'src/**'
      - 'tests/lsp_cli.rs'
      - 'tests/lsp_navigation.rs'
      - 'tests/lsp_actions.rs'
      - 'tests/database_signatures.rs'
      - 'scripts/test-editor.sh'
      - 'scripts/check-editor.py'
      - '.github/workflows/editor.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

concurrency:
  group: editor-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  native-editor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test bounded editor and source libraries
        run: >-
          cargo test --locked -p vesper-span -p vesper-lsp -p vesper-fmt
          -p vesper-lint -p vesper-doc
      - name: Test real stdio and checked source providers
        run: >-
          cargo test --locked -p vesper --lib
          --test lsp_cli --test lsp_navigation --test lsp_actions
          --test database_signatures
      - name: Check strict editor and root Clippy
        run: >-
          cargo clippy --locked --all-targets -p vesper -p vesper-span
          -p vesper-lsp -p vesper-fmt -p vesper-lint -p vesper-doc
          -- -D warnings
      - name: Execute actual framed acceptance and leaf examples
        run: scripts/test-editor.sh
