[package]
name = "vesper-lint-seed"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Frozen Rust seed copy of vesper-lint for the compiler's own dependency closure"
autotests = false
autoexamples = false
autobenches = false
build = false

# The seed-copy rule (port wave P1 lane 2, #899; self-hosting SH1 lane 13,
# #1156): the compiler links this package, the Rust build of ../src, under
# the library name `vesper_lint`. Crates inside
# `cargo tree -p vesper -e normal,build` depend on it with
# `vesper-lint = { path = ".../seed", package = "vesper-lint-seed" }`; every
# other crate uses the port-backed package `vesper-lint`. The Rust code takes
# bug fixes only until self-hosting Stage 2.
[lib]
name = "vesper_lint"
path = "../src/lib.rs"

[dependencies]
vesper-core = { path = "../../vesper-core" }
serde = { workspace = true }
toml = "=0.8.23"

[[test]]
name = "policy"
path = "../tests/policy.rs"

[[test]]
name = "typed"
path = "../tests/typed.rs"

[lints.rust]
# cfg(vesper_port) is set only by the port-backed package's build script.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(vesper_port)"] }
