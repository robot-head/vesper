[package]
name = "vesper-lint"
version = "0.1.0"
edition = "2024"
description = "Conservative lint analysis over checked typed compiler facts"
build = "build.rs"

# The compiler and every crate inside `cargo tree -p vesper -e normal,build`
# use the frozen Rust seed copy, crates/vesper-lint/seed (package
# vesper-lint-seed, same library name), instead of this package; see "Crates
# the compiler links" in docs/maintenance/porting-a-crate.md.
#
# This package builds the same Rust by default. Under `vesper-port`,
# build.rs links the Vesper port in vesper/ and sets cfg(vesper_port), and
# `analyze`, `apply_edits` and `Policy::parse` forward to it (self-hosting
# SH1 lane 13, #1156). Rust stays the default until the port matches it in
# function and performance (docs/parallel-results/self-host-lint.md).

[features]
vesper-port = ["dep:vesper-port-abi"]
# Deliberately wrong Vesper builds, one edit per ported area: the port test
# runs must fail (port/test-port.sh asserts which tests do).
vesper-port-divergent = ["vesper-port"]

[dependencies]
vesper-core = { path = "../vesper-core" }
vesper-port-abi = { path = "../vesper-port-abi", optional = true }
serde = { workspace = true }
toml = "=0.8.23"

[dev-dependencies]
# The frozen Rust build, the reference of tests/differential.rs and
# examples/abba.rs.
lint-seed = { package = "vesper-lint-seed", path = "seed" }
# The compiler facade, which turns repository sources into checked facts
# for the corpus differential and the benchmark.
vesper = { path = "../.." }
serde_json = { workspace = true }
vesper-bench = { path = "../vesper-bench" }

[build-dependencies]
# Not optional: a package whose build script runs the harness is
# port-backed for the seed-copy guard (crates/vesper-port-harness/tests/
# closure_guard.rs), whichever build it selects.
vesper-port-harness = { path = "../vesper-port-harness" }

[lints.rust]
# cfg(vesper_port) is set by build.rs under `vesper-port`; the seed package
# has no build script.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(vesper_port)"] }

[[example]]
name = "abba"
required-features = ["vesper-port"]
