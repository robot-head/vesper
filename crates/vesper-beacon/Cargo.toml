[package]
name = "vesper-beacon"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Bounded host tracing, v00 TraceContext, and full-u64 histograms (Rust, with an optional Vesper port)"
build = "build.rs"

# The compiler and every crate inside `cargo tree -p vesper -e normal,build`
# use the frozen Rust seed copy, crates/vesper-beacon/seed (package
# vesper-beacon-seed, same library name), instead of this package; see
# "Crates the compiler links" in docs/maintenance/porting-a-crate.md.
#
# This package builds the same Rust by default. Under `vesper-port`,
# build.rs links the Vesper port in vesper/ and sets cfg(vesper_port), and
# the public API forwards to it (port wave P1 lane 4, #901). The port is
# not the default for any dependent until it reaches performance parity
# with the Rust build (docs/parallel-results/port-p1-beacon.md).

[features]
# traceparent and spans are unconditionally Vesper; histogram and
# exponential stay behind `vesper-port` until they clear 1.50x.
vesper-port = []
# Deliberately wrong Vesper builds, one edit per ported module: the port
# test runs must fail (scripts/test-port-harness.sh asserts which tests do).
vesper-port-divergent = ["vesper-port"]

[dependencies]
vesper-port-abi = { path = "../vesper-port-abi" }

[dev-dependencies]
vesper-bench = { path = "../vesper-bench" }
# The frozen Rust build, for the ABBA benchmark against the port
# (tests/abba.rs).
vesper-beacon-rust = { path = "seed", package = "vesper-beacon-seed" }

[build-dependencies]
# Not optional: a package whose build script runs the harness is
# port-backed for the seed-copy guard (crates/vesper-port-harness/tests/
# closure_guard.rs), whichever build it selects.
vesper-port-harness = { path = "../vesper-port-harness" }
