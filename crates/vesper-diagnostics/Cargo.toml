[package]
name = "vesper-diagnostics"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Bounded shared compiler diagnostic rendering for terminal and LSP"
build = "build.rs"

# This is the port-backed build: build.rs links the Vesper package in vesper/
# and sets cfg(vesper_port) (self-hosting wave SH1 lane 1, #1128). The
# compiler and every crate inside `cargo tree -p vesper -e normal,build` use
# the frozen Rust seed copy, crates/vesper-diagnostics/seed (package
# vesper-diagnostics-seed, same library name), instead; see "Crates the
# compiler links" in docs/maintenance/porting-a-crate.md. Rust stays the
# default build until the port matches it in function and performance.

[features]
# Build the port from an edited copy of the package (one divergence check per
# ported area): the tests named in port/test-port.sh must then fail.
vesper-port-divergent = []

[dependencies]
vesper-core = { path = "../vesper-core" }
# The frozen Rust seed copy (seed-copy rule, #1128).
vesper-span = { path = "../vesper-span/seed", package = "vesper-span-seed" }
vesper-port-abi = { path = "../vesper-port-abi" }
serde_json = "1"
# Only the sizes of its records, which the terminal preflight charges in
# both builds; the port renders the report itself.
ariadne = "0.5"

[dev-dependencies]
# The frozen Rust build, the reference of tests/differential.rs and
# examples/abba.rs.
diagnostics-seed = { package = "vesper-diagnostics-seed", path = "seed" }
vesper-bench = { path = "../vesper-bench" }
unicode-width = "=0.1.14"

[build-dependencies]
vesper-port-harness = { path = "../vesper-port-harness" }

[lints.rust]
# cfg(vesper_port) is set by build.rs (the harness); the seed package has no
# build script.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(vesper_port)"] }
