# The flip gate for vesper-aether's flipped modules (scripts/ci/flip_gate.py,
# SH6 lane 1, #1396; this crate's lane: SH6 lane 14, #1409). The split and
# packed chain walks of src/devices/queue.rs are Vesper-only
# (vesper/src/vq.ves); their Rust is kept only as the unit tests' reference
# (src/devices/queue/reference.rs). The hot-set codec, the packed-ring
# capture of src/virtio.rs, the seccomp compiler and evaluator, the whole vsock, net and
# block devices (src/devices/{vsock,net,block}.rs) and the MMIO register file
# (src/devices/mmio.rs) flipped the same way
# (src/port_reference_tests). The crate's other ported modules are still
# Rust by default and are not part of this gate.
name = "vesper-aether"
lane = "SH6-14"
env = { CARGO_PROFILE_DEV_DEBUG = "0", CARGO_PROFILE_TEST_DEBUG = "0" }

[[tests]]
run = "cargo test --locked --release -p vesper-aether"

[[tests]]
run = "cargo test --locked --release -p vesper-aether --features vesper-port"

# 8,000 random split and packed queues: captures (with hints), completions,
# flushes and driver writes, against the Rust walks; chains, errors, stats
# and ring bytes must all match. Then the hot-set decoder and run builder,
# the packed-ring capture, the seccomp compiler and evaluator, the vsock,
# net and block devices and the MMIO register file
# (vesper/src/{hotset,packed,seccomp,vsock,net,block,mmio}.ves), also
# Vesper-only, against their Rust references (src/port_reference_tests;
# vsock: 300 random runs of 400 guest packets, host socket calls, receive
# steps and resets; net, block and mmio: 200 random runs each of guest
# traffic, malformed requests, feature sets and register accesses).
[differential]
run = "cargo test --locked --release -p vesper-aether --lib -- devices::queue::reference::differential port_reference_tests"

# Block-style chains on a 256-entry split ring and a 256-entry packed ring
# (vesper-bench's ABBA; the harness prints the gate's pairs line).
[[abba]]
workload = "virtqueue"
run = "cargo test --locked --release -p vesper-aether --lib abba_virtqueue -- --ignored --nocapture"

# Decode a 1,000-page hot set, then coalesce it into prefetch runs.
[[abba]]
workload = "hotset"
run = "cargo test --locked --release -p vesper-aether --lib port_reference_tests::abba_hotset -- --ignored --nocapture"

# Capture and complete two laps of two-descriptor chains on a 256-entry
# packed ring.
[[abba]]
workload = "packed"
run = "cargo test --locked --release -p vesper-aether --lib port_reference_tests::abba_packed -- --ignored --nocapture"

# 512 random syscalls through the compiled VMM profile.
[[abba]]
workload = "seccomp_evaluate"
run = "cargo test --locked --release -p vesper-aether --lib port_reference_tests::abba_seccomp::abba_seccomp_evaluate -- --ignored --nocapture"

# Compile the VMM profile (sort and deduplicate the allowlist and the ioctl
# requests, lay out and validate the program).
[[abba]]
workload = "seccomp_compile"
run = "cargo test --locked --release -p vesper-aether --lib port_reference_tests::abba_seccomp::abba_seccomp_compile -- --ignored --nocapture"

# 64 stream connections: 16 rounds of 512-byte guest packets, host reads
# with credit updates and 1 KiB host replies, drained into 4 KiB receive
# buffers.
[[abba]]
workload = "vsock_device"
run = "cargo test --locked --release -p vesper-aether --lib port_reference_tests::vsock::abba_vsock_device -- --ignored --nocapture"

# A net device with 4 queue pairs: rounds of 12 received 1514-byte frames
# into 2048-byte buffers and 12 transmitted frames.
[[abba]]
workload = "net_device"
run = "cargo test --locked --release -p vesper-aether --lib port_reference_tests::net::abba_net_device -- --ignored --nocapture"

# 4 KiB reads and writes at spread-out sectors of a 2048-sector disk.
[[abba]]
workload = "block_device"
run = "cargo test --locked --release -p vesper-aether --lib port_reference_tests::block::abba_block_device -- --ignored --nocapture"

# A driver session over the Vesper block device: initialization, then 32
# rounds of four 512-byte reads, a notification, the interrupt
# acknowledge and the used-ring drain.
[[abba]]
workload = "mmio_transport"
run = "cargo test --locked --release -p vesper-aether --lib port_reference_tests::mmio::abba_mmio_transport -- --ignored --nocapture"
