# The flip gate for vesper-aether's virtqueue walks (scripts/ci/flip_gate.py,
# SH6 lane 1, #1396; this crate's lane: SH6 lane 14, #1409). The split and
# packed chain walks of src/devices/queue.rs are Vesper-only
# (vesper/src/vq.ves); their Rust is kept only as the unit tests' reference
# (src/devices/queue/reference.rs). The crate's other ported modules are
# still Rust by default and are not part of this gate.
name = "vesper-aether"
lane = "SH6-14"
env = { CARGO_PROFILE_DEV_DEBUG = "0", CARGO_PROFILE_TEST_DEBUG = "0" }

[[tests]]
run = "cargo test --locked --release -p vesper-aether"

[[tests]]
run = "cargo test --locked --release -p vesper-aether --features vesper-port"

# 8,000 random split and packed queues: captures (with hints), completions,
# flushes and driver writes, against the Rust walks; chains, errors, stats
# and ring bytes must all match.
[differential]
run = "cargo test --locked --release -p vesper-aether --lib devices::queue::reference::differential"

# Block-style chains on a 256-entry split ring and a 256-entry packed ring
# (vesper-bench's ABBA; the harness prints the gate's pairs line).
[[abba]]
workload = "virtqueue"
run = "cargo test --locked --release -p vesper-aether --lib abba_virtqueue -- --ignored --nocapture"
