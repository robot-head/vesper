[package]
name = "vesper-vault-seed"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Frozen Rust seed copy of vesper-vault for the compiler's own dependency closure"
publish = false
autotests = false
autoexamples = false
autobenches = false
build = false

# The seed-copy rule ("Crates the compiler links" in
# docs/maintenance/porting-a-crate.md; Rust-exit SH6 lane 17, #1412):
# the compiler (`vesper`) and crates in its closure (`vesper-test`) link
# this package: the sources in ../src built with cfg(vesper_port) off over the
# frozen Rust engine in ../src/reference/, under the library name `vesper_vault`.
# Dependents use `vesper-vault = { path = ".../seed", package = "vesper-vault-seed" }`.
# External crates (`vesper-aegis`) link the port-backed `vesper-vault`.
[lib]
name = "vesper_vault"
path = "../src/lib.rs"

[dependencies]
aes = { workspace = true }
aes-gcm = { workspace = true }
chacha20 = { workspace = true }
chacha20poly1305 = { workspace = true }
poly1305 = { workspace = true }
polyval = { workspace = true }
cranelift-codegen = { workspace = true }
getrandom = { workspace = true }
libcrux-ml-kem = { workspace = true }
rand_core = { workspace = true }
region = { workspace = true }
x25519-dalek = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
libcrux-ml-kem = { workspace = true, features = ["simd256"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
libcrux-ml-kem = { workspace = true, features = ["simd128"] }

[dev-dependencies]
ml-kem = { workspace = true }
cranelift-frontend = { workspace = true }
shake = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }

[[test]]
name = "aead"
path = "../tests/aead.rs"

[[test]]
name = "alloc"
path = "../tests/alloc.rs"

[[test]]
name = "consttime"
path = "../tests/consttime.rs"

[[test]]
name = "kem"
path = "../tests/kem.rs"

[[test]]
name = "lean"
path = "../tests/lean.rs"

[[test]]
name = "secret"
path = "../tests/secret.rs"

[[test]]
name = "slot"
path = "../tests/slot.rs"

[[test]]
name = "verifier"
path = "../tests/verifier.rs"

[lints.rust]
# cfg(vesper_port) is set only by the port-backed package's build script.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(vesper_port)"] }
