[package]
name = "vesper-vault"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Vesper Vault: constant-time SSA taint verifier, secret scalars, locked secret slots, nonce-safe AEAD and hybrid X25519MLKEM768 (design section 23)"
publish = false

[features]
# Applies the divergence edits of build.rs (port/check.sh).
vesper-port-divergent = []

[dependencies]
cranelift-codegen = { workspace = true }
rand_core = { workspace = true }
region = { workspace = true }
vesper-crypto-sys = { path = "../vesper-crypto-sys" }
vesper-port-abi = { path = "../vesper-port-abi" }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[build-dependencies]
vesper-port-harness = { path = "../vesper-port-harness" }

# The Rust reference in src/reference/ (for src/differential.rs) and the seed
# crate (for examples/abba.rs) live here so RustCrypto, libcrux-ml-kem,
# x25519-dalek, and getrandom stay out of vesper-vault's runtime dependency closure.
[dev-dependencies]
aes-gcm = { workspace = true }
chacha20poly1305 = { workspace = true }
cranelift-frontend = { workspace = true }
getrandom = { workspace = true }
libcrux-ml-kem = { workspace = true }
ml-kem = { workspace = true }
shake = { workspace = true }
vesper-bench = { path = "../vesper-bench" }
vesper-vault-rust = { path = "seed", package = "vesper-vault-seed" }
x25519-dalek = { workspace = true }

[target.'cfg(target_arch = "x86_64")'.dev-dependencies]
libcrux-ml-kem = { workspace = true, features = ["simd256"] }

[target.'cfg(target_arch = "aarch64")'.dev-dependencies]
libcrux-ml-kem = { workspace = true, features = ["simd128"] }

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }
