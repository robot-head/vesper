[package]
name = "vesper-sim-session"
version = "0.1.0"
edition = "2024"
description = "Reference-evaluator Vesper source sessions under the deterministic SimPulse kernel"
publish = false

[[bin]]
name = "vesper-sim"
path = "src/bin/vesper-sim.rs"

[dependencies]
vesper = { path = "../.." }
vesper-simpulse = { path = "../vesper-simpulse" }
vesper-warp-umem = { path = "../vesper-warp-umem" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
