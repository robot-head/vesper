[package]
name = "vesper-sim-session"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Reference-evaluator Vesper source sessions under the deterministic SimPulse kernel"
publish = false
build = "build.rs"

# build.rs links the Vesper port in port/ (self-hosting wave SH5 lane 19,
# #1342) into every build: the datagram link model, the net-v1 network and
# the QUIC wire codec are Vesper-only. `vesper-port` also switches the WAL,
# SHA-256, process epochs, failure injection and the model validators to it;
# those stay Rust by default until they reach the 1.5x bar.
[features]
vesper-port = []
# A deliberately wrong Vesper build: the port test run must fail.
vesper-port-divergent = ["vesper-port"]

[[bin]]
name = "vesper-sim"
path = "src/bin/vesper-sim.rs"

[dependencies]
vesper = { path = "../.." }
vesper-simpulse = { path = "../vesper-simpulse/seed", package = "vesper-simpulse-seed" }
vesper-warp-umem = { path = "../vesper-warp-umem" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
vesper-port-abi = { path = "../vesper-port-abi" }

[build-dependencies]
vesper-port-harness = { path = "../vesper-port-harness" }
