[package]
name = "vesper-resonance"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Vesper Resonance (design §32): transitive realtime confinement, delay-compensated DSP graphs, wait-free SPSC retirement and realtime kernels"
publish = false
build = "build.rs"

# The port-backed package (port wave P3b lane 9, #1071; flipped by SH6
# lane 9, #1404): build.rs links the Vesper port in vesper/ and sets
# cfg(vesper_port), and the ported API forwards to it. The compiler and every
# crate inside `cargo tree -p vesper -e normal,build` use the frozen Rust seed
# copy, crates/vesper-resonance/seed (package vesper-resonance-seed, same
# library name), instead; see "Crates the compiler links" in
# docs/maintenance/porting-a-crate.md. The modules whose port is within the
# 1.5x bar (the SVF kernel, PID controller, built-in graph, schedule
# compiler and confinement verifier) have no Rust here any more: their frozen
# Rust is in seed/src/engine (docs/parallel-results/rust-exit-kinetic-resonance.md).

[features]
# Deliberately wrong Vesper builds, one edit per ported module: the port test
# runs must fail (port/test-port.sh asserts which tests do).
vesper-port-divergent = []

[dependencies]
cranelift-codegen = { version = "0.125", features = ["arm64", "x86"] }
# Mature wait-free SPSC ring (no locks, no allocation after construction).
rtrb = "=0.4.1"
vesper-port-abi = { path = "../vesper-port-abi" }
# Lends `&[f32]` to the port as `&[u32]` in place (the export ABI has no f32).
bytemuck = "=1.25.2"

[dev-dependencies]
cranelift-frontend = "0.125"
# The frozen Rust build: the reference of tests/port_differential.rs and the
# ABBA benchmark (examples/abba.rs).
vesper-resonance-rust = { path = "seed", package = "vesper-resonance-seed" }

[build-dependencies]
# Not optional: a package whose build script runs the harness is
# port-backed for the seed-copy guard (crates/vesper-port-harness/tests/
# closure_guard.rs), whichever build it selects.
vesper-port-harness = { path = "../vesper-port-harness" }
