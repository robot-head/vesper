[package]
name = "vesper-warp-wheel"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Vesper Warp hierarchical hashed timing wheel, PTO lease table and EDT launch queue (design section 35)"
publish = false
build = "build.rs"

[features]
# Kept as a no-op feature for callers/port-checks; the Vesper port is now the
# only implementation.
vesper-port = []
# A deliberately wrong Vesper build: the port test run must fail.
vesper-port-divergent = []

[dependencies]
vesper-port-abi = { path = "../vesper-port-abi" }

[dev-dependencies]
vesper-bench = { path = "../vesper-bench" }

[build-dependencies]
vesper-port-harness = { path = "../vesper-port-harness" }
