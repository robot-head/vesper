[package]
name = "vesper-cranelift-sys"
version = "0.1.0"
edition = "2024"
description = "C-ABI shim over Cranelift 0.125 (object modules, function builders, data) for Vesper's `.vsys` imports (self-hosting SH0 lane 4)"
license = "MIT OR Apache-2.0"
publish = false

[lib]
# The rlib is what Rust hosts (the JIT tests, a hybrid compiler) link; the
# staticlib is what a C or Vesper executable links (include/vesper_cranelift.h).
crate-type = ["rlib", "staticlib"]

[dependencies]
# Same versions and features as the root compiler, so both lower through
# the same Cranelift build.
cranelift-codegen = { version = "0.125", features = ["arm64", "riscv64"] }
cranelift-frontend = "0.125"
cranelift-module = "0.125"
cranelift-object = "0.125"
target-lexicon = "0.13"

# No JIT and no host detection inside a Wasm sandbox (the Cranelift
# component Stage 2 calls, #2210).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
cranelift-jit = "0.125"
cranelift-native = "0.125"

[dev-dependencies]
# Only tests/checker.rs: Stage 2 does not refuse leaked or reused linear
# handles yet (#2701).
vesper = { path = "../.." }
vesper-ffi = { path = "../vesper-ffi" }
# tests/support/stage2.rs runs the fixtures as Stage 2 components with the
# Cranelift component, through the Stage 2 gate's harness (the same
# Wasmtime build as crates/vesper-stage2-gate).
wasmtime = { version = "50", default-features = false, features = ["cranelift", "component-model", "runtime", "std", "stack-switching", "gc", "gc-null"] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p2"] }
