[package]
name = "vesper-pact"
version = "0.1.0"
edition = "2024"
description = "Canonical trait goals, tabled resolution and stratified coherence for Vesper Pact (design §16.2–16.3)"
license = "MIT OR Apache-2.0"
publish = false
build = "build.rs"

# The compiler and every crate inside `cargo tree -p vesper -e normal,build`
# use the frozen Rust seed copy, crates/vesper-pact/seed (package
# vesper-pact-seed, same library name), instead of this package; see
# "Crates the compiler links" in docs/maintenance/porting-a-crate.md.
#
# This package builds the same Rust by default. Under `vesper-port`,
# build.rs links the Vesper port in vesper/ and sets cfg(vesper_port), and
# validation, solving, coherence, canonicalization and derivation checking
# forward to it (port wave P3a lane 3, #1038). The port is not the default
# for any dependent until it reaches performance parity with the Rust build
# (docs/parallel-results/port-p3-pact.md).

[features]
vesper-port = ["dep:vesper-port-abi"]
# Deliberately wrong Vesper builds, one edit per ported module: the port
# test runs must fail (scripts/test-port-harness.sh asserts which tests do).
vesper-port-divergent = ["vesper-port"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
vesper-port-abi = { path = "../vesper-port-abi", optional = true }

[dev-dependencies]
# The ABBA benchmark (examples/abba.rs; its Rust arm is the seed's
# abba_rust example).
vesper-bench = { path = "../vesper-bench" }

[build-dependencies]
# Not optional: a package whose build script runs the harness is
# port-backed for the seed-copy guard (crates/vesper-port-harness/tests/
# closure_guard.rs), whichever build it selects.
vesper-port-harness = { path = "../vesper-port-harness" }
