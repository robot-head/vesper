[package]
name = "vesper-pact"
version = "0.1.0"
edition = "2024"
description = "Canonical trait goals, tabled resolution and stratified coherence for Vesper Pact (design §16.2–16.3)"
license = "MIT OR Apache-2.0"
publish = false
build = "build.rs"

# The compiler and every crate inside `cargo tree -p vesper -e normal,build`
# use the frozen Rust seed copy, crates/vesper-pact/seed (package
# vesper-pact-seed, same library name), instead of this package; see
# "Crates the compiler links" in docs/maintenance/porting-a-crate.md.
#
# The Vesper port is this package's only build (#1085): build.rs links the
# Vesper port in vesper/ and sets cfg(vesper_port), and validation, solving,
# coherence, canonicalization and derivation checking run in it (port wave
# P3a lane 3, #1038; docs/parallel-results/port-p3-pact.md). The Rust engine
# lives only in the seed copy, under seed/src.

[features]
# Deliberately wrong Vesper builds, one edit per ported module: the port
# test runs must fail (scripts/test-port-harness.sh asserts which tests do).
vesper-port-divergent = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
vesper-port-abi = { path = "../vesper-port-abi" }

[dev-dependencies]
# The frozen Rust seed copy, as the reference of
# tests/standalone_differential.rs.
vesper-pact-seed = { package = "vesper-pact-seed", path = "seed" }
# The ABBA benchmark (examples/abba.rs; its Rust arm is the seed's
# abba_rust example).
vesper-bench = { path = "../vesper-bench" }

[build-dependencies]
vesper-port-harness = { path = "../vesper-port-harness" }
