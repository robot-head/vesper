[package]
name = "vesper-pact-seed"
version = "0.1.0"
edition = "2024"
description = "Frozen Rust seed copy of vesper-pact for the compiler's own dependency closure"
license = "MIT OR Apache-2.0"
publish = false
autotests = false
autoexamples = false
autobenches = false
build = false

# The seed-copy rule (port wave P1 lane 2, #899): the compiler links this
# package, the Rust build of ../src, under the library name `vesper_pact`.
# Crates inside `cargo tree -p vesper -e normal,build` depend on it with
# `vesper-pact = { path = ".../seed", package = "vesper-pact-seed" }`;
# every other crate uses the package `vesper-pact`. The Rust code takes bug
# fixes only until self-hosting Stage 2.
[lib]
name = "vesper_pact"
path = "../src/lib.rs"

[[test]]
name = "coherence"
path = "../tests/coherence.rs"

[[test]]
name = "dto"
path = "../tests/dto.rs"

[[test]]
name = "solver"
path = "../tests/solver.rs"

# The Rust arm of the ABBA benchmark (examples/abba.rs).
[[example]]
name = "abba_rust"
path = "../examples/abba.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
vesper-bench = { path = "../../vesper-bench" }

[lints.rust]
# cfg(vesper_port) is set only by the port-backed package's build script.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(vesper_port)"] }
