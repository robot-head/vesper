[package]
name = "vesper-pulse"
version = "0.1.0"
edition = "2024"

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_WindowsProgramming"] }
