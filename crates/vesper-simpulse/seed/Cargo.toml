[package]
name = "vesper-simpulse-seed"
version = "0.1.0"
edition = "2024"
autotests = false
autoexamples = false
autobenches = false
build = false

# The seed-copy rule (port wave P1 lane 2, #899): every crate inside
# `cargo tree -p vesper -e normal,build` links this package, the shared API in
# ../src/lib.rs over the frozen Rust Simulator in src/reference.rs, under the
# library name `vesper_simpulse`, with
# `vesper-simpulse = { path = ".../seed", package = "vesper-simpulse-seed" }`.
# Crates outside the closure use the package `vesper-simpulse`, whose only
# build is the Vesper port (lane 5, #902; Rust removed there in #1085). The Rust code takes bug fixes only until self-hosting Stage 2.
[lib]
name = "vesper_simpulse"
path = "src/lib.rs"

[[test]]
name = "kernel"
path = "../tests/kernel.rs"

[[test]]
name = "stress"
path = "../tests/stress.rs"

[[example]]
name = "abba"
path = "../examples/abba.rs"

[dev-dependencies]
# The compiler links this seed, so it takes the vesper-bench seed too (#1040).
vesper-bench = { path = "../../vesper-bench/seed", package = "vesper-bench-seed" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
# cfg(vesper_port) is set only by the port-backed package's build script.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(vesper_port)"] }
