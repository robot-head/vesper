[package]
name = "vesper-simpulse"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
build = "build.rs"

# The Vesper port is this package's only build (#1085): build.rs links the
# Vesper package in vesper/ and sets cfg(vesper_port). Crates inside the compiler's closure use the
# frozen Rust seed copy, crates/vesper-simpulse/seed (package
# vesper-simpulse-seed, same library name), and so does vesper-nexus, a
# dev-dependency of the root package; vesper-chorus and vesper-flux use this
# package. See "Crates the compiler links" in
# docs/maintenance/porting-a-crate.md and docs/parallel-results/port-p1-simpulse.md.

[features]
# Deliberately wrong Vesper builds: the kernel tests must fail
# (scripts/test-port-harness.sh asserts which ones do).
vesper-port-divergent = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vesper-port-abi = { path = "../vesper-port-abi" }

[dev-dependencies]
vesper-bench = { path = "../vesper-bench" }

[build-dependencies]
vesper-port-harness = { path = "../vesper-port-harness" }
