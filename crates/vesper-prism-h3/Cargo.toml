[package]
name = "vesper-prism-h3"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "QPACK (RFC 9204) and HTTP/3 (RFC 9114) for Vesper Prism over Vesper Warp (design section 17)"
publish = false
build = "build.rs"

[features]
# The protocol core (QPACK, frames, priorities, capsules, message rules) is
# the Vesper library in vesper/, the only build since SH6 lane 5 (#1400);
# the connection driver is still Rust.
# A deliberately wrong Vesper build, one change per ported module: the port
# test runs must fail (port/check.sh and Bazel assert it).
vesper-port-divergent = []

[dependencies]
vesper-port-abi = { path = "../vesper-port-abi" }
vesper-prism = { path = "../vesper-prism" }
vesper-warp = { path = "../vesper-warp" }
vesper-warp-shard = { path = "../vesper-warp-shard" }
vesper-warp-umem = { path = "../vesper-warp-umem" }

[build-dependencies]
vesper-port-harness = { path = "../vesper-port-harness" }

[dev-dependencies]
# The ABBA benchmark (examples/abba.rs); the Rust seed copy, so the
# benchmark's timer needs no second Vesper library.
vesper-bench = { path = "../vesper-bench/seed", package = "vesper-bench-seed" }
# Wave seven (issue #331), tests only, pinned exactly. quinn-proto (already
# in the lockfile through vesper-warp's tests) carries real QUIC DATAGRAM
# frames (RFC 9221); wtransport-proto is an independent WebTransport
# implementation whose codecs the interop test drives against our server.
bytes = "=1.12.1"
quinn-proto = { version = "=0.11.13", default-features = false, features = ["rustls-aws-lc-rs"] }
wtransport-proto = "=0.7.2"
