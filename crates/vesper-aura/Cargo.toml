[package]
name = "vesper-aura"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Bounded keyed Aura view reconciliation and transactional retained backend contract"
publish = false
build = "build.rs"

# The implementation is the Vesper port: build.rs links the Loom package in
# vesper/ and sets cfg(vesper_port). It replaced the Rust implementation once
# it matched it in tests and beat it on every ABBA workload (#953, #979).
# vesper-aura is outside `cargo tree -p vesper -e normal,build`, so it needs
# no seed copy.

[features]
# Deliberately wrong Vesper builds, one per ported module: the port test
# runs must fail (scripts/test-port-harness.sh asserts which tests do).
vesper-port-divergent = []

[dependencies]
vesper-port-abi = { path = "../vesper-port-abi" }

[dev-dependencies]
vesper-bench = { path = "../vesper-bench" }

[build-dependencies]
vesper-port-harness = { path = "../vesper-port-harness" }
