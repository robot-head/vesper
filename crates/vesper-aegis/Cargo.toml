[package]
name = "vesper-aegis"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Vesper Aegis confidential-computing guest libraries: TDX/SEV-SNP/CCA attestation, RA-TLS policy, GPA acceptance and single-fetch host values (design section 33)"
publish = false
build = "build.rs"

# build.rs links the Vesper package in vesper/ (@vesper/aegis), which is the
# only implementation of the quote, report and claims parsers, the
# timestamp parser and the relying-party policy check: SH6 lane 8 (#1403)
# deleted their Rust once the port passed the flip gate (flip-gate.json).
# The compiler does not link Aegis, so there is no seed copy. The rest of
# the crate (certificate chains, collateral, signing/PKIX verification, the
# gate, GPA and host values) is still Rust; see docs/parallel-results/rust-exit-aegis.md.

[features]
# A deliberately wrong Vesper build, one edit per ported module (build.rs
# DIVERGENT): the tests named in port/check.sh must then fail.
vesper-port-divergent = []

[dependencies]
ring = "0.17.14"
rustls-pki-types = { version = "1.16", features = ["std"] }
webpki = { package = "rustls-webpki", version = "0.103.16", default-features = false, features = ["std", "ring"] }
subtle = { workspace = true }
zeroize = { workspace = true }
vesper-loom-cas = { path = "../vesper-loom-cas" }
vesper-vault = { path = "../vesper-vault" }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
vesper-port-abi = { path = "../vesper-port-abi" }

[dev-dependencies]
coset = "0.3"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
spki = { version = "0.7.3", default-features = false }
vesper-bench = { path = "../vesper-bench" }
x509-parser = "=0.18.1"

[build-dependencies]
vesper-port-harness = { path = "../vesper-port-harness" }

[lints.rust]
# cfg(vesper_port) is set by build.rs (the harness).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(vesper_port)"] }
