# The flip gate for vesper-aegis (scripts/ci/flip_gate.py, SH6 lane 1,
# #1396; this crate's lane: SH6 lane 8, #1403). The ported modules are the
# quote, report and claims parsers, the timestamp parser and the policy
# check; `rust` lists the Rust bodies the module flip deletes.
name = "vesper-aegis"
lane = "SH6-8"
rust = [
    "crates/vesper-aegis/src/reader.rs",
    "crates/vesper-aegis/src/snp.rs",
    "crates/vesper-aegis/src/tdx.rs",
    "crates/vesper-aegis/src/sgx.rs",
    "crates/vesper-aegis/src/time.rs",
    "crates/vesper-aegis/src/policy.rs",
    "crates/vesper-aegis/src/claims.rs",
]
env = { CARGO_PROFILE_DEV_DEBUG = "0", CARGO_PROFILE_TEST_DEBUG = "0" }
build = ["cargo build --locked --release -p vesper-aegis --example abba"]

[[tests]]
run = "cargo test --locked --release -p vesper-aegis -p vesper-aegis-seed"

# Every ported parser on the vendor samples and 4,000 mutations of each,
# and 200,000 random claims/policy pairs, against the Rust build.
[differential]
run = "cargo test --locked --release -p vesper-aegis --test port_differential"

# The harness times both arms in one process (A B B A per epoch) and
# prints the gate's pairs line.
[[abba]]
workload = "snp"
run = "${CARGO_TARGET_DIR:-target}/release/examples/abba flip-gate snp"

[[abba]]
workload = "tdx"
run = "${CARGO_TARGET_DIR:-target}/release/examples/abba flip-gate tdx"

[[abba]]
workload = "sgx"
run = "${CARGO_TARGET_DIR:-target}/release/examples/abba flip-gate sgx"

[[abba]]
workload = "policy"
run = "${CARGO_TARGET_DIR:-target}/release/examples/abba flip-gate policy"
