[package]
name = "vesper-ebpf"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Vesper eBPF: instruction codec, pre-flight abstract verifier, BPF ELF emission, userspace interpreter and the XDP SYN-flood mitigator (design section 27)"
publish = false
build = "build.rs"

# The compiler and every crate inside `cargo tree -p vesper -e normal,build`
# use the frozen Rust seed copy, crates/vesper-ebpf/seed (package
# vesper-ebpf-seed, same library name), instead of this package; see
# "Crates the compiler links" in docs/maintenance/porting-a-crate.md.
#
# This package builds the same Rust by default. Under `vesper-port`,
# build.rs links the Vesper port in vesper/ and sets cfg(vesper_port), and
# the ported functions forward to it (port wave P3a lane 6, #1041). The port
# is not the default for any dependent until it reaches performance parity
# with the Rust build (docs/parallel-results/port-p3-ebpf.md).

[features]
vesper-port = ["dep:vesper-port-abi"]
# Deliberately wrong Vesper builds, one edit per ported module: the port
# test runs must fail (scripts/test-port-harness.sh asserts which tests do).
vesper-port-divergent = ["vesper-port"]

[dependencies]
object = { version = "=0.37.3", default-features = false, features = ["write_core", "elf", "std", "read_core"] }
vesper-port-abi = { path = "../vesper-port-abi", optional = true }

# The one gated unsafe module (`kernel`) issues the bpf() syscall on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.177"

[dev-dependencies]
vesper-bench = { path = "../vesper-bench" }
# The frozen Rust build, for the ABBA benchmark against the port
# (examples/abba.rs).
vesper-ebpf-rust = { path = "seed", package = "vesper-ebpf-seed" }

# An independent loader-side parser (the aya project's object reader) checks
# that emitted objects are what aya-style loaders accept. aya-obj uses
# `std::os::fd` and does not build on Windows.
[target.'cfg(unix)'.dev-dependencies]
aya-obj = "=0.3.0"

[build-dependencies]
# Not optional: a package whose build script runs the harness is
# port-backed for the seed-copy guard (crates/vesper-port-harness/tests/
# closure_guard.rs), whichever build it selects.
vesper-port-harness = { path = "../vesper-port-harness" }
