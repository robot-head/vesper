[package]
name = "vesper-warp-crypto"
version = "0.1.0"
edition = "2024"
description = "Vesper Warp QUIC packet protection with linear nonce tickets (design section 35.1, RFC 9001)"
publish = false

[dependencies]
aes = { workspace = true }
aes-gcm = { workspace = true }
chacha20 = { workspace = true }
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
# Not called directly: enable zeroize-on-drop of the GHASH/Poly1305 state
# inside aes-gcm and chacha20poly1305 through Cargo feature unification.
poly1305 = { workspace = true }
polyval = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }
