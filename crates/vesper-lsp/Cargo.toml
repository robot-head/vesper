[package]
name = "vesper-lsp"
version = "0.1.0"
edition = "2024"
publish = false
description = "Bounded LSP transport and transactional UTF-16 in-memory documents"

[dependencies]
vesper-span = { path = "../vesper-span" }
# The compiler links vesper-lsp, so it uses the frozen Rust seed copy
# (seed-copy rule, docs/maintenance/porting-a-crate.md).
vesper-serde = { path = "../vesper-serde/seed", package = "vesper-serde-seed" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
