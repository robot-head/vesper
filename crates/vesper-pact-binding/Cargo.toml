[package]
name = "vesper-pact-binding"
version = "0.1.0"
edition = "2024"
description = "Root-free source-declaration binding, lowering and coherence-gated evidence sessions for Vesper Pact"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
vesper-core = { path = "../vesper-core" }
vesper-pact = { path = "../vesper-pact" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
