[package]
name = "vesper-warp-tcp"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Sans-IO RFC 9293 TCP endpoint for Vesper Warp (section 35): wire format, state machine, SACK loss recovery and a deterministic lossy test harness"
publish = false
build = "build.rs"

[features]
# wire (codec + checksum) is unconditionally Vesper (part of #1399).
# Enabling vesper-port also switches seq, rtt, cc, and conn to Vesper.
vesper-port = []
# A deliberately wrong Vesper build, one change per ported module: the port
# test runs must fail (scripts/test-port-harness.sh and Bazel assert it).
vesper-port-divergent = []

[dependencies]
vesper-port-abi = { path = "../vesper-port-abi" }

[build-dependencies]
vesper-port-harness = { path = "../vesper-port-harness" }

[dev-dependencies]
vesper-bench = { path = "../vesper-bench" }
vesper-ffi = { path = "../vesper-ffi" }
