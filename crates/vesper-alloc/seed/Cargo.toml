[package]
name = "vesper-alloc-seed"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Frozen Rust seed copy of vesper-alloc for the compiler's own dependency closure"
publish = false
autotests = false
autoexamples = false
autobenches = false
build = false

# The seed-copy rule (port wave P1 lane 2, #899; this crate's port is lane 6,
# #903): the compiler links this package, the Rust build of ../src, under the
# library name `vesper_alloc`. Crates inside `cargo tree -p vesper -e
# normal,build` depend on it with
# `vesper-alloc = { path = ".../seed", package = "vesper-alloc-seed" }`.
# Until the Vesper port matches the Rust build in speed, every other
# dependent uses it too. The Rust code takes bug fixes only.
[lib]
name = "vesper_alloc"
path = "../src/lib.rs"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
# The ABBA benchmark (examples/region_abba.rs).
# The compiler links this seed, so it takes the vesper-bench seed too (#1040).
vesper-bench = { path = "../../vesper-bench/seed", package = "vesper-bench-seed" }

