[package]
name = "vesper-alloc"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Vesper Strata region allocator core (design section 15; port-backed build)"
publish = false
build = "build.rs"

# This is the port-backed build: build.rs links the Vesper package in vesper/
# and sets cfg(vesper_port). The compiler and every crate inside
# `cargo tree -p vesper -e normal,build` use the frozen Rust seed copy,
# crates/vesper-alloc/seed (package vesper-alloc-seed, same library name),
# instead; see "Crates the compiler links" in docs/maintenance/porting-a-crate.md.
# Until the port matches the Rust build in speed, every dependent uses the seed.

[features]
# A deliberately wrong Vesper build (the edits in build.rs, one per ported
# area): scripts/test-port-harness.sh asserts which test catches each.
vesper-port-divergent = []

[dependencies]
vesper-port-abi = { path = "../vesper-port-abi" }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[build-dependencies]
vesper-port-harness = { path = "../vesper-port-harness" }

[dev-dependencies]
# The ABBA benchmark (examples/region_abba.rs).
vesper-bench = { path = "../vesper-bench" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(vesper_port)"] }
