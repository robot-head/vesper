[package]
name = "vesper-loom-trust"
version = "0.1.0"
edition = "2024"
publish = false
description = "Offline configured-key builder attestation quorum verification for Vesper Loom"

[dependencies]
blake3 = "1.8"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
vesper-loom-calculus = { path = "../vesper-loom-calculus" }
vesper-loom-cas = { path = "../vesper-loom-cas" }
