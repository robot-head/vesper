[package]
name = "vesper-loom-trust"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Offline configured-key builder attestation quorum verification for Vesper Loom"

[features]
# Applies the divergence edits of build.rs (port/check.sh).
vesper-port-divergent = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vesper-crypto-sys = { path = "../vesper-crypto-sys" }
vesper-loom-calculus = { path = "../vesper-loom-calculus/seed", package = "vesper-loom-calculus-seed" }
vesper-port-abi = { path = "../vesper-port-abi" }

[build-dependencies]
vesper-port-harness = { path = "../vesper-port-harness" }

# The reference of src/differential.rs: the Rust implementation the port
# replaced (src/reference/), over the libraries it used.
[dev-dependencies]
blake3 = "1.8"
ed25519-dalek = "2"
semver = "1"
vesper-bench = { path = "../vesper-bench" }
vesper-loom-cas = { path = "../vesper-loom-cas" }
