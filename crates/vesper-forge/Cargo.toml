[package]
name = "vesper-forge"
version = "0.1.0"
edition = "2024"
description = "Forge quotation hygiene, emission provenance and emitted-code authority gate"
publish = false

# Temporary standalone workspace for independent testing; integration removes
# this table and the nested lockfile and registers the crate at the root.
[workspace]

[features]
default = ["sandbox-transport"]
# Import untrusted flat `vesper-loom-sandbox` transport outcomes.
sandbox-transport = ["dep:vesper-loom-sandbox"]

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
vesper-loom-sandbox = { path = "../vesper-loom-sandbox", optional = true }

[[example]]
name = "forge_gate"
required-features = ["sandbox-transport"]
