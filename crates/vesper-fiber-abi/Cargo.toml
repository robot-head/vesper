[package]
name = "vesper-fiber-abi"
version = "0.1.0"
edition = "2024"
description = "Versioned repr(C) evidence/continuation ABI and Cranelift park/resume prototype for Vesper Pulse"
publish = false

# Temporary standalone workspace until the integration owner registers this
# crate in the root workspace (see docs/parallel-work.md, rule 3). Versions
# match the root Cargo.lock.
[workspace]

[dependencies]
vesper-pulse = { path = "../vesper-pulse" }
cranelift-codegen = { version = "0.125", features = ["arm64", "x86"] }
cranelift-frontend = "0.125"
cranelift-module = "0.125"
cranelift-jit = "0.125"
cranelift-object = "0.125"
cranelift-native = "0.125"
target-lexicon = "0.13"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
object = { version = "0.37", default-features = false, features = ["read", "std", "elf"] }
