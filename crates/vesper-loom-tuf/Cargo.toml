[package]
name = "vesper-loom-tuf"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Bounded offline TUF target verification with caller-persisted rollback checkpoints"
build = "build.rs"

[features]
# Applies the divergence edits of build.rs (aspect crate loom-tuf test-port).
vesper-port-divergent = []

[dependencies]
tough = { version = "=0.24.0", default-features = false }
tokio = { version = "1", features = ["fs", "rt", "macros"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
jiff = "0.2"
percent-encoding = "2"
olpc-cjson = "0.1"
vesper-crypto-sys = { path = "../vesper-crypto-sys" }
vesper-port-abi = { path = "../vesper-port-abi" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
vesper-port-harness = { path = "../vesper-port-harness" }

[dev-dependencies]
aws-lc-rs = "1"
hex = "0.4"
sha2 = "0.10"
