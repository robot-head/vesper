[package]
name = "vesper-loom-tuf"
version = "0.1.0"
edition = "2024"
publish = false
description = "Bounded offline TUF target verification with caller-persisted rollback checkpoints"

[workspace]

[dependencies]
tough = { version = "=0.24.0", default-features = false }
tokio = { version = "1", features = ["fs", "rt", "macros"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
jiff = "0.2"
libc = "0.2"
percent-encoding = "2"
olpc-cjson = "0.1"

[dev-dependencies]
aws-lc-rs = "1"
hex = "0.4"

[profile.dev]
debug = 0
