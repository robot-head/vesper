[package]
name = "vesper-prism"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Bounded strict HTTP/1.1 request framing for the Prism host prototype"
build = "build.rs"

# The implementation is the Vesper port: build.rs compiles the Loom packages
# in vesper/ and links them. It replaced the Rust implementation in SH6 lane 5
# (#1400), at the flip bar (every test passes, within 1.5x of Rust's time).
# vesper-prism is outside `cargo tree -p vesper -e normal,build`, so it needs
# no seed copy.

[features]
# A deliberately wrong Vesper build, one edit per library: the port test run
# must fail (CI asserts that it does).
vesper-port-divergent = []

[dependencies]
vesper-port-abi = { path = "../vesper-port-abi" }

[build-dependencies]
vesper-port-harness = { path = "../vesper-port-harness" }

[dev-dependencies]
vesper-bench = { path = "../vesper-bench" }
