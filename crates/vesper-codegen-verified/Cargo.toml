[package]
name = "vesper-codegen-verified"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Vesper §42.5 bootstrap fixed-point and diverse double-compiling (DDC) auditor"

[dependencies]
# The auditor links no Vesper library and no crate of the compiler it
# audits; `src/trust.rs` is its own copy of the attestation rules.
blake3 = "1.8"
ed25519-dalek = "2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "=0.8.23"

[[bin]]
name = "vesper-bootstrap"
path = "src/bin/vesper-bootstrap.rs"
