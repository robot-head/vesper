[package]
name = "@vesper/hybrid-proof-audit"
version = "0.1.0"
edition = "2026"
# `vesper proof-audit` (src/proof_commands.rs) served from @vesper/proof-audit
# (SH5 lane 18, #1341). Its own module: @vesper/serde's `Kind::Array` and the
# eBPF backend's `MapKind::Array` would share one variant namespace in the
# driver module's world.
capability_ceiling = ["Fail", "Alloc", "Ffi[StdFs]", "Ffi[StdEnv]", "Ffi[StdProcess]", "Ffi[Blake3]"]

[dependencies]
"@vesper/proof-audit" = { version = "^0.1", path = "../../../../packages/vesper-proof-audit" }
