[package]
name = "@vesper/hybrid-proof-audit"
version = "0.1.0"
edition = "2026"
# `vesper proof-audit` (src/proof_commands.rs) served from @vesper/proof-audit
# (SH5 lane 18, #1341). It got its own module because @vesper/serde's
# `Kind::Array` and the eBPF backend's `MapKind::Array` shared one variant
# namespace in the driver module's world; #2074 renamed the eBPF one
# (`MapKind::ArrayMap`), so it may move into the driver module.
capability_ceiling = ["Fail", "Alloc", "Ffi[StdFs]", "Ffi[StdEnv]", "Ffi[StdProcess]", "Ffi[Blake3]"]

[dependencies]
"@vesper/proof-audit" = { version = "^0.1", path = "../../../../packages/vesper-proof-audit" }
