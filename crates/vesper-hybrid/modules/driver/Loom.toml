[package]
name = "@vesper/hybrid-driver"
version = "0.1.0"
edition = "2026"
# The driver reads its arguments, runs the linker and removes the object
# file; every compiler pass is the hybrid's Rust, reached through the
# `HybridDriver` import (src/lib.ves).
capability_ceiling = ["Fail", "Alloc", "Ffi[StdFs]", "Ffi[StdProcess]", "Ffi[StdEnv]", "Ffi[HybridDriver]", "Ffi[HybridCommands]", "Ffi[Blake3]"]

[dependencies]
"@vesper/driver" = { version = "^0.1", path = "../../../../packages/vesper-driver" }
"@vesper-std/fs" = { version = "^0.1", path = "../../../../packages/vesper-std/fs" }
"@vesper-std/process" = { version = "^0.1", path = "../../../../packages/vesper-std/process" }
"@vesper-std/env" = { version = "^0.1", path = "../../../../packages/vesper-std/env" }
"@vesper-std/fmt" = { version = "^0.1", path = "../../../../packages/vesper-std/fmt" }
# The other commands' layers (SH5 lane 13, #1336).
"@vesper/driver-commands" = { version = "^0.1", path = "../../../../packages/vesper-driver-commands" }
# `vesper build --target wasm32-wasip2` in Vesper (#1895).
"@vesper/wasm-backend" = { version = "^0.1", path = "../../../../packages/vesper-wasm-backend" }
"@vesper/wit-component" = { version = "^0.1", path = "../../../../packages/vesper-wit-component" }
# `vesper build --target bpf` in Vesper (#1895).
"@vesper/ebpf-backend" = { version = "^0.1", path = "../../../../packages/vesper-ebpf-backend" }
# `vesper build --codegen verified` in Vesper (#1886).
"@vesper/verified-codegen" = { version = "^0.1", path = "../../../../packages/vesper-verified-codegen" }
# The front-end passes (hd_step group 2, #1893): the parse module's word
# stream, the front end v2 and the AST, and Rust's `str` Debug text.
"@vesper/hybrid-parse" = { version = "^0.1", path = "../parse" }
"@vesper/ast" = { version = "^0.1", path = "../../../../packages/vesper-ast" }
"@vesper/front" = { version = "^0.1", path = "../../../../packages/vesper-front" }
"@vesper-std/toml" = { version = "^0.1", path = "../../../../packages/vesper-std/toml" }
# The package assembly of the package load (#1986).
"@vesper/check-names-packages" = { version = "^0.1", path = "../../../../packages/vesper-check-names-packages" }
# The manifest decode, version match and `.vsys` type names of the
# package load (#1986 slice 2b).
"@vesper/loom-calculus" = { version = "^0.1", path = "../../../vesper-loom-calculus/vesper" }
"@vesper/vsys" = { version = "^0.1", path = "../../../../packages/vesper-vsys" }
# The checked world's declarations (#2024 slice 2c).
"@vesper/check-collect" = { version = "^0.1", path = "../../../../packages/vesper-check-collect" }
"@vesper-std/intern" = { version = "^0.1", path = "../../../../packages/vesper-std/intern" }
