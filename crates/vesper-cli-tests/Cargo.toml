[package]
name = "vesper-cli-tests"
# `vesper --version` prints the compiler's package version, which the CLI
# tests compare with this one (tests/cli.rs).
version = "0.1.0"
edition = "2024"
description = "The vesper CLI tests, run against $VESPER (default: the shipped compiler), outside the Rust compiler package (#1397, #2743)"
license = "MIT OR Apache-2.0"
publish = false

[dev-dependencies]
blake3 = "1.8"
serde = { workspace = true }
serde_json = { workspace = true }
# native_verifiers_cli recomputes the SHA-384 code digests.
sha2 = { workspace = true }
# The libraries the CLI tests check `vesper` results against, as the root
# package linked them: the frozen seeds until their port crates are the
# default (#1397 R7).
vesper-bench = { path = "../vesper-bench/seed", package = "vesper-bench-seed" }
vesper-chrono = { path = "../vesper-chrono" }
vesper-doc = { path = "../vesper-doc" }
vesper-ebpf = { path = "../vesper-ebpf/seed", package = "vesper-ebpf-seed" }
vesper-ffi = { path = "../vesper-ffi" }
vesper-highlight = { path = "../vesper-highlight/seed", package = "vesper-highlight-seed", features = ["shot"] }
vesper-lean-syntax = { path = "../vesper-lean-syntax/seed", package = "vesper-lean-syntax-seed" }
vesper-loom-calculus = { path = "../vesper-loom-calculus/seed", package = "vesper-loom-calculus-seed" }
vesper-loom-cas = { path = "../vesper-loom-cas/seed", package = "vesper-loom-cas-seed" }
# The LSP framing and envelope checks the server output must pass.
vesper-lsp = { path = "../vesper-lsp" }
vesper-semver = { path = "../vesper-semver/seed", package = "vesper-semver-seed" }
vesper-simd = { path = "../vesper-simd/seed", package = "vesper-simd-seed" }
# wasm_backend_cli runs the components `vesper build --target wasm` writes,
# on the same Wasmtime as the root package.
wasmtime = { version = "50", default-features = false, features = ["cranelift", "component-model", "runtime", "std", "stack-switching", "gc", "gc-null"] }

# attestation_import_cli makes a FIFO.
[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }
