[package]
name = "vesper-tensor-seed"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Frozen Rust seed copy of vesper-tensor for the compiler's own dependency closure"
autotests = false
autoexamples = false
autobenches = false
build = false

# The seed-copy rule (port wave P1 lane 2, #899; lane 8, #905): this package
# is the Rust build of ../src under the library name `vesper_tensor`, over
# the frozen Rust engine in src/engine for the modules the port replaced
# (SH6 lane 11, #1406). The
# compiler and, under the owner's parity rule, every other dependent link it
# with `vesper-tensor = { path = ".../seed", package = "vesper-tensor-seed" }`
# until the port reaches performance parity. The port-backed package
# `vesper-tensor` (..) runs the same tests against the Vesper port. The Rust
# code takes bug fixes only until self-hosting Stage 2.
[lib]
name = "vesper_tensor"
path = "src/lib.rs"

[dependencies]
# Already in Cargo.lock (cranelift-jit uses it); read-only weight mapping.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2 = "=0.2.3"

[[test]]
name = "batching"
path = "../tests/batching.rs"

[[test]]
name = "containers"
path = "../tests/containers.rs"

[[test]]
name = "execution"
path = "../tests/execution.rs"

[[test]]
name = "formats_interop"
path = "../tests/formats_interop.rs"

[[test]]
name = "generation"
path = "../tests/generation.rs"

[[test]]
name = "inference_ops"
path = "../tests/inference_ops.rs"

[[test]]
name = "kv"
path = "../tests/kv.rs"

[[test]]
name = "lean_kv"
path = "../tests/lean_kv.rs"

[[test]]
name = "model_formats"
path = "../tests/model_formats.rs"

[[test]]
name = "reference_fixtures"
path = "../tests/reference_fixtures.rs"

[[test]]
name = "shapes"
path = "../tests/shapes.rs"

[[test]]
name = "simd_kernels"
path = "../tests/simd_kernels.rs"

[[test]]
name = "steady_state_alloc"
path = "../tests/steady_state_alloc.rs"

[[test]]
name = "steady_state_alloc_batch"
path = "../tests/steady_state_alloc_batch.rs"

[[test]]
name = "tokenizer_sampling"
path = "../tests/tokenizer_sampling.rs"

[[test]]
name = "build_kind"
path = "../tests/build_kind.rs"

[lints.rust]
# cfg(vesper_port) is set only by the port-backed package's build script.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(vesper_port)"] }
