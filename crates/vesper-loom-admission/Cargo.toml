[package]
name = "vesper-loom-admission"
version = "0.1.0"
edition = "2024"
publish = false
description = "Fresh configured-quorum artifact blob admission into Vesper Loom CAS"

[dependencies]
blake3 = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
vesper-loom-cas = { path = "../vesper-loom-cas" }
vesper-loom-trust = { path = "../vesper-loom-trust" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
ed25519-dalek = "2"
vesper-loom-calculus = { path = "../vesper-loom-calculus" }
