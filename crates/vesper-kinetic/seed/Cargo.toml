[package]
name = "vesper-kinetic-seed"
version = "0.1.0"
edition = "2024"
description = "Frozen Rust seed copy of vesper-kinetic for the compiler's own dependency closure"
publish = false
autotests = false
autoexamples = false
autobenches = false
build = false

# The seed-copy rule (port wave P1 lane 2, #899; this crate's port is port
# wave P3b lane 8, #1070): the compiler, and for now every other dependent,
# links this package, the Rust build of ../src, under the library name
# `vesper_kinetic`. Dependents use
# `vesper-kinetic = { path = ".../seed", package = "vesper-kinetic-seed" }`.
# The port-backed package `vesper-kinetic` is exercised by its own tests
# until it reaches performance parity. The Rust code takes bug fixes only.
[lib]
name = "vesper_kinetic"
path = "../src/lib.rs"

[dependencies]
blake3 = "1.8"
bytemuck = "=1.25.2"
cranelift-codegen = "0.125"
num-bigint = "=0.4.8"
num-traits = "=0.2.19"
sha2 = { workspace = true }
vesper-alloc = { path = "../../vesper-alloc/seed", package = "vesper-alloc-seed" }
vesper-tensor = { path = "../../vesper-tensor/seed", package = "vesper-tensor-seed" }

[dev-dependencies]
cranelift-frontend = "0.125"
target-lexicon = "0.13"

[[test]]
name = "alloc"
path = "../tests/alloc.rs"

