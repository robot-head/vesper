# The flip gate for vesper-kinetic (scripts/ci/flip_gate.py, SH6 lane 1,
# #1396; this crate's lane: SH6 lane 9, #1404). The flipped modules are the
# constraint colouring (coloring.rs: Colorer and MultiColorer), gjk, sap and
# the fast math (fastmath.rs). The package has only their port; the frozen
# Rust is the seed's engine, which the compiler links until Stage 2.
name = "vesper-kinetic"
lane = "SH6-9"
rust = [
  "crates/vesper-kinetic/seed/src/engine/coloring.rs",
  "crates/vesper-kinetic/seed/src/engine/fastmath.rs",
  "crates/vesper-kinetic/seed/src/engine/gjk.rs",
  "crates/vesper-kinetic/seed/src/engine/lbvh.rs",
  "crates/vesper-kinetic/seed/src/engine/morton.rs",
  "crates/vesper-kinetic/seed/src/engine/sap.rs",
]
env = { CARGO_PROFILE_DEV_DEBUG = "0", CARGO_PROFILE_TEST_DEBUG = "0" }
build = ["cargo build --locked --release -p vesper-kinetic --example abba"]

[[tests]]
run = "cargo test --locked --release -p vesper-kinetic -p vesper-kinetic-seed"

# Both colourers against the seed: visiting order, colours and layers.
[differential]
run = "cargo test --locked --release -p vesper-kinetic --test port_differential -- --nocapture"

# Both builds are in one binary (the seed is a dev-dependency), so the
# harness times both arms itself (A B B A per epoch) and prints the pairs.
[[abba]]
workload = "colorer"
run = "${CARGO_TARGET_DIR:-target}/release/examples/abba flip-gate colorer 20"

[[abba]]
workload = "multi-colorer"
run = "${CARGO_TARGET_DIR:-target}/release/examples/abba flip-gate multi-colorer 20"

[[abba]]
workload = "gjk"
run = "${CARGO_TARGET_DIR:-target}/release/examples/abba flip-gate gjk 20"

[[abba]]
workload = "sap"
run = "${CARGO_TARGET_DIR:-target}/release/examples/abba flip-gate sap 5"

[[abba]]
workload = "fastmath"
run = "${CARGO_TARGET_DIR:-target}/release/examples/abba flip-gate fastmath 20"

[[abba]]
workload = "morton"
run = "${CARGO_TARGET_DIR:-target}/release/examples/abba flip-gate morton 20"

[[abba]]
workload = "lbvh"
run = "${CARGO_TARGET_DIR:-target}/release/examples/abba flip-gate lbvh 5"

[[abba]]
workload = "pile-lbvh"
run = "${CARGO_TARGET_DIR:-target}/release/examples/abba flip-gate pile-lbvh 5"
