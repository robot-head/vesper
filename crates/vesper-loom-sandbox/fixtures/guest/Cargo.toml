[package]
name = "vesper-sandbox-fixture"
version = "0.1.0"
edition = "2024"
publish = false

# Fixture guest for vesper-loom-sandbox tests. Built by ../build.sh for
# wasm32-wasip2 (component) and wasm32-wasip1 (preview1 core module).
[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.63", default-features = false, features = ["macros", "realloc"] }

[target.'cfg(all(target_os = "wasi", target_env = "p2"))'.dependencies]
wasip2 = "1.0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false

[workspace]
