[package]
name = "vesper-beacon-arrow"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Budgeted Apache Arrow IPC and OTel Arrow (OTAP) adapter for Beacon spans and histograms"
build = "build.rs"

# The span stream (`export_batch`, `export_ring`) is the Vesper port in
# vesper/: build.rs links it and checks port/binding.rs (Rust-exit wave SH6,
# lane 18, #1413). The crate is outside the compiler's closure, so it needs no
# seed copy.

[features]
default = ["grpc"]
# OTAP and OTLP over HTTP/2 gRPC (tonic). Without it the crate still encodes,
# decodes and frames OTAP/OTLP messages.
grpc = ["dep:tonic", "dep:tonic-prost", "dep:tokio", "dep:subtle", "dep:rustls"]
# Link Beacon's Vesper port instead of its Rust build (port wave P1 lane 4,
# #901). Off by default until the port reaches performance parity.
vesper-port = ["vesper-beacon/vesper-port"]
# A deliberately wrong Vesper build: the port test run must fail
# (crates/vesper-beacon-arrow/port/test-port.sh asserts which test does).
vesper-port-divergent = []

[dependencies]
vesper-beacon = { path = "../vesper-beacon" }
vesper-port-abi = { path = "../vesper-port-abi" }
arrow-array = "=56.2.0"
arrow-buffer = "=56.2.1"
arrow-schema = "=56.2.0"
arrow-ipc = { version = "=56.2.0", default-features = false, features = ["zstd"] }
flatbuffers = { version = "=25.12.19", default-features = false }
zstd = { version = "=0.13.4", default-features = false }
ciborium = { version = "=0.2.2", default-features = false, features = ["std"] }
loona-hpack = "=0.4.3"
subtle = { version = "=2.6.1", optional = true }
# The ring provider tonic's `tls-ring` uses, installed explicitly when no
# process default exists (builds that unify rustls features with aws-lc-rs
# have no automatic default).
rustls = { version = "=0.23.46", optional = true, default-features = false, features = ["std", "ring"] }
arrow-select = "=56.2.0"
prost = { version = "=0.14.6", default-features = false, features = ["derive", "std"] }
hmac = "=0.12.1"
sha2 = "=0.10.9"
tonic = { version = "=0.14.9", optional = true, default-features = false, features = ["transport", "codegen", "router", "zstd", "gzip", "tls-ring"] }
tonic-prost = { version = "=0.14.9", optional = true }
tokio = { version = "=1.54.1", optional = true, features = ["rt", "rt-multi-thread", "net", "sync", "time", "macros"] }

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
arrow2 = { version = "=0.18.0", default-features = false, features = ["io_ipc"] }

[build-dependencies]
vesper-port-harness = { path = "../vesper-port-harness" }
