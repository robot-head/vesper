[package]
name = "vesper-beacon-arrow"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Budgeted Apache Arrow IPC adapter for Beacon spans"

[dependencies]
vesper-beacon = { path = "../vesper-beacon" }
arrow-array = "=56.2.0"
arrow-schema = "=56.2.0"
arrow-ipc = { version = "=56.2.0", default-features = false }

[dev-dependencies]
arrow2 = { version = "=0.18.0", default-features = false, features = ["io_ipc"] }

[workspace]
