[package]
name = "vesper-loom-cas"
version = "0.1.0"
edition = "2024"
description = "Vesper Loom immutable BLAKE3 content-addressed store (design section 8.2.6)"
publish = false

[dependencies]
blake3 = "1.8"
reflink-copy = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
