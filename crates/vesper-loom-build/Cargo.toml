[package]
name = "vesper-loom-build"
version = "0.1.0"
edition = "2024"
description = "Offline Loom build-step runner: CAS-snapshotted inputs, hermetic WASI execution, verified derivation cache"
publish = false
build = "build.rs"



[dependencies]
vesper-loom-cas = { path = "../vesper-loom-cas" }
vesper-loom-sandbox = { path = "../vesper-loom-sandbox" }
blake3 = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
blake3 = "1.8"

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"
