[package]
name = "vesper-forge-runner"
version = "0.1.0"
edition = "2024"
description = "Cached WASI Forge macro execution with fresh per-session hygiene and authority approval"
publish = false
build = "build.rs"

[dependencies]
vesper-forge = { path = "../vesper-forge", features = ["sandbox-transport"] }
vesper-loom-cas = { path = "../vesper-loom-cas" }
vesper-loom-sandbox = { path = "../vesper-loom-sandbox" }
blake3 = "1.8"
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"
