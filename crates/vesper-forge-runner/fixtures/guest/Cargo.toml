[package]
name = "vesper-forge-runner-fixture"
version = "0.1.0"
edition = "2024"
publish = false

# Macro fixture component for vesper-forge-runner tests. Built by ../build.sh
# for wasm32-wasip2 against the read-only vesper-loom-sandbox WIT.
[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.63", default-features = false, features = ["macros", "realloc"] }
wasip2 = "1.0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false

[workspace]
