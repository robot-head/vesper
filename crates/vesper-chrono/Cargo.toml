[package]
name = "vesper-chrono"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Vesper Chrono flight recording, reverse watchpoints, obligation lineage, replay bundles, hardware branch-trace decoding and activation checkpoints (design section 31)"
publish = false
build = "build.rs"

# build.rs links the Vesper package in vesper/ (@vesper/chrono) and sets
# cfg(vesper_port); the modules it backs forward to Vesper (Rust-exit SH6
# lane 14 part 7a, #1409). The compiler links Chrono (`vesper top`,
# `vesper replay`, the anvil simulator), so it builds the frozen Rust seed
# copy, seed/ (package vesper-chrono-seed): the same sources with
# cfg(vesper_port) off ("Crates the compiler links" in
# docs/maintenance/porting-a-crate.md).

[features]
# Applies the divergence edits of build.rs (.aspect/port-checks.axl).
vesper-port-divergent = []

[dependencies]
blake3 = "1.8"
serde_json = { workspace = true }
iced-x86 = { version = "=1.21.0", default-features = false, features = ["std", "decoder", "instr_info"] }
vesper-ffi = { path = "../vesper-ffi" }
vesper-fiber-abi = { path = "../vesper-fiber-abi" }
vesper-simpulse = { path = "../vesper-simpulse/seed", package = "vesper-simpulse-seed" }
vesper-port-abi = { path = "../vesper-port-abi" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[build-dependencies]
vesper-port-harness = { path = "../vesper-port-harness" }

[dev-dependencies]
vesper-bench = { path = "../vesper-bench" }

[lints.rust]
# cfg(vesper_port) is set by build.rs (the harness).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(vesper_port)"] }
