[package]
name = "vesper-simd"
version = "0.1.0"
edition = "2024"
description = "Checked Baseline128 JIT byte scanner and explicitly targeted SIMD objects"
publish = false

[dependencies]
cranelift-codegen = { version = "0.125", features = ["arm64", "x86"] }
cranelift-frontend = "0.125"
cranelift-module = "0.125"
# selinux-fix maps JIT code with mmap: hardened kernels (SELinux execheap,
# BuildBuddy workflow VMs) refuse to make heap memory executable.
cranelift-jit = { version = "0.125", features = ["selinux-fix"] }
cranelift-object = "0.125"
target-lexicon = "0.13"

[dev-dependencies]
object = { version = "0.37", default-features = false, features = ["read", "std", "elf"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
