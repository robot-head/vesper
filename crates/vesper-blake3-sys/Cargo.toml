[package]
name = "vesper-blake3-sys"
version = "0.1.0"
edition = "2024"
description = "Builds the official BLAKE3 C implementation and @vesper-std/hash-sys's C glue (packages/vesper-std/hash/sys/c) for Rust hosts of Vesper objects (Rust-exit SH6 lane 17)"
license = "MIT OR Apache-2.0"
publish = false
build = "build.rs"
links = "vesper_std_blake3"

[build-dependencies]
cc = "1"

[dev-dependencies]
# The reference the C build is checked against: pinned to the vendored C
# version (tests/c_matches_crate.rs checks blake3.h says the same).
blake3 = "=1.8.7"
