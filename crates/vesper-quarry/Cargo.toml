[package]
name = "vesper-quarry"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Bounded deterministic host SQL catalog, checked plans, row and vectorized executors, and a durable WAL-recovered page store"
build = "build.rs"

[features]
# Compatibility no-op: the Vesper port is now the only build of the
# SQL front end, optimizer, row executor and access planner.
vesper-port = []
# A deliberately wrong Vesper build: the port test run must fail.
vesper-port-divergent = []

[dependencies]
vesper-simd = { path = "../vesper-simd" }
vesper-port-abi = { path = "../vesper-port-abi" }

[build-dependencies]
vesper-port-harness = { path = "../vesper-port-harness" }

[dev-dependencies]
vesper-bench = { path = "../vesper-bench" }
