[package]
name = "vesper-doc"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Bounded typed documentation DTOs, static rendering and offline signature search"

[dependencies]
vesper-core = { path = "../vesper-core" }
vesper-syntax = { path = "../vesper-syntax" }
vesper-simpulse = { path = "../vesper-simpulse" }
vesper-ffi = { path = "../vesper-ffi" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
