[workspace.dependencies]
logos = "0.15"
rowan = "0.16"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
io-uring = "0.7"
crossbeam-deque = "=0.8.8"
core_affinity = "=0.8.3"
aes = { version = "=0.8.4", features = ["zeroize"] }
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "zeroize"] }
chacha20 = { version = "=0.9.1", features = ["zeroize"] }
chacha20poly1305 = { version = "=0.10.1", default-features = false }
hkdf = "=0.12.4"
poly1305 = { version = "=0.8.0", features = ["zeroize"] }
polyval = { version = "=0.6.2", features = ["zeroize"] }
sha2 = "0.10.9"
subtle = "2.6.1"
zeroize = { version = "1.9.1", features = ["zeroize_derive"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "aws_lc_rs"] }
cranelift-codegen = { version = "0.125", features = ["arm64"] }
cranelift-frontend = "0.125"
getrandom = "0.4"
libc = "0.2"
ml-kem = { version = "=0.3.4", default-features = false, features = ["zeroize"] }
libcrux-ml-kem = { version = "=0.0.11", default-features = false, features = ["mlkem768"] }
rand_core = "0.10"
region = "3.0.2"
shake = "0.1"
x25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize", "static_secrets", "precomputed-tables"] }

[package]
default-run = "vesper"
name = "vesper"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
# The host shim of @vesper-std/fs, process and env (#1125). `vesper jit`
# binds the packages' `.vsys` imports to it (#1150), and tests/std_fs.rs,
# std_process.rs and std_env.rs bind it into the JIT. It has no dependencies.
vesper-std-host = { path = "crates/vesper-std-host" }
blake3 = "1.8"
# Grows the native lowering's stack on deep specialization (#1329).
stacker = "0.1"
vesper-core = { path = "crates/vesper-core" }
# The compiler links the frozen Rust seed copy of vesper-forge (#1157).
vesper-forge = { path = "crates/vesper-forge/seed", package = "vesper-forge-seed", default-features = false }
# The compiler links the frozen Rust seed copy of vesper-lean-syntax (#1128).
vesper-lean-syntax = { path = "crates/vesper-lean-syntax/seed", package = "vesper-lean-syntax-seed" }
vesper-syntax = { path = "crates/vesper-syntax" }
# The compiler links the frozen Rust seed copies of vesper-highlight and
# vesper-fmt (seed-copy rule, #1154).
vesper-highlight = { path = "crates/vesper-highlight/seed", package = "vesper-highlight-seed", features = ["shot"] }
# The compiler links the frozen Rust seed copy of vesper-span (#1128).
vesper-span = { path = "crates/vesper-span/seed", package = "vesper-span-seed" }
vesper-lsp = { path = "crates/vesper-lsp" }
# The compiler links the frozen Rust seed copy of vesper-diagnostics (#1128).
vesper-diagnostics = { path = "crates/vesper-diagnostics/seed", package = "vesper-diagnostics-seed" }
vesper-fmt = { path = "crates/vesper-fmt/seed", package = "vesper-fmt-seed" }
# The compiler links the frozen Rust seed copy of vesper-lint (#1156).
vesper-lint = { path = "crates/vesper-lint/seed", package = "vesper-lint-seed" }
vesper-doc = { path = "crates/vesper-doc" }
vesper-test = { path = "crates/vesper-test" }
# The compiler links the frozen Rust seed copy, never the port-backed package
# (seed-copy rule, docs/maintenance/porting-a-crate.md).
vesper-beacon = { path = "crates/vesper-beacon/seed", package = "vesper-beacon-seed" }
vesper-pulse = { path = "crates/vesper-pulse" }
vesper-fiber-abi = { path = "crates/vesper-fiber-abi" }
vesper-semver = { path = "crates/vesper-semver/seed", package = "vesper-semver-seed" }
# The compiler links the frozen Rust seed copy of vesper-loom-calculus (#913).
vesper-loom-calculus = { path = "crates/vesper-loom-calculus/seed", package = "vesper-loom-calculus-seed" }
vesper-loom-cas = { path = "crates/vesper-loom-cas" }
vesper-pact = { path = "crates/vesper-pact/seed", package = "vesper-pact-seed" }
vesper-pact-binding = { path = "crates/vesper-pact-binding" }
# Integration B (#136): wave-five verifiers and tools wired into the CLI.
vesper-chrono = { path = "crates/vesper-chrono" }
# The compiler links the frozen Rust seed copy (seed-copy rule); the Vesper
# port is the package crates/vesper-crucible (#915).
vesper-crucible = { path = "crates/vesper-crucible/seed", package = "vesper-crucible-seed" }
# The compiler links the frozen Rust seed copy (seed-copy rule); the Vesper
# port is the package crates/vesper-ebpf (#1041).
vesper-ebpf = { path = "crates/vesper-ebpf/seed", package = "vesper-ebpf-seed" }
vesper-kinetic = { path = "crates/vesper-kinetic/seed", package = "vesper-kinetic-seed" }
vesper-ffi = { path = "crates/vesper-ffi" }
# The compiler links the frozen Rust seed copy (seed-copy rule); the Vesper
# port is the package crates/vesper-resonance (#1071).
vesper-resonance = { path = "crates/vesper-resonance/seed", package = "vesper-resonance-seed" }
# The compiler links the frozen Rust seed copy (seed-copy rule); the Vesper
# port is the package crates/vesper-silicon (#1042).
vesper-silicon = { path = "crates/vesper-silicon/seed", package = "vesper-silicon-seed" }
vesper-vault = { path = "crates/vesper-vault" }
# Source Strata regions (wave seven lane 29) run on the host region allocator.
# The compiler links the frozen Rust seed copy (seed-copy rule); the Vesper
# port is the package crates/vesper-alloc.
vesper-alloc = { path = "crates/vesper-alloc/seed", package = "vesper-alloc-seed" }
# Source tensor types (wave eight lane 10) evaluate on the host kernels.
vesper-tensor = { path = "crates/vesper-tensor/seed", package = "vesper-tensor-seed" }
ariadne = "0.5"
petgraph = "0.8"
egg = "0.10"
egglog = { version = "3", default-features = false }
cranelift-codegen = { version = "0.125", features = ["arm64", "riscv64"] }
cranelift-frontend = "0.125"
cranelift-module = "0.125"
cranelift-jit = "0.125"
cranelift-object = "0.125"
cranelift-native = "0.125"
target-lexicon = "0.13"
# Freestanding images (wave seven lane 27): read relocatable objects, write
# the entry stub. Same version and features as vesper-ebpf.
object = { version = "=0.37.3", default-features = false, features = ["write_core", "elf", "std", "read_core"] }
serde = { workspace = true }
serde_json = { workspace = true }
salsa = "0.24"
# Wasm target (wave-seven lane 25): the versions Wasmtime 50 already pulls in.
wasm-encoder = "=0.261.0"
wit-component = "=0.261.0"
wit-parser = "=0.261.0"

[dev-dependencies]
# bench, grammar, json, audit, publish, resolve, sbom and `build --tee` run
# as `vesper-<tool>` binaries (crates/vesper-tools, SH0 lane 2), so these
# seed copies left the compiler's closure. The CLI tests still check results
# against them.
vesper-aegis = { path = "crates/vesper-aegis/seed", package = "vesper-aegis-seed" }
vesper-bench = { path = "crates/vesper-bench/seed", package = "vesper-bench-seed" }
# The one crypto shim, bound to @vesper/crypto in tests/crypto_shim.rs (SH6 lane 17).
vesper-crypto-sys = { path = "crates/vesper-crypto-sys" }
# The BLAKE3 C library behind @vesper-std/hash-sys, for tests/std_hash.rs.
vesper-blake3-sys = { path = "crates/vesper-blake3-sys" }
vesper-nexus = { path = "crates/vesper-nexus" }
# The tools moved out of the compiler by SH6 lane 3 (#1398) link these; the
# CLI tests still call them to check results.
vesper-serde = { path = "crates/vesper-serde/seed", package = "vesper-serde-seed" }
vesper-simd = { path = "crates/vesper-simd" }
# HostCall drives the JIT-compiled front end v2 in tests/self_host_front_v2.rs (#1147).
vesper-port-abi = { path = "crates/vesper-port-abi" }
wasmtime = { version = "50", default-features = false, features = ["cranelift", "component-model", "runtime", "std", "stack-switching", "gc", "gc-null"] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p2"] }

[target.'cfg(unix)'.dependencies]
getrandom = "0.4"
libc = "0.2"

# Wave-seven lane 24 (#347): locates the Visual Studio link.exe and its LIB
# paths for `vesper build` on Windows (already locked through cc).
[target.'cfg(windows)'.dependencies]
find-msvc-tools = "=0.1.15"

# Test builds optimize the e-graph engines and Cranelift (#1376): debug
# egglog and Cranelift made the self-host differentials spend most of their
# time JIT-compiling the Vesper ports. Keep this list in step with the
# `crate.annotation` rustc_flags in MODULE.bazel.
[profile.dev.package]
cranelift-assembler-x64 = { opt-level = 2 }
cranelift-bforest = { opt-level = 2 }
cranelift-bitset = { opt-level = 2 }
cranelift-codegen = { opt-level = 2 }
cranelift-codegen-shared = { opt-level = 2 }
cranelift-control = { opt-level = 2 }
cranelift-entity = { opt-level = 2 }
cranelift-frontend = { opt-level = 2 }
cranelift-jit = { opt-level = 2 }
cranelift-module = { opt-level = 2 }
cranelift-native = { opt-level = 2 }
cranelift-object = { opt-level = 2 }
egg = { opt-level = 2 }
egglog = { opt-level = 2 }
egglog-add-primitive = { opt-level = 2 }
egglog-ast = { opt-level = 2 }
egglog-bridge = { opt-level = 2 }
egglog-concurrency = { opt-level = 2 }
egglog-core-relations = { opt-level = 2 }
egglog-numeric-id = { opt-level = 2 }
egglog-reports = { opt-level = 2 }
egglog-union-find = { opt-level = 2 }
regalloc2 = { opt-level = 2 }

[profile.release]
lto = "thin"

# The compiler the CI port harness compiles every port with (#1103):
# optimized, but with release's thin LTO off so it builds quickly, and with
# debug assertions and overflow checks kept on like the dev profile.
[profile.port-compiler]
inherits = "release"
lto = false
codegen-units = 16
debug-assertions = true
overflow-checks = true
