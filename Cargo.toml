# Extracted leaf crates form the first workspace boundary. The checker and
# Place IR remain in the facade until their shared World dependency is split.
[workspace]
resolver = "2"
members = [
    ".",
    "crates/vesper-core",
    "crates/vesper-syntax",
    "crates/vesper-span",
    "crates/vesper-lsp",
    "crates/vesper-grammar",
    "crates/vesper-fmt",
    "crates/vesper-lint",
    "crates/vesper-bench",
    "crates/vesper-bench-pmu",
    "crates/vesper-doc",
    "crates/vesper-pulse",
    "crates/vesper-prism",
    "crates/vesper-ffi",
    "crates/vesper-forge",
    "crates/vesper-loom-calculus",
    "crates/vesper-lean-syntax",
    "crates/vesper-simpulse",
    "crates/vesper-sim-session",
    "crates/vesper-simd",
    "crates/vesper-semver",
    "crates/vesper-loom-solver",
    "crates/vesper-loom-trust",
    "crates/vesper-loom-admission",
    "crates/vesper-loom-audit",
    "crates/vesper-loom-tuf",
    "crates/vesper-alloc",
    "crates/vesper-aura",
    "crates/vesper-beacon",
    "crates/vesper-beacon-arrow",
    "crates/vesper-serde",
    "crates/vesper-quarry",
    "crates/vesper-tensor",
    "crates/vesper-flux",
    "crates/vesper-aether",
    "crates/vesper-fiber-abi",
    "crates/vesper-pact",
    "crates/vesper-pact-bridge",
    "crates/vesper-pact-binding",
    "crates/vesper-loom-cas",
    "crates/vesper-loom-sandbox",
    "crates/vesper-loom-build",
    "crates/vesper-forge-runner",
    "crates/vesper-ignis",
    "crates/vesper-warp-shard",
    "crates/vesper-warp",
    "crates/vesper-warp-bbr",
    "crates/vesper-warp-umem",
    "experiments/native-pulse",
]
# Preserve the pre-extraction `cargo test` coverage of moved unit tests.
default-members = [
    ".",
    "crates/vesper-core",
    "crates/vesper-syntax",
    "crates/vesper-span",
    "crates/vesper-lsp",
    "crates/vesper-grammar",
    "crates/vesper-fmt",
    "crates/vesper-lint",
    "crates/vesper-bench",
    "crates/vesper-bench-pmu",
    "crates/vesper-doc",
    "crates/vesper-pulse",
    "crates/vesper-prism",
    "crates/vesper-ffi",
    "crates/vesper-forge",
    "crates/vesper-loom-calculus",
    "crates/vesper-lean-syntax",
    "crates/vesper-simpulse",
    "crates/vesper-sim-session",
    "crates/vesper-simd",
    "crates/vesper-semver",
    "crates/vesper-loom-solver",
    "crates/vesper-loom-trust",
    "crates/vesper-loom-admission",
    "crates/vesper-loom-audit",
    "crates/vesper-loom-tuf",
    "crates/vesper-alloc",
    "crates/vesper-aura",
    "crates/vesper-beacon",
    "crates/vesper-beacon-arrow",
    "crates/vesper-serde",
    "crates/vesper-quarry",
    "crates/vesper-tensor",
    "crates/vesper-flux",
    "crates/vesper-aether",
    "crates/vesper-fiber-abi",
    "crates/vesper-pact",
    "crates/vesper-pact-bridge",
    "crates/vesper-pact-binding",
    "crates/vesper-loom-cas",
    "crates/vesper-loom-sandbox",
    "crates/vesper-loom-build",
    "crates/vesper-forge-runner",
    "crates/vesper-ignis",
    "crates/vesper-warp-shard",
    "crates/vesper-warp",
    "crates/vesper-warp-bbr",
    "crates/vesper-warp-umem",
    "experiments/native-pulse",
]

exclude = [
    "crates/vesper-loom-sandbox/fixtures/guest",
    "crates/vesper-forge-runner/fixtures/guest",
]

[workspace.dependencies]
logos = "0.15"
rowan = "0.16"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
io-uring = "0.7"

[package]
default-run = "vesper"
name = "vesper"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8"
vesper-core = { path = "crates/vesper-core" }
vesper-simd = { path = "crates/vesper-simd" }
vesper-lean-syntax = { path = "crates/vesper-lean-syntax" }
vesper-syntax = { path = "crates/vesper-syntax" }
vesper-span = { path = "crates/vesper-span" }
vesper-lsp = { path = "crates/vesper-lsp" }
vesper-fmt = { path = "crates/vesper-fmt" }
vesper-lint = { path = "crates/vesper-lint" }
vesper-bench = { path = "crates/vesper-bench" }
vesper-bench-pmu = { path = "crates/vesper-bench-pmu" }
vesper-grammar = { path = "crates/vesper-grammar" }
vesper-doc = { path = "crates/vesper-doc" }
vesper-beacon = { path = "crates/vesper-beacon" }
vesper-serde = { path = "crates/vesper-serde" }
vesper-pulse = { path = "crates/vesper-pulse" }
vesper-fiber-abi = { path = "crates/vesper-fiber-abi" }
vesper-semver = { path = "crates/vesper-semver" }
vesper-loom-calculus = { path = "crates/vesper-loom-calculus" }
vesper-loom-solver = { path = "crates/vesper-loom-solver" }
vesper-loom-trust = { path = "crates/vesper-loom-trust" }
vesper-loom-admission = { path = "crates/vesper-loom-admission" }
vesper-loom-audit = { path = "crates/vesper-loom-audit" }
vesper-loom-cas = { path = "crates/vesper-loom-cas" }
vesper-pact = { path = "crates/vesper-pact" }
vesper-pact-binding = { path = "crates/vesper-pact-binding" }
ariadne = "0.5"
petgraph = "0.8"
egg = "0.10"
egglog = { version = "3", default-features = false }
cranelift-codegen = { version = "0.125", features = ["arm64"] }
cranelift-frontend = "0.125"
cranelift-module = "0.125"
cranelift-jit = "0.125"
cranelift-object = "0.125"
cranelift-native = "0.125"
target-lexicon = "0.13"
serde = { workspace = true }
serde_json = { workspace = true }
salsa = "0.24"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
