[workspace.dependencies]
logos = "0.15"
rowan = "0.16"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
io-uring = "0.7"
aes = { version = "=0.8.4", features = ["zeroize"] }
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "zeroize"] }
chacha20 = { version = "=0.9.1", features = ["zeroize"] }
chacha20poly1305 = { version = "=0.10.1", default-features = false }
hkdf = "=0.12.4"
poly1305 = { version = "=0.8.0", features = ["zeroize"] }
polyval = { version = "=0.6.2", features = ["zeroize"] }
sha2 = "0.10.9"
subtle = "2.6.1"
zeroize = { version = "1.9.1", features = ["zeroize_derive"] }
cranelift-codegen = { version = "0.125", features = ["arm64"] }
cranelift-frontend = "0.125"
getrandom = "0.4"
libc = "0.2"
ml-kem = { version = "=0.3.4", default-features = false, features = ["zeroize"] }
rand_core = "0.10"
region = "3.0.2"
shake = "0.1"
x25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize", "static_secrets", "precomputed-tables"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "aws_lc_rs"] }

[package]
default-run = "vesper"
name = "vesper"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8"
vesper-core = { path = "crates/vesper-core" }
vesper-forge = { path = "crates/vesper-forge", default-features = false }
vesper-simd = { path = "crates/vesper-simd" }
vesper-lean-syntax = { path = "crates/vesper-lean-syntax" }
vesper-syntax = { path = "crates/vesper-syntax" }
vesper-span = { path = "crates/vesper-span" }
vesper-lsp = { path = "crates/vesper-lsp" }
vesper-diagnostics = { path = "crates/vesper-diagnostics" }
vesper-fmt = { path = "crates/vesper-fmt" }
vesper-lint = { path = "crates/vesper-lint" }
vesper-bench = { path = "crates/vesper-bench" }
