# The flip gate's worked example (scripts/ci/flip_gate.py, SH6 lane 1,
# #1396). vesper-span is already port-backed (SH0 lane 6, #1128); the Rust
# left is the frozen seed the compiler links, which the retirement deletes.
# A lane's own file lives at crates/<crate>/flip-gate.toml.
name = "vesper-span"
lane = "SH0-6"
rust = ["crates/vesper-span/src/lib.rs"]  # the seed package builds from this file
env = { CARGO_PROFILE_DEV_DEBUG = "0", CARGO_PROFILE_TEST_DEBUG = "0" }
build = ["cargo build --locked --release -p vesper-span --example abba"]

[[tests]]
run = "cargo test --locked -p vesper-span -p vesper-span-seed"

[differential]
run = "cargo test --locked -p vesper-span --test differential"

# `once <workload> <arm> <batches>` runs one arm; each Rust run takes about 0.5-1.3 s
# so process start and input setup stay small next to the work.
[[abba]]
workload = "lookup"
rust = "${CARGO_TARGET_DIR:-target}/release/examples/abba once lookup rust 2000"
vesper = "${CARGO_TARGET_DIR:-target}/release/examples/abba once lookup vesper 2000"

[[abba]]
workload = "index"
rust = "${CARGO_TARGET_DIR:-target}/release/examples/abba once index rust 4000"
vesper = "${CARGO_TARGET_DIR:-target}/release/examples/abba once index vesper 4000"

[[abba]]
workload = "edits"
rust = "${CARGO_TARGET_DIR:-target}/release/examples/abba once edits rust 10000"
vesper = "${CARGO_TARGET_DIR:-target}/release/examples/abba once edits vesper 10000"
