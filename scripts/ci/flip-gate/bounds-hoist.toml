# Flip gate for the compiler's bounds hoisting (`bounds_hoist::run`), ported
# as @vesper/bounds-hoist (SH3 lane 12, #1251) and installed as the hybrid's
# `hoist` hook. A compiler module: its Rust (src/bounds_hoist.rs) is deleted
# by the Rust compiler's retirement (SH6 lane 2), not by this flip.
name = "bounds-hoist"
lane = "SH3-12"
rust = ["src/bounds_hoist.rs"]
env = { CARGO_PROFILE_DEV_DEBUG = "0", CARGO_PROFILE_TEST_DEBUG = "0", CARGO_PROFILE_RELEASE_DEBUG = "0" }
build = ["cargo test --locked --release --test self_host_bounds_hoist_pass --test self_host_bounds_hoist --test self_host_bounds_hoist_jit --no-run"]

[[tests]]
run = "cargo test --locked --release --test self_host_bounds_hoist"

[[tests]]
run = "cargo test --locked --release --test self_host_bounds_hoist_jit"

# The whole corpus at the hoisting boundary (294 programs).
[differential]
run = "BOUNDS_HOIST_PASS_STRIDE=1 cargo test --locked --release --test self_host_bounds_hoist_pass pass_matches_bounds_hoist_run -- --nocapture"

# One epoch of a workload is about 35 s over the whole corpus.
[[abba]]
workload = "pass"
run = "BOUNDS_HOIST_GATE_WORKLOAD=pass CHECK_HARNESS_SPEED=1 cargo test --locked --release --test self_host_bounds_hoist_pass flip_gate -- --nocapture"

[[abba]]
workload = "hook"
run = "BOUNDS_HOIST_GATE_WORKLOAD=hook CHECK_HARNESS_SPEED=1 cargo test --locked --release --test self_host_bounds_hoist_pass flip_gate -- --nocapture"
